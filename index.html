<style>
:root {
  --orange: #FF6600;
  --bg: #000000;
  --surface: #1A1A1A;
  --row: #3A3A3A;
  --ink: #FFFFFF;
  --muted: #A6A6A6;
  --line: #333333;
  --open: #FF6600;
  --open-soft: #331A07;
  --closed: #E5483F;
  --closed-soft: #3A1614;
  --ok: #57C980;
  --ok-soft: #13301E;
  --link: #FF8A3D;
  --display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --text: "Barlow", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  color-scheme: dark;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
*, *::before, *::after { box-sizing: inherit; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font: 400 1rem/1.5 var(--text);
  min-height: 100vh;
  padding-bottom: 4.5rem;
}
a { color: var(--link); }
h1, h2, h3, legend { font-family: var(--display); font-weight: 600; line-height: 1.15; margin: 0; }
h2 { font-size: 1.9rem; }
h3 { font-size: 1.3rem; }
p { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: .875rem; }
.stack > * + * { margin-top: .75rem; }
.loading { color: var(--muted); padding: 2rem 0; text-align: center; }

/* Kopbalk */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  display: flex; align-items: center; justify-content: space-between; gap: 1rem;
  background: var(--orange); color: #FFFFFF;
  padding: .7rem 1rem;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--orange); }
.top h1 { font-size: 1.6rem; letter-spacing: .01em; }
.top select { background: transparent; color: #FFFFFF; border: 1px solid #ffffffaa; border-radius: 6px; padding: .3rem .5rem; font: 600 1rem var(--display); }
.top select option { color: #000; }

main { max-width: 760px; margin: 0 auto; padding: 1rem; background: var(--bg); min-height: calc(100vh - 3.5rem); }
@media (min-width: 800px) { body { background: var(--orange); } }
main > * + * { margin-top: 1rem; }

/* Onderbalk */
.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
  display: flex; background: var(--surface); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
.tabs a {
  flex: 1; text-align: center; padding: .85rem .25rem; text-decoration: none;
  color: var(--muted); font: 600 1.05rem var(--display); border-top: 3px solid transparent;
}
.tabs a.on { color: var(--ink); border-top-color: var(--orange); }
.tabs a { white-space: nowrap; }
@media (max-width: 420px) { .tabs a { font-size: .95rem; padding-left: .1rem; padding-right: .1rem; } }

/* Menu linksboven */
.menubtn { background: none; border: 0; color: #FFFFFF; width: 44px; height: 44px; margin: -.4rem 0 -.4rem -.5rem; display: grid; place-items: center; cursor: pointer; border-radius: 8px; }
.menubtn:hover { background: #00000022; }
.menu {
  position: fixed; z-index: 15; left: .5rem; top: calc(3.6rem + env(safe-area-inset-top, 0px));
  min-width: 14rem; background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
  box-shadow: 0 8px 24px #000a; overflow: hidden;
}
.menu a, .menu button {
  display: block; width: 100%; text-align: left; padding: .85rem 1.1rem; color: var(--ink); text-decoration: none;
  background: none; border: 0; font: 600 1.2rem var(--display); cursor: pointer;
}
.menu > * + * { border-top: 1px solid var(--line); }
.menu a:hover, .menu button:hover { background: var(--row); }

/* Panelen en formulieren */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 1rem; }
fieldset.panel { margin: 0; min-width: 0; }
legend { font-size: 1.15rem; padding: 0 .35rem; margin-left: -.35rem; }
.field { display: grid; gap: .3rem; }
.field > span { font-weight: 600; font-size: .9rem; }
input, select, textarea {
  font: inherit; color: var(--ink); background: var(--bg);
  border: 1px solid var(--line); border-radius: 8px; padding: .6rem .7rem; width: 100%; min-width: 0;
}
input[type=checkbox] { width: auto; }
input[type=color] { width: 3rem; padding: .15rem; height: 2.4rem; }
:focus-visible { outline: 3px solid var(--link); outline-offset: 2px; }
.btn {
  font: 600 1.05rem var(--display); letter-spacing: .02em;
  background: var(--orange); color: #000; border: 0; border-radius: 8px;
  padding: .65rem 1.1rem; cursor: pointer; text-decoration: none; display: inline-block;
}
.btn:disabled { opacity: .55; cursor: default; }
.btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
.btn.small { font-size: .95rem; padding: .35rem .7rem; }
.row { display: flex; gap: .5rem; align-items: center; }
.row.wrap { flex-wrap: wrap; }
.row.wrap > input { flex: 1 1 8rem; }

.seg { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); }
.seg > * {
  flex: 1; text-align: center; padding: .55rem .4rem; border: 0; background: none; color: var(--muted);
  font: 600 1rem var(--display); text-decoration: none; cursor: pointer;
}
.seg > .on { background: var(--orange); color: #000; }

.banner { border-left: 4px solid var(--line); background: var(--surface); padding: .7rem .9rem; border-radius: 0 8px 8px 0; }
.banner.yellow { border-color: var(--open); background: var(--open-soft); }
.banner.red { border-color: var(--closed); background: var(--closed-soft); }

/* Inloggen */
.auth { max-width: 420px; margin: 2rem auto 0; }
.auth > * + * { margin-top: 1rem; }
.brand h2 { font-size: 3rem; font-weight: 700; }
.flag {
  display: block; width: 72px; height: 36px; margin-bottom: .6rem; border-radius: 3px;
  background: repeating-conic-gradient(var(--ink) 0 25%, var(--surface) 0 50%) 0 0 / 18px 18px;
}

/* Volgende race */
.next {
  display: block; text-decoration: none; color: var(--ink); background: var(--surface);
  border: 2px solid var(--orange); border-radius: 12px; padding: 1.1rem 1.1rem 1rem; position: relative; overflow: hidden;
}
.next .rnd { font: 700 4.5rem/0.8 var(--display); color: #FF660055; position: absolute; right: .6rem; top: .6rem; }
.next h2 { font-size: 2.1rem; max-width: 80%; }
.next p { margin-top: .35rem; color: var(--muted); }
.meter { height: 6px; background: var(--row); border-radius: 3px; margin-top: .9rem; overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--open); }

/* Racelijst */
.races { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
.races li + li { border-top: 1px solid var(--line); }
.races a { display: grid; grid-template-columns: 2.4rem 1fr 22px 4.6rem; gap: .2rem .6rem; align-items: center; padding: .7rem .9rem; color: var(--ink); text-decoration: none; }
.races .chk { grid-row: span 2; display: grid; place-items: center; width: 22px; opacity: .85; }
.next .ok-mark { position: absolute; right: 1rem; bottom: .9rem; opacity: .85; line-height: 0; }
.next p:last-of-type { padding-right: 2rem; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.races .rnd { font: 700 1.6rem/1 var(--display); color: var(--muted); grid-row: span 2; }
.races .nm { font-weight: 600; }
.races .dt { font-size: .875rem; color: var(--muted); }
.races .cancel .nm { text-decoration: line-through; color: var(--muted); }
.pill { font: 600 .9rem var(--display); padding: .15rem .5rem; border-radius: 4px; grid-row: span 2; white-space: nowrap; text-align: center; align-self: center; }
.races .pill { justify-self: stretch; }
.races.hist a { grid-template-columns: 2.4rem 1fr 6.4rem; }
.pill.open { background: var(--orange); color: #000; }
.pill.closed { background: var(--row); color: var(--muted); }
.pill.cancel { background: var(--closed-soft); color: var(--closed); }
.pill.done { background: var(--ok-soft); color: var(--ok); }

/* Voorspellen */
.back { font-weight: 600; text-decoration: none; }
.gp-title { font-size: 2.3rem; }
.q { display: grid; grid-template-columns: 1fr auto; gap: .35rem .75rem; align-items: baseline; padding: .7rem 0; }
.q + .q { border-top: 1px solid var(--line); }
.q select, .q input { grid-column: 1 / -1; }
.q input[type=number] { max-width: 7rem; }
.pt { font: 600 .95rem var(--display); color: var(--muted); }
.savebar {
  position: sticky; bottom: calc(3.6rem + env(safe-area-inset-bottom, 0px));
  display: flex; align-items: center; justify-content: space-between; gap: 1rem;
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: .6rem .6rem .6rem 1rem;
}

/* Uitslag per vraag */
.qres > * + * { margin-top: .6rem; }
.qhead { display: flex; justify-content: space-between; gap: .75rem; font-weight: 600; }
.chips { display: flex; flex-wrap: wrap; gap: .4rem; align-items: center; }
.chip { display: inline-flex; align-items: center; gap: .3rem; padding: .2rem .55rem; border-radius: 5px; background: var(--ok-soft); color: var(--ok); font-weight: 600; }
.chip button { border: 0; background: none; color: inherit; font-size: 1.1rem; line-height: 1; cursor: pointer; padding: 0 .1rem; }
.addans { display: flex; gap: .5rem; }
.picks { list-style: none; margin: 0; padding: 0; }
.picks li { display: grid; grid-template-columns: 1fr auto 2.5rem; gap: .5rem; padding: .3rem 0; border-top: 1px dashed var(--line); }
.picks .gain { text-align: right; font: 700 1rem var(--display); color: var(--ok); }
.picks .hit span:nth-child(2) { color: var(--ok); font-weight: 600; }
.mine { display: grid; grid-template-columns: 2.5rem 1fr 2.5rem; gap: .5rem; align-items: baseline; background: var(--bg); border-radius: 6px; padding: .45rem .6rem; font-weight: 600; }
.gain { text-align: right; font: 700 1.1rem var(--display); color: var(--ok); }
.gain.zero { color: var(--muted); }

/* Stand */
.tower { list-style: none; margin: 0; padding: 0; }
.tower li {
  display: grid; grid-template-columns: 3rem 1fr auto auto; gap: .75rem; align-items: center;
  background: var(--surface); border: 1px solid var(--line); border-left: 6px solid var(--line);
  border-radius: 6px; padding: .55rem .9rem .55rem .6rem;
}
.tower li + li { margin-top: .4rem; }
.tower li.p1 { border-left-color: var(--orange); }
.tower .pos { font: 700 2rem/1 var(--display); text-align: center; }
.tower .who { font-weight: 600; }
.tower .last { font: 600 .95rem var(--display); color: var(--ok); }
.tower .pts { font: 700 1.6rem/1 var(--display); min-width: 2.5rem; text-align: right; }

/* Beheer */
.list { list-style: none; margin: 0; padding: 0; }
.list li { display: flex; justify-content: space-between; align-items: center; gap: .75rem; padding: .55rem 0; }
.list li + li { border-top: 1px solid var(--line); }
.drow select { max-width: 11rem; }
.drow .icon { width: 2.3rem; }
.sw { display: inline-block; width: .8rem; height: .8rem; border-radius: 2px; margin-right: .45rem; vertical-align: -1px; }
details.gpe { border-top: 1px solid var(--line); padding: .55rem 0; }
details.gpe summary { cursor: pointer; font-weight: 600; }
details.gpe form { margin-top: .75rem; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: .75rem; }
.check { display: flex; gap: .5rem; align-items: center; }
details.fold > summary {
  list-style: none; cursor: pointer; display: flex; align-items: center; gap: .6rem;
  font: 600 1.3rem var(--display);
}
details.fold > summary::-webkit-details-marker { display: none; }
details.fold > summary .state { margin-left: auto; font: 400 .9rem var(--text); color: var(--muted); }
details.fold > summary::after { content: "▾"; color: var(--orange); transition: transform .15s; }
details.fold[open] > summary::after { transform: rotate(180deg); }
details.fold[open] > summary { margin-bottom: .9rem; }
@media (prefers-reduced-motion: reduce) { details.fold > summary::after { transition: none; } }

/* Vragen beheren */
.qhdr, .qline { display: grid; grid-template-columns: minmax(0, 1fr) 12rem 4.5rem 6.5rem; gap: .5rem; align-items: center; }
.qhdr { font-size: .85rem; color: var(--muted); margin-bottom: .3rem; }
.qhdr span:nth-child(3) { text-align: center; }
.qline + .qline { margin-top: .35rem; }
.qline input, .qline select { padding: .4rem .6rem; }
.qline input[type=number] { text-align: center; }
.qline .icon { justify-self: start; width: 2.3rem; }
.qline.add { margin-top: .7rem; padding-top: .7rem; border-top: 1px dashed var(--line); }
.icon { background: none; border: 1px solid var(--line); color: var(--muted); border-radius: 6px; height: 2.2rem; cursor: pointer; font-size: 1.2rem; }
@media (max-width: 640px) {
  .qhdr { display: none; }
  .qline { grid-template-columns: minmax(0, 1fr) 4.5rem; }
  .qline > :first-child { grid-column: 1 / -1; }
  .qline + .qline { margin-top: .9rem; }
}

/* Beheer op de computer: breed */
body.wide main { max-width: 1200px; }

/* Uitslagen invullen */
.resline { display: grid; grid-template-columns: minmax(0, 1fr) 15rem 6rem; gap: .75rem; align-items: center; padding: .35rem 0; }
.resline + .resline { border-top: 1px solid var(--line); }
.resline input, .resline select { padding: .4rem .6rem; }
@media (max-width: 640px) {
  .resline { grid-template-columns: minmax(0, 1fr) auto; }
  .resline > :first-child { grid-column: 1 / -1; }
}


.tag { font: 500 .85rem var(--text); justify-self: start; color: var(--muted); }
.tag.prop { color: #E08A4F; }
.tag.auto { color: var(--muted); }
.tag.edit { color: var(--ink); }
.resline.isprop input, .resline.isprop select { border-color: #8A4A22; }
.resline.edited input, .resline.edited select { border-style: dashed; border-color: #6A6A6A; }

/* Spelregels */
.rules p { margin: 0 0 1.1rem; line-height: 1.65; }
.rules .rh { font: 400 1.05rem var(--text); display: inline-block; border-bottom: 1px solid var(--orange); padding: 0 1rem .1rem 0; margin: .4rem 0 .2rem; }
.rules .rh b { font-weight: 600; }
.rtable { overflow-x: auto; margin: .4rem 0 1.4rem; }
.rtable table { border-collapse: collapse; margin: 0 auto; }
.rtable th { text-align: left; font-weight: 600; padding: .25rem .6rem; }
.rtable td { padding: .3rem .6rem; }
.rtable .blk td { border: 1px solid var(--orange); }
.rtable .blk td.cat { vertical-align: top; }
.rtable .num { text-align: center; min-width: 4rem; }
.rtable .gap td { height: 1.2rem; border: 0; }
.rtable .sub { padding-top: 0; }
.prize { display: grid; grid-template-columns: 6rem 3.5rem; row-gap: .2rem; line-height: 1.65; margin-bottom: 1.1rem; }
.prize span:nth-child(even) { text-align: right; font-variant-numeric: tabular-nums; }

.ntline { display: grid; grid-template-columns: auto 8rem; gap: .75rem; align-items: end; }
@media (max-width: 640px) { .ntline { grid-template-columns: 1fr 1fr; } .ntline .check { grid-column: 1 / -1; } }

/* Overzicht voorspellingen per race */
.pmx { overflow-x: auto; background: #000; border: 1px solid var(--line); border-radius: 10px; }
.pmx table { border-collapse: collapse; font-size: .95rem; min-width: 100%; }
.pmx th, .pmx td { padding: .32rem .7rem; text-align: left; white-space: nowrap; font-weight: 400; vertical-align: top; }
.pmx thead th { font-weight: 600; padding-top: .6rem; }
.pmx .q { position: sticky; left: 0; z-index: 1; background: #000; white-space: normal; min-width: 10.5rem; max-width: 16rem; }
@media (min-width: 700px) { .pmx .q { white-space: nowrap; max-width: none; } }
.pmx .alt { background: var(--row); }
.pmx .res { background: var(--surface); font-weight: 600; border-left: 2px solid var(--orange); border-right: 2px solid var(--orange); }
.pmx thead th.res { color: var(--orange); }
.pmx th.me { color: var(--orange); }
.pmx .tot td { font: 700 1.15rem var(--display); color: var(--ink); }
.pmx .tot td.res { background: var(--surface); }
.pmx .tot th { font-size: .85rem; color: var(--muted); }
.pmx .cat th { color: var(--orange); font-weight: 600; padding-top: 1rem; }
.pmx td.hit { color: var(--ok); font-weight: 600; }
.pmx .plus { font: 700 .85rem var(--display); }
.pmx td.none { color: var(--muted); }

.times { display: grid; grid-template-columns: auto 1fr; gap: 0 .5rem; margin: 0; color: var(--muted); }
.times dt, .times dd { margin: 0; }

/* Punten per race */
.matrix { overflow-x: auto; background: #000; border: 1px solid var(--line); border-radius: 10px; padding: .4rem 0 .6rem; }
.matrix table { border-collapse: collapse; font-size: 1rem; }
.matrix th { font-weight: 500; color: var(--ink); vertical-align: bottom; padding: .6rem 0 .7rem; }
.matrix th.v span { writing-mode: vertical-rl; transform: rotate(180deg); white-space: nowrap; display: inline-block; }
.matrix th.x span { text-decoration: line-through; color: var(--muted); }
.matrix th.v, .matrix td { width: 2.6rem; min-width: 2.6rem; text-align: center; }
.matrix td { padding: .45rem .3rem; font-variant-numeric: tabular-nums; }
.matrix td.nm, .matrix th.nm { width: auto; min-width: 6rem; text-align: left; padding: .45rem 1.2rem .45rem .9rem; white-space: nowrap; position: sticky; left: 0; background: #000; }
.matrix td.tot { width: 3.4rem; min-width: 3.4rem; font: 700 1.15rem var(--display); color: var(--orange); }
.matrix th.v.totc { padding-right: .4rem; }
.matrix tbody tr:nth-child(odd) td:not(.nm) { background: var(--row); }
.matrix tbody tr:nth-child(even) td:not(.nm) { background: #000; }
.matrix tbody td:last-child { padding-right: .9rem; }

#toast {
  position: fixed; left: 50%; bottom: calc(5rem + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%) translateY(1rem);
  background: var(--ink); color: var(--surface); padding: .65rem 1rem; border-radius: 8px; max-width: calc(100% - 2rem);
  opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 20;
}
#toast.show { opacity: 1; transform: translateX(-50%); }
@media (prefers-reduced-motion: reduce) { #toast { transition: none; } }
</style>

const FIELD = { coureur: "driver_id", team: "team_id", positie: "position" };

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const state = { user: null, me: null, aal: "aal1", season: null, seasons: [], teams: [], drivers: [], lineup: [], profiles: [] };

// ---------------------------------------------------------------------
// Hulpfuncties
// ---------------------------------------------------------------------
const $ = s => document.querySelector(s);
const view = () => $("#view");
const LOADING = `<p class="loading">Laden…</p>`;
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function toast(msg) {
  const t = $("#toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => t.classList.remove("show"), Math.max(3500, msg.length * 60));
}
const fmtDate = d => d ? new Date(d).toLocaleDateString("nl-NL", { weekday: "short", day: "numeric", month: "short" }) : "datum onbekend";
const fmtDateTime = d => d ? new Date(d).toLocaleString("nl-NL", { weekday: "short", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }) : "nog niet bekend";
function toLocalInput(d) {
  if (!d) return "";
  const x = new Date(d);
  return new Date(x.getTime() - x.getTimezoneOffset() * 60000).toISOString().slice(0, 16);
}
const fromLocalInput = v => v ? new Date(v).toISOString() : null;
function untilText(d) {
  const ms = new Date(d) - Date.now();
  if (ms <= 0) return "gesloten";
  const h = Math.floor(ms / 36e5);
  if (h < 1) return `nog ${Math.max(1, Math.round(ms / 6e4))} minuten`;
  if (h < 48) return `nog ${h} uur`;
  return `nog ${Math.floor(h / 24)} dagen`;
}
const validColor = c => /^#[0-9a-f]{6}$/i.test(c || "") ? c : "#999999";
const driverById = id => state.drivers.find(d => d.id === id);
const teamById = id => state.teams.find(t => t.id === id);
const shortName = d => `${d.first_name ? d.first_name[0] + ". " : ""}${d.last_name}`;
const driverName = id => { const d = driverById(id); return d ? shortName(d) : "Onbekende coureur"; };
const teamName = id => teamById(id)?.name || "Onbekend team";
const answerValue = (q, a) => a ? a[FIELD[q.answer_type]] : null;
function answerRow(q, value) {
  const r = { driver_id: null, team_id: null, position: null };
  r[FIELD[q.answer_type]] = Number(value);
  return r;
}
function answerLabel(q, a) {
  if (!a) return "–";
  if (q.answer_type === "coureur") return driverName(a.driver_id);
  if (q.answer_type === "team") return teamName(a.team_id);
  return a.position ? `P${a.position}` : "–";
}
const sameAnswer = (a, b) =>
  (a.driver_id ?? null) === (b.driver_id ?? null) &&
  (a.team_id ?? null) === (b.team_id ?? null) &&
  (a.position ?? null) === (b.position ?? null);
const isOpen = (deadline, cancelled) => !cancelled && (!deadline || new Date(deadline) > new Date());

function answerInput(q, selected, attrs) {
  if (q.answer_type === "positie") {
    return `<input type="number" min="1" max="${POSITIONS}" inputmode="numeric" placeholder="Positie" value="${selected ?? ""}" ${attrs}>`;
  }
  return `<select ${attrs}>${optionsFor(q, selected)}</select>`;
}

function optionsFor(q, selected) {
  if (q.answer_type === "positie") {
    return `<option value="">Kies een positie</option>` +
      Array.from({ length: POSITIONS }, (_, i) => `<option value="${i + 1}" ${selected === i + 1 ? "selected" : ""}>P${i + 1}</option>`).join("");
  }
  if (q.answer_type === "team") {
    return `<option value="">Kies een team</option>` + state.teams
      .filter(t => t.active || t.id === selected)
      .map(t => `<option value="${t.id}" ${t.id === selected ? "selected" : ""}>${esc(t.name)}</option>`).join("");
  }
  const opt = d => `<option value="${d.id}" ${d.id === selected ? "selected" : ""}>${esc(shortName(d))}</option>`;
  const inLineup = new Set(state.lineup.map(l => l.driver_id));
  const groups = state.teams.map(t => ({
    t, ds: state.lineup.filter(l => l.team_id === t.id).map(l => driverById(l.driver_id)).filter(Boolean),
  })).filter(g => g.ds.length);
  const others = state.drivers.filter(d => !inLineup.has(d.id) && (d.active || d.id === selected));
  return `<option value="">Kies een coureur</option>` +
    groups.map(g => `<optgroup label="${esc(g.t.name)}">${g.ds.map(opt).join("")}</optgroup>`).join("") +
    (others.length ? `<optgroup label="${groups.length ? "Overige coureurs" : "Coureurs"}">${others.map(opt).join("")}</optgroup>` : "");
}

// ---------------------------------------------------------------------
// Inloggen
// ---------------------------------------------------------------------
async function init() {
  const { data: { session } } = await sb.auth.getSession();
  sb.auth.onAuthStateChange(ev => { if (ev === "SIGNED_OUT") { state.user = null; renderAuth(); } });
  if (session) await afterLogin(session.user);
  else renderAuth();
}

function authError(err) {
  const m = err?.message || "";
  if (/database error/i.test(m)) return "Dit e-mailadres is niet uitgenodigd. Vraag de beheerder om een uitnodiging.";
  if (/invalid login/i.test(m)) return "E-mailadres of wachtwoord klopt niet.";
  if (/already registered/i.test(m)) return "Er bestaat al een account met dit e-mailadres. Log in.";
  if (/password/i.test(m)) return "Kies een wachtwoord van minstens 8 tekens.";
  return "Dat lukte niet: " + m;
}

function renderMfaPrompt(user) {
  $("#tabs").hidden = true;
  $("#menuBtn").hidden = true;
  setTitle("F1 Poule");
  view().innerHTML = `
    <section class="auth">
      <div class="brand"><h2>Tweestapsverificatie</h2>
        <p class="muted">Vul de code van 6 cijfers uit je authenticator-app in.</p></div>
      <form id="mfaForm" class="panel stack">
        <label class="field"><span>Code</span><input name="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required autofocus></label>
        <button class="btn">Bevestigen</button>
        <button type="button" class="btn ghost" id="mfaCancel">Uitloggen</button>
      </form>
    </section>`;
  $("#mfaForm").onsubmit = async e => {
    e.preventDefault();
    const code = String(new FormData(e.target).get("code")).trim();
    const { data: f } = await sb.auth.mfa.listFactors();
    const totp = f?.totp?.[0];
    if (!totp) return toast("Er is geen authenticator gekoppeld.");
    const { error } = await sb.auth.mfa.challengeAndVerify({ factorId: totp.id, code });
    if (error) return toast("De code klopt niet. Probeer het opnieuw.");
    afterLogin(user);
  };
  $("#mfaCancel").onclick = () => sb.auth.signOut();
}

function renderAuth(mode = "login") {
  $("#tabs").hidden = true;
  $("#menuBtn").hidden = true;
  closeMenu();
  $("#seasonPick").innerHTML = "";
  $("#title").textContent = "F1 Poule";
  window.onhashchange = null;
  view().innerHTML = `
    <section class="auth">
      <div class="brand">
        <span class="flag" aria-hidden="true"></span>
        <h2>F1 Poule</h2>
        <p class="muted">Voorspel elk raceweekend wie er wint, wie uitvalt en wie de snelste ronde rijdt.</p>
      </div>
      <div class="seg">
        <button type="button" data-mode="login" class="${mode === "login" ? "on" : ""}">Inloggen</button>
        <button type="button" data-mode="signup" class="${mode === "signup" ? "on" : ""}">Account maken</button>
      </div>
      <form id="authForm" class="panel stack">
        ${mode === "signup" ? `<label class="field"><span>Naam</span><input name="name" required maxlength="40" autocomplete="nickname"></label>` : ""}
        <label class="field"><span>E-mailadres</span><input name="email" type="email" required autocomplete="email"></label>
        <label class="field"><span>Wachtwoord</span><input name="password" type="password" required minlength="8" autocomplete="${mode === "login" ? "current-password" : "new-password"}"></label>
        ${mode === "signup" ? `<p class="muted small">Gebruik het e-mailadres waarop je bent uitgenodigd.</p>` : ""}
        <button class="btn" type="submit">${mode === "login" ? "Inloggen" : "Account maken"}</button>
      </form>
    </section>`;
  view().querySelectorAll("[data-mode]").forEach(b => b.onclick = () => renderAuth(b.dataset.mode));
  $("#authForm").onsubmit = async e => {
    e.preventDefault();
    const f = new FormData(e.target);
    const btn = e.target.querySelector("button[type=submit]");
    const email = String(f.get("email")).trim().toLowerCase();
    const password = String(f.get("password"));
    btn.disabled = true;
    const res = mode === "login"
      ? await sb.auth.signInWithPassword({ email, password })
      : await sb.auth.signUp({ email, password, options: { data: { display_name: String(f.get("name")).trim() } } });
    btn.disabled = false;
    if (res.error) return toast(authError(res.error));
    if (!res.data.session) { toast("Account gemaakt. Log nu in."); return renderAuth("login"); }
    afterLogin(res.data.session.user);
  };
}

async function afterLogin(user) {
  const { data: aal } = await sb.auth.mfa.getAuthenticatorAssuranceLevel();
  if (aal && aal.nextLevel === "aal2" && aal.currentLevel !== "aal2") return renderMfaPrompt(user);
  state.aal = aal?.currentLevel || "aal1";
  state.user = user;
  view().innerHTML = LOADING;
  const { data: me } = await sb.from("profiles").select("*").eq("id", user.id).single();
  state.me = me;
  await loadBase();
  $("#tabs").hidden = false;
  $("#admMenu").hidden = !state.me?.is_admin;
  $("#resTab").hidden = !state.me?.is_admin;
  $("#menuBtn").hidden = false;
  window.onhashchange = route;
  route();
}

async function loadBase() {
  const [s, t, d, p] = await Promise.all([
    sb.from("seasons").select("*").order("year", { ascending: false }),
    sb.from("teams").select("*").order("name"),
    sb.from("drivers").select("*").order("last_name"),
    sb.from("profiles").select("id, display_name, is_admin").order("display_name"),
  ]);
  state.seasons = s.data || [];
  state.teams = t.data || [];
  state.drivers = d.data || [];
  state.profiles = p.data || [];
  if (!state.seasons.some(x => x.year === state.season)) {
    const y = new Date().getFullYear();
    state.season = (state.seasons.find(x => x.year === y) || state.seasons[0])?.year ?? null;
  }
  await loadLineup();
  renderSeasonPicker();
}

async function loadLineup() {
  if (!state.season) { state.lineup = []; return; }
  const { data } = await sb.from("season_drivers").select("*").eq("season", state.season);
  state.lineup = data || [];
}

async function setSeason(year) {
  if (year === state.season) return;
  state.season = year;
  await loadLineup();
  renderSeasonPicker();
}

function renderSeasonPicker() {
  const el = $("#seasonPick");
  if (!state.user || !state.seasons.length) { el.innerHTML = ""; return; }
  el.innerHTML = `<select aria-label="Seizoen">${state.seasons.map(s =>
    `<option value="${s.year}" ${s.year === state.season ? "selected" : ""}>${s.year}</option>`).join("")}</select>`;
  el.querySelector("select").onchange = async e => {
    await setSeason(Number(e.target.value));
    if (location.hash.startsWith("#gp/") || location.hash.startsWith("#seizoen/")) location.hash = "#races";
    else route();
  };
}

// ---------------------------------------------------------------------
// Navigatie
// ---------------------------------------------------------------------
function route() {
  const [page, arg] = (location.hash.slice(1) || "races").split("/");
  closeMenu();
  document.body.classList.toggle("wide", page === "beheer" || page === "uitslagen");
  setTab(["gp", "seizoen"].includes(page) ? null : page);
  window.scrollTo(0, 0);
  if (page === "gp") return renderGp(Number(arg));
  if (page === "seizoen") return renderSeasonQs(Number(arg));
  if (page === "stand") return renderStand();
  if (page === "voorspellingen") return renderHistory(arg || "weekend");
  if (page === "profiel") return renderProfile();
  if (page === "beheer" && state.me?.is_admin) return renderAdmin(arg || "kalender");
  if (page === "uitslagen" && state.me?.is_admin) return renderResultsTab();
  if (page === "spelregels") return renderRules();
  return renderRaces();
}

async function seasonOverview(year) {
  const { data: gps } = await sb.from("grand_prix").select("*").eq("season", year)
    .order("race_start", { ascending: true, nullsFirst: false }).order("round");
  const ids = (gps || []).map(g => g.id);
  const [gq, sq, mine] = await Promise.all([
    ids.length ? sb.from("gp_questions").select("id, grand_prix_id").in("grand_prix_id", ids) : { data: [] },
    sb.from("gp_questions").select("id").eq("season", year),
    sb.from("predictions").select("gp_question_id").eq("user_id", state.user.id),
  ]);
  const done = new Set((mine.data || []).map(p => p.gp_question_id));
  const per = {};
  for (const q of gq.data || []) {
    const r = per[q.grand_prix_id] ||= { total: 0, filled: 0, qids: [] };
    r.total++;
    r.qids.push(q.id);
    if (done.has(q.id)) r.filled++;
  }
  const seasonQs = sq.data || [];
  return {
    gps: gps || [], per, seasonQs,
    seasonFilled: seasonQs.filter(q => done.has(q.id)).length,
    seasonRow: state.seasons.find(s => s.year === year),
  };
}

const noSeason = () => `<div class="panel stack"><p>Er staat nog geen seizoen klaar.</p>
  ${state.me?.is_admin ? `<a class="btn" href="#beheer/kalender">Seizoen toevoegen</a>` : `<p class="muted">De beheerder zet de kalender klaar.</p>`}</div>`;

// Races: alleen wat nog ingevuld kan worden, de eerstvolgende bovenaan
async function renderRaces() {
  setTitle("Races");
  if (!state.season) { view().innerHTML = noSeason(); return; }
  view().innerHTML = LOADING;
  const year = state.season;
  const { gps, per, seasonQs, seasonFilled, seasonRow } = await seasonOverview(year);
  const open = gps.filter(g => isOpen(g.closes_at, g.status === "geannuleerd"))
    .sort((a, b) => new Date(a.closes_at || a.race_start || 0) - new Date(b.closes_at || b.race_start || 0));
  const seasonOpen = seasonQs.length && isOpen(seasonRow?.deadline, false);

  let html = "";
  if (seasonOpen) {
    html += `<ul class="races"><li><a href="#seizoen/${year}">
      <span class="rnd">${String(year).slice(2)}</span>
      <span class="nm">Seizoensvragen</span>
      ${checkMark({ filled: seasonFilled, total: seasonQs.length })}
      ${pill(true, false, seasonFilled, seasonQs.length)}
      <span class="dt">Invullen kan tot ${fmtDateTime(seasonRow?.deadline)}</span>
    </a></li></ul>`;
  }
  const [next, ...rest] = open;
  if (next) {
    const r = per[next.id] || { filled: 0, total: 0 };
    html += `
      <a class="next" href="#gp/${next.id}">
        <span class="rnd" aria-hidden="true">${next.round ?? ""}</span>
        <h2>${esc(next.name)}</h2>
        <p>Race: ${fmtDateTime(next.race_start)}. Invullen en wijzigen kan tot ${fmtDateTime(next.closes_at)}${next.closes_at ? `, ${untilText(next.closes_at)}` : ""}.</p>
        <div class="meter"><i style="width:${r.total ? Math.round(r.filled / r.total * 100) : 0}%"></i></div>
        <p>${r.total && r.filled === r.total ? "Alles ingevuld. Je kunt nog wijzigen tot de sluitingstijd." : `${r.filled} van ${r.total} vragen ingevuld`}</p>
        ${r.total && r.filled === r.total ? `<span class="ok-mark">${CHECK_SVG}</span>` : ""}
      </a>`;
  }
  if (rest.length) {
    html += `<ul class="races">${rest.map(g => {
      const r = per[g.id];
      return `<li><a href="#gp/${g.id}">
        <span class="rnd">${g.round ?? "–"}</span>
        <span class="nm">${esc(g.name)}</span>
        ${checkMark(r)}
        ${pill(true, false, r?.filled, r?.total)}
        <span class="dt">${fmtDateTime(g.race_start)}${g.status === "verplaatst" ? ", verplaatst" : ""}</span>
      </a></li>`;
    }).join("")}</ul>`;
  }
  if (!next && !seasonOpen) {
    html += gps.length
      ? `<div class="panel stack"><p>Er staan geen races meer open in ${year}.</p><a class="btn ghost" href="#voorspellingen">Bekijk de voorspellingen</a></div>`
      : `<div class="panel stack"><p>De kalender voor ${year} is nog leeg.</p>
        ${state.me?.is_admin ? `<a class="btn" href="#beheer/kalender">Kalender ophalen</a>` : ""}</div>`;
  }
  view().innerHTML = html;
}

// Voorspellingen: gesloten races van dit seizoen, de laatste bovenaan
// Tot en met de woensdag na de race blijft een raceweekend zichtbaar
function showUntil(raceStart) {
  const d = new Date(raceStart);
  d.setDate(d.getDate() + (((3 - d.getDay() + 7) % 7) || 7));
  d.setHours(23, 59, 59, 999);
  return d;
}

async function renderHistory(sub) {
  setTitle("Voorspellingen");
  if (!state.season) { view().innerHTML = noSeason(); return; }
  const prefix = `<nav class="seg">
    <a href="#voorspellingen/weekend" class="${sub === "weekend" ? "on" : ""}">Dit raceweekend</a>
    <a href="#voorspellingen/alle" class="${sub === "alle" ? "on" : ""}">Al mijn voorspellingen</a>
  </nav>`;
  view().innerHTML = prefix + LOADING;
  if (sub === "weekend") return renderWeekend(prefix);
  const year = state.season;
  const { gps, per, seasonQs, seasonRow } = await seasonOverview(year);
  const closed = gps.filter(g => !isOpen(g.closes_at, g.status === "geannuleerd"))
    .sort((a, b) => new Date(b.race_start || 0) - new Date(a.race_start || 0));
  const seasonClosed = seasonQs.length && !isOpen(seasonRow?.deadline, false);
  const qids = [...closed.flatMap(g => per[g.id]?.qids || []), ...(seasonClosed ? seasonQs.map(q => q.id) : [])];
  const [sc, ca] = qids.length ? await Promise.all([
    sb.from("scores").select("gp_question_id, points").eq("user_id", state.user.id).in("gp_question_id", qids),
    sb.from("correct_answers").select("gp_question_id").in("gp_question_id", qids).neq("source", "voorstel"),
  ]) : [{ data: [] }, { data: [] }];
  const pts = Object.fromEntries((sc.data || []).map(x => [x.gp_question_id, x.points]));
  const hasResult = new Set((ca.data || []).map(x => x.gp_question_id));
  const sum = ids => ids.reduce((t, id) => t + (pts[id] || 0), 0);
  const badge = ids => ids.some(id => hasResult.has(id))
    ? `<span class="pill done">+${sum(ids)}</span>`
    : `<span class="pill closed">Geen uitslag</span>`;

  if (!closed.length && !seasonClosed) {
    view().innerHTML = prefix + `<div class="panel"><p>Nog geen gesloten races in ${year}. Zodra een race sluit, zie je hier je eigen voorspelling, die van de anderen en je punten.</p></div>`;
    return;
  }
  view().innerHTML = prefix + `<p class="muted">Tik op een race voor je eigen voorspelling, die van de anderen en de punten.</p>
    <ul class="races hist">
      ${closed.map(g => {
        const cancelled = g.status === "geannuleerd";
        return `<li class="${cancelled ? "cancel" : ""}"><a href="#gp/${g.id}">
          <span class="rnd">${g.round ?? "–"}</span>
          <span class="nm">${esc(g.name)}</span>
          ${cancelled ? `<span class="pill cancel">Geannuleerd</span>` : badge(per[g.id]?.qids || [])}
          <span class="dt">${fmtDate(g.race_start)}</span>
        </a></li>`;
      }).join("")}
      ${seasonClosed ? `<li><a href="#seizoen/${year}">
        <span class="rnd">${String(year).slice(2)}</span>
        <span class="nm">Seizoensvragen</span>
        ${badge(seasonQs.map(q => q.id))}
        <span class="dt">Gesloten ${fmtDate(seasonRow?.deadline)}</span>
      </a></li>` : ""}
    </ul>`;
}

// Dit raceweekend: na het sluiten iedereens voorspelling, tot en met woensdag na de race.
// Daarna de volgende race, met alleen je eigen antwoorden.
async function renderWeekend(prefix) {
  const { data: gps } = await sb.from("grand_prix").select("*").eq("season", state.season)
    .neq("status", "geannuleerd").order("race_start", { ascending: true, nullsFirst: false });
  const now = new Date();
  const current = (gps || []).find(g => g.closes_at && new Date(g.closes_at) <= now && now <= showUntil(g.race_start));
  if (current) return renderGp(current.id, { prefix });

  const next = (gps || []).find(g => !g.closes_at || new Date(g.closes_at) > now);
  if (!next) {
    view().innerHTML = prefix + `<div class="panel"><p>Er komen geen races meer in ${state.season}.</p></div>`;
    return;
  }
  const { data: qs } = await sb.from("gp_questions").select("*").eq("grand_prix_id", next.id).order("sort_order");
  const ids = (qs || []).map(q => q.id);
  const { data: mineRows } = ids.length
    ? await sb.from("predictions").select("*").eq("user_id", state.user.id).in("gp_question_id", ids)
    : { data: [] };
  const mine = Object.fromEntries((mineRows || []).map(p => [p.gp_question_id, p]));
  const groups = CATS.map(([k, l]) => ({ l, items: (qs || []).filter(q => q.category === k) })).filter(g => g.items.length);
  view().innerHTML = prefix + `
    <div><h2 class="gp-title">${esc(next.name)}</h2>
      ${timesBlock(next)}</div>
    <p class="banner">De voorspellingen van iedereen worden zichtbaar op ${fmtDateTime(next.closes_at)}, zodra het invullen sluit. Hieronder zie je alleen wat jij hebt ingevuld.</p>
    ${groups.map(g => `<fieldset class="panel"><legend>${g.l}</legend>
      <ul class="list">${g.items.map(q => `<li><span>${esc(q.text)}</span>
        <span class="${mine[q.id] ? "" : "muted"}" style="text-align:right">${mine[q.id] ? esc(answerLabel(q, mine[q.id])) : "niet ingevuld"}</span></li>`).join("")}</ul>
    </fieldset>`).join("")}
    <a class="btn" href="#gp/${next.id}">Invullen of wijzigen</a>`;
}

  <circle cx="12" cy="12" r="11" fill="url(#okg)"/>
  <path d="M7.2 12.4l3.1 3.1 6.5-6.6" fill="none" stroke="#F4F7F5" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const checkMark = r => r?.total && r.filled === r.total
  ? `<span class="chk" title="Alles ingevuld">${CHECK_SVG}<span class="sr-only">Alles ingevuld</span></span>`
  : `<span class="chk"></span>`;

// Kwalificatie en race netjes onder elkaar
const timesBlock = g => `<dl class="times">
  ${g.quali_start ? `<dt>Kwalificatie:</dt><dd>${fmtDateTime(g.quali_start)}</dd>` : ""}
  <dt>Race:</dt><dd>${fmtDateTime(g.race_start)}</dd></dl>`;

function pill(open, cancelled, filled = 0, total = 0) {
  if (cancelled) return `<span class="pill cancel">Geannuleerd</span>`;
  if (!open) return `<span class="pill closed">Gesloten</span>`;
  if (total && filled === total) return `<span class="pill done">Ingevuld</span>`;
  return `<span class="pill open">${filled}/${total}</span>`;
}

async function renderGp(id, extra = {}) {
  if (!extra.prefix) view().innerHTML = LOADING;
  const { data: gp } = await sb.from("grand_prix").select("*").eq("id", id).maybeSingle();
  if (!gp) { view().innerHTML = `<p class="panel">Deze grand prix bestaat niet (meer). <a href="#races">Naar alle races</a></p>`; return; }
  if (gp.season !== state.season) await setSeason(gp.season);
  const { data: qs } = await sb.from("gp_questions").select("*").eq("grand_prix_id", id).order("sort_order");
  renderQuestionPage({
    kind: "gp", gp, qs: qs || [], deadline: gp.closes_at, cancelled: gp.status === "geannuleerd", title: gp.name, ...extra,
  });
}

async function renderSeasonQs(year) {
  view().innerHTML = LOADING;
  await setSeason(year);
  const s = state.seasons.find(x => x.year === year);
  const { data: qs } = await sb.from("gp_questions").select("*").eq("season", year).order("sort_order");
  renderQuestionPage({ kind: "seizoen", year, qs: qs || [], deadline: s?.deadline, cancelled: false, title: `Seizoensvragen ${year}` });
}

async function renderQuestionPage(ctx) {
  const { kind, gp, qs, deadline, cancelled, title } = ctx;
  setTitle(kind === "gp" ? "Grand prix" : "Seizoen");
  const ids = qs.map(q => q.id);
  let preds = [], answers = [];
  if (ids.length) {
    const [p, a] = await Promise.all([
      sb.from("predictions").select("*").in("gp_question_id", ids),
      sb.from("correct_answers").select("*").in("gp_question_id", ids).neq("source", "voorstel").order("created_at"),
    ]);
    preds = p.data || [];
    answers = a.data || [];
  }
  const open = isOpen(deadline, cancelled);
  const mine = Object.fromEntries(preds.filter(p => p.user_id === state.user.id).map(p => [p.gp_question_id, p]));

  setTab(ctx.prefix ? "voorspellingen" : open ? "races" : "voorspellingen");
  if (ctx.prefix) setTitle("Voorspellingen");
  let html = (ctx.prefix ?? `<div class="row" style="justify-content:space-between">
      <a class="back" href="${open ? "#races" : "#voorspellingen/alle"}">${open ? "Alle races" : "Alle voorspellingen"}</a>
      ${open && kind === "gp" && qs.length ? `<button type="button" class="btn ghost small" id="copyPrev">Vorige overnemen</button>` : ""}
    </div>`) + `
    <div><h2 class="gp-title">${esc(title)}</h2>
    ${kind === "gp" ? `<p class="muted">${esc([gp.circuit, gp.country].filter(Boolean).join(", "))}</p>
      ${timesBlock(gp)}` : ""}</div>`;

  if (cancelled) html += `<p class="banner red">Deze grand prix is geannuleerd en telt niet mee voor de stand.</p>`;
  else if (gp?.status === "verplaatst") html += `<p class="banner">Deze race is verplaatst. Je voorspellingen blijven gewoon staan.</p>`;
  if (!cancelled && open) {
    html += deadline
      ? `<p class="banner yellow">Invullen en wijzigen kan tot ${fmtDateTime(deadline)} (${untilText(deadline)}).</p>`
      : `<p class="banner yellow">De sluitingstijd is nog niet bekend.</p>`;
  }

  if (!qs.length) {
    html += `<div class="panel stack"><p>Er zijn ${cancelled ? "voor deze race geen" : "nog geen"} vragen.</p>
</div>`;
    view().innerHTML = html;
    return;
  }

  const groups = CATS.map(([k, l]) => ({ l, items: qs.filter(q => q.category === k) })).filter(g => g.items.length);

  if (open) {
    html += `<form id="predForm" class="stack">
      ${groups.map(g => `<fieldset class="panel"><legend>${g.l}</legend>
        ${g.items.map(q => `<label class="q">
          <span>${esc(q.text)}</span>
          ${answerInput(q, answerValue(q, mine[q.id]), `name="q${q.id}" aria-label="Antwoord"`)}
        </label>`).join("")}
      </fieldset>`).join("")}
      <div class="savebar"><span class="small" id="filled"></span><button class="btn" type="submit">Voorspelling opslaan</button></div>
    </form>`;
    view().innerHTML = html;
    const form = $("#predForm");
    const count = () => {
      const n = qs.filter(q => form.elements["q" + q.id].value).length;
      $("#filled").textContent = `${n} van ${qs.length} ingevuld`;
    };
    count();
    form.onchange = count;
    const cp = $("#copyPrev");
    if (cp) cp.onclick = async () => {
      const empty = qs.filter(q => !form.elements["q" + q.id].value);
      if (!empty.length) return toast("Alles is al ingevuld.");
      cp.disabled = true;
      // De laatste eerdere race van dit seizoen waarvoor je iets hebt ingevuld
      const { data: prevGps } = await sb.from("grand_prix").select("id, name").eq("season", gp.season)
        .lt("race_start", gp.race_start).order("race_start", { ascending: false });
      let from = null, prevByQ = {};
      for (const pg of prevGps || []) {
        const { data: pq } = await sb.from("gp_questions").select("id, question_id").eq("grand_prix_id", pg.id);
        if (!pq?.length) continue;
        const { data: pp } = await sb.from("predictions").select("*").eq("user_id", state.user.id).in("gp_question_id", pq.map(x => x.id));
        if (!pp?.length) continue;
        from = pg;
        for (const p of pp) {
          const qid = pq.find(x => x.id === p.gp_question_id)?.question_id;
          if (qid) prevByQ[qid] = p;
        }
        break;
      }
      cp.disabled = false;
      if (!from) return toast("Je hebt nog geen eerdere voorspelling om over te nemen.");
      let n = 0;
      for (const q of empty) {
        const v = answerValue(q, prevByQ[q.question_id]);
        if (v == null) continue;
        const el = form.elements["q" + q.id];
        el.value = String(v);
        if (el.value === String(v)) n++;
      }
      count();
      toast(n ? `${n} ${n === 1 ? "antwoord" : "antwoorden"} overgenomen van ${from.name}. Controleer ze en sla je voorspelling op.`
              : `Er viel niets over te nemen van ${from.name}.`);
    };
    form.onsubmit = async e => {
      e.preventDefault();
      const btn = form.querySelector("button[type=submit]");
      const rows = [], clear = [];
      for (const q of qs) {
        const v = form.elements["q" + q.id].value;
        if (v) rows.push({ gp_question_id: q.id, user_id: state.user.id, ...answerRow(q, v) });
        else if (mine[q.id]) clear.push(q.id);
      }
      btn.disabled = true;
      let error = null;
      if (rows.length) ({ error } = await sb.from("predictions").upsert(rows, { onConflict: "gp_question_id,user_id" }));
      if (!error && clear.length) ({ error } = await sb.from("predictions").delete().eq("user_id", state.user.id).in("gp_question_id", clear));
      btn.disabled = false;
      if (error) return toast(/row-level security/i.test(error.message)
        ? "Opslaan lukte niet: de sluitingstijd is voorbij."
        : "Opslaan lukte niet: " + error.message);
      toast("Voorspelling opgeslagen");
      for (const r of rows) mine[r.gp_question_id] = r;
      for (const id of clear) delete mine[id];
    };
    return;
  }

  // Gesloten: tabel met links de vragen en per deelnemer een kolom
  document.body.classList.add("wide");
  let allQs = qs, allPreds = preds, allAnswers = answers;
  if (kind === "gp") {
    const s = state.seasons.find(x => x.year === gp.season);
    if (s?.deadline && new Date(s.deadline) <= new Date()) {
      const { data: sq } = await sb.from("gp_questions").select("*").eq("season", gp.season).order("sort_order");
      if (sq?.length) {
        const sids = sq.map(q => q.id);
        const [sp, sa] = await Promise.all([
          sb.from("predictions").select("*").in("gp_question_id", sids),
          sb.from("correct_answers").select("*").in("gp_question_id", sids).neq("source", "voorstel"),
        ]);
        allQs = [...qs, ...sq];
        allPreds = [...preds, ...(sp.data || [])];
        allAnswers = [...answers, ...(sa.data || [])];
      }
    }
  }
  const correctFor = id => allAnswers.filter(a => a.gp_question_id === id);
  const isRight = (q, p) => correctFor(q.id).some(a => sameAnswer(a, p));
  const pred = (q, uid) => allPreds.find(x => x.gp_question_id === q.id && x.user_id === uid);
  const people = state.profiles;
  const showPts = answers.length > 0 && !cancelled;
  const raceTotal = uid => qs.reduce((t, q) => {
    const p = pred(q, uid);
    return t + (p && isRight(q, p) ? q.points : 0);
  }, 0);
  const col = (i, extra = "") => `class="${i % 2 ? "alt" : ""} ${extra}"`;
  const mgroups = CATS.map(([k, l]) => ({ l, items: allQs.filter(q => q.category === k) })).filter(g => g.items.length);

  html += `<div class="pmx"><table>
    <thead>
      <tr><th class="q"></th><th class="res">Uitslag</th>
        ${people.map((p, i) => `<th ${col(i, p.id === state.user.id ? "me" : "")}>${esc(p.display_name)}</th>`).join("")}</tr>
      <tr class="tot"><th class="q">${showPts ? "Punten deze race" : ""}</th><td class="res"></td>
        ${people.map((p, i) => `<td ${col(i)}>${showPts ? raceTotal(p.id) : ""}</td>`).join("")}</tr>
    </thead>
    ${mgroups.map(g => `<tbody>
      <tr class="cat"><th class="q">${g.l}</th><td class="res"></td>${people.map((p, i) => `<td ${col(i)}></td>`).join("")}</tr>
      ${g.items.map(q => {
        const c = correctFor(q.id);
        return `<tr>
          <th class="q">${esc(q.text)}</th>
          <td class="res">${c.length ? c.map(a => esc(answerLabel(q, a))).join(" / ") : "–"}</td>
          ${people.map((pr, i) => {
            const p = pred(q, pr.id);
            if (!p) return `<td ${col(i, "none")}>–</td>`;
            const ok = isRight(q, p);
            return `<td ${col(i, ok ? "hit" : "")}>${esc(answerLabel(q, p))}</td>`;
          }).join("")}
        </tr>`;
      }).join("")}
    </tbody>`).join("")}
  </table></div>`;
  view().innerHTML = html;

}

async function renderStand() {
  setTitle("Stand");
  if (!state.season) { view().innerHTML = `<p class="panel">Er staat nog geen seizoen klaar.</p>`; return; }
  view().innerHTML = LOADING;
  const [{ data: sc, error }, { data: gps }] = await Promise.all([
    sb.from("score_totals").select("user_id, points, grand_prix_id").eq("season", state.season),
    sb.from("grand_prix").select("id, name, country, race_start, status").eq("season", state.season),
  ]);
  if (error) { view().innerHTML = `<p class="panel">De stand kon niet worden geladen: ${esc(error.message)}</p>`; return; }
  const total = {}, perGp = {}, seasonPts = {};
  let hasSeason = false;
  for (const s of sc || []) {
    total[s.user_id] = (total[s.user_id] || 0) + s.points;
    if (s.grand_prix_id) {
      const g = perGp[s.grand_prix_id] ||= {};
      g[s.user_id] = (g[s.user_id] || 0) + s.points;
    } else {
      hasSeason = true;
      seasonPts[s.user_id] = (seasonPts[s.user_id] || 0) + s.points;
    }
  }
  const cols = [...(gps || [])].sort((a, b) => new Date(a.race_start || 0) - new Date(b.race_start || 0));
  const raced = g => g.race_start && new Date(g.race_start) <= new Date();
  const last = (gps || []).filter(g => perGp[g.id] && raced(g)).sort((a, b) => new Date(b.race_start) - new Date(a.race_start))[0];
  const rows = state.profiles.map(p => ({ p, pts: total[p.id] || 0, last: last ? (perGp[last.id][p.id] || 0) : null }))
    .sort((a, b) => b.pts - a.pts || a.p.display_name.localeCompare(b.p.display_name));
  view().innerHTML = `
    <div><h2>Stand ${state.season}</h2>
      <p class="muted">${last ? `Laatst bijgewerkt na ${esc(last.name)}. Het groene getal is wat iedereen daar scoorde.` : "Nog geen punten. De stand verschijnt na de eerste uitslag."}</p></div>
    <ol class="tower">${rows.map((r, i) => `<li class="${i === 0 && r.pts ? "p1" : ""}">
      <span class="pos">${rows.findIndex(x => x.pts === r.pts) + 1}</span>
      <span class="who">${esc(r.p.display_name)}</span>
      <span class="last">${r.last ? "+" + r.last : ""}</span>
      <span class="pts">${r.pts}</span>
    </li>`).join("")}</ol>
    ${cols.length ? `<h3>Punten per race</h3>
    <div class="matrix"><table>
      <thead><tr><th class="nm"></th><th class="v totc"><span>Totaal</span></th>
        ${cols.map(g => `<th class="v${g.status === "geannuleerd" ? " x" : ""}" title="${esc(g.name)}"><span>${esc(g.country || g.name)}</span></th>`).join("")}
        <th class="v"><span>Seizoensvragen</span></th></tr></thead>
      <tbody>${rows.map(r => `<tr><td class="nm">${esc(r.p.display_name)}</td><td class="tot">${r.pts}</td>
        ${cols.map(g => `<td>${perGp[g.id] && raced(g) ? (perGp[g.id][r.p.id] || 0) : ""}</td>`).join("")}
        <td>${hasSeason ? (seasonPts[r.p.id] || 0) : ""}</td></tr>`).join("")}</tbody>
    </table></div>` : ""}`;
}

// Meldingen op dit apparaat
const b64uToBytes = s => {
  s = s.replace(/-/g, "+").replace(/_/g, "/");
  while (s.length % 4) s += "=";
  return Uint8Array.from(atob(s), c => c.charCodeAt(0));
};
async function pushPanel(el) {
  const supported = "serviceWorker" in navigator && "PushManager" in window && "Notification" in window;
  if (!supported) {
    el.innerHTML = `<p class="muted">Op dit apparaat kunnen geen meldingen worden aangezet. Op een iPhone werkt het alleen als je de app via Zet op beginscherm hebt toegevoegd en via het icoon opent.</p>`;
    return;
  }
  if (Notification.permission === "denied") {
    el.innerHTML = `<p class="muted">Meldingen zijn geblokkeerd. Zet ze aan in de instellingen van je telefoon (op de iPhone: Instellingen, Berichtgeving, F1 Poule) en open de app opnieuw.</p>`;
    return;
  }
  const setState = t => { const x = $("#pushState"); if (x) x.textContent = t; };
  const reg = await navigator.serviceWorker.ready;
  const sub = await reg.pushManager.getSubscription();
  setState(sub ? "Aan" : "Uit");
  if (sub) {
    const j = sub.toJSON();
    sb.rpc("save_push_subscription", { p_endpoint: j.endpoint, p_p256dh: j.keys.p256dh, p_auth: j.keys.auth });
    el.innerHTML = `
      <p>Meldingen staan aan op dit apparaat. Je krijgt een melding als er een race aankomt en als je je voorspelling nog niet hebt ingevuld.</p>
      <div class="row wrap"><button type="button" class="btn ghost" id="pushTest">Testmelding sturen</button>
      <button type="button" class="btn ghost" id="pushOff">Uitzetten</button></div>`;
    $("#pushTest").onclick = async () => {
      const { data, error } = await sb.rpc("send_test_push");
      toast(error ? "Versturen lukte niet: " + error.message : data ? "De testmelding komt over ongeveer een minuut. Sluit de app, dan zie je hem binnenkomen." : "Dit apparaat is nog niet aangemeld.");
    };
    $("#pushOff").onclick = async () => {
      await sb.rpc("delete_push_subscription", { p_endpoint: sub.endpoint });
      await sub.unsubscribe();
      toast("Meldingen staan uit op dit apparaat");
      pushPanel(el);
    };
    return;
  }
  el.innerHTML = `
    <p class="muted">Krijg een melding als er een race aankomt en als je je voorspelling nog niet hebt ingevuld.</p>
    <button type="button" class="btn" id="pushOn">Meldingen aanzetten</button>`;
  $("#pushOn").onclick = async () => {
    const perm = await Notification.requestPermission();
    if (perm !== "granted") return toast("Zonder toestemming kunnen er geen meldingen komen.");
    try {
      const s = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64uToBytes(VAPID_PUBLIC_KEY) });
      const j = s.toJSON();
      const { error } = await sb.rpc("save_push_subscription", { p_endpoint: j.endpoint, p_p256dh: j.keys.p256dh, p_auth: j.keys.auth });
      if (error) return toast("Aanmelden lukte niet: " + error.message);
      toast("Meldingen staan aan");
    } catch (err) {
      toast("Aanzetten lukte niet: " + (err.message || err));
    }
    pushPanel(el);
  };
}

// Tweestapsverificatie
async function mfaPanel(el) {
  const { data } = await sb.auth.mfa.listFactors();
  const verified = data?.totp?.[0];
  const admin = state.me?.is_admin;
  const st = $("#mfaState");
  if (st) st.textContent = verified ? "Aan" : "Uit";
  if (verified) {
    el.innerHTML = `
      <p>Staat aan. Bij het inloggen vraagt de app om een code uit je authenticator-app.</p>
      ${admin ? `<p class="muted small">Als beheerder heb je dit nodig voor Beheer. Zet je het uit, dan kun je niet meer bij Beheer.</p>` : ""}
      <button type="button" class="btn ghost" id="mfaOff">Uitzetten</button>`;
    $("#mfaOff").onclick = async () => {
      if (!confirm(`Tweestapsverificatie uitzetten?${admin ? " Je kunt dan niet meer bij Beheer." : ""}`)) return;
      const { error } = await sb.auth.mfa.unenroll({ factorId: verified.id });
      if (error) return toast("Uitzetten lukte niet: " + error.message);
      await sb.auth.refreshSession();
      state.aal = "aal1";
      toast("Tweestapsverificatie staat uit");
      mfaPanel(el);
    };
    return;
  }
  el.innerHTML = `
    <p class="muted">Extra beveiliging: bij het inloggen vul je ook een code in uit een authenticator-app, zoals de iPhone-app Wachtwoorden.${admin ? " Voor beheerders is dit verplicht." : ""}</p>
    <button type="button" class="btn" id="mfaOn">Aanzetten</button>`;
  $("#mfaOn").onclick = async () => {
    for (const f of (data?.all || []).filter(f => f.status !== "verified")) await sb.auth.mfa.unenroll({ factorId: f.id });

// Uitslagen per grand prix invullen, met ophalen bij de gegevensbron
let resultsSel = null;
let fetchNotes = {};

const isFinished = r => r.status === "Finished" || r.status === "Lapped" || /^\+\d+ Laps?$/.test(r.status);
const isStarter = r => !/did not start|withdrew|did not qualify|did not prequalify/i.test(r.status || "");

// Antwoorden afleiden uit de uitslag. Geeft per vraag { v, src, note }.
async function deriveResults(gp, qs) {
  const base = `${F1_API}${gp.season}/${gp.round}`;
  const [rr, qq, pp] = await Promise.all([
    getJson(base + "/results.json?limit=100").catch(() => null),
    getJson(base + "/qualifying.json?limit=100").catch(() => null),
    getJson(base + "/pitstops.json?limit=200").catch(() => null),
  ]);
  const race = rr?.MRData?.RaceTable?.Races?.[0];
  const qual = qq?.MRData?.RaceTable?.Races?.[0];
  const circuit = (race || qual)?.Circuit?.circuitId;
  if (circuit && gp.ext_circuit && circuit !== gp.ext_circuit) {
    throw new Error(`ronde ${gp.round} is bij de gegevensbron een andere race (${circuit}). Haal eerst de kalender opnieuw op.`);
  }
  if (!race && !qual) throw new Error("er is voor deze race nog geen uitslag beschikbaar");
  const results = race?.Results || [];
  const quali = qual?.QualifyingResults || [];
  const stops = pp?.MRData?.RaceTable?.Races?.[0]?.PitStops || [];
  const dId = ext => state.drivers.find(d => d.ext_id === ext)?.id;
  const tId = ext => state.teams.find(t => t.ext_id === ext)?.id;
  const subjExt = q => state.drivers.find(d => d.id === q.subject_driver_id)?.ext_id;
  const out = {};
  for (const q of qs) {
    let v = null, src = "automatisch", note = null;
    const k = q.auto_key;
    if (k === "pole") {
      const r = results.find(x => x.grid === "1");
      if (r) v = { driver_id: dId(r.Driver.driverId) };
      else if (quali[0]) { v = { driver_id: dId(quali[0].Driver.driverId) }; src = "voorstel"; note = "P1 in de kwalificatie. De startgrid is nog niet bekend; een gridstraf kan het veranderen."; }
    } else if (k === "grid_pos") {
      const ext = subjExt(q);
      const r = results.find(x => x.Driver.driverId === ext);
      if (r && Number(r.grid) > 0) v = { position: Number(r.grid) };
      else if (r) note = "Gestart uit de pitstraat (of niet gestart). Vul zelf in.";
      else {
        const qr = quali.find(x => x.Driver.driverId === ext);
        if (qr) { v = { position: Number(qr.position) }; src = "voorstel"; note = "Positie in de kwalificatie. De startgrid is nog niet bekend."; }
      }
    } else if (k === "race_p1" || k === "race_p2" || k === "race_p3") {
      const r = results.find(x => x.position === k.slice(-1));
      if (r) v = { driver_id: dId(r.Driver.driverId) };
    } else if (k === "fastest_lap") {
      const r = results.find(x => x.FastestLap?.rank === "1");
      if (r) v = { driver_id: dId(r.Driver.driverId) };
      else if (results.length) note = "De snelste ronde staat (nog) niet in de uitslag. Vul zelf in.";
    } else if (k === "first_dnf") {
      const out_ = results.filter(x => isStarter(x) && !isFinished(x) && !/disqualified/i.test(x.status))
        .sort((x, y) => Number(x.position) - Number(y.position));
      const r = out_[out_.length - 1];
      if (r) { v = { driver_id: dId(r.Driver.driverId) }; src = "voorstel"; note = `Onderaan de uitslag van wie gestart en uitgevallen is (${r.status}, ${r.laps} ronden).`; }
      else if (results.length) note = "Volgens de uitslag is niemand uitgevallen.";
    } else if (k === "first_pit_team") {
      const s = [...stops].sort((x, y) => Number(x.lap) - Number(y.lap) || String(x.time).localeCompare(String(y.time)))[0];
      if (s) {
        const r = results.find(x => x.Driver.driverId === s.driverId);
        const d = state.drivers.find(x => x.ext_id === s.driverId);
        v = { team_id: r ? tId(r.Constructor.constructorId) : undefined };
        src = "voorstel";
        note = `Eerste stop: ${d ? shortName(d) : s.driverId} in ronde ${s.lap} om ${String(s.time).slice(0, 8)} (plaatselijke tijd).`;
      } else if (results.length) note = "De pitstopgegevens zijn nog niet beschikbaar. Probeer het later opnieuw.";
    } else if (k === "driver_of_day" || k === "fastest_pit_team" || !k) {
      note = "Staat niet in de gegevensbron. Zoek het op en vul zelf in.";
    } else if (k === "race_pos") {
      const r = results.find(x => x.Driver.driverId === subjExt(q));
      if (r) {
        v = { position: Number(r.position) };
        if (!isFinished(r)) { src = "voorstel"; note = `Niet gefinisht (${r.status}). In de uitslag geklasseerd als P${r.position}.`; }
      }
    }
    if (v && Object.values(v).some(x => x == null || Number.isNaN(x))) {
      v = null;
      note = "Coureur of team niet gevonden. Haal de kalender, teams en coureurs opnieuw op.";
    }
    out[q.id] = { v, src, note };
  }
  return out;
}

async function deriveSeason(year, qs) {
  const [cal, ds, cs] = await Promise.all([
    getJson(`${F1_API}${year}.json?limit=100`),
    getJson(`${F1_API}${year}/driverStandings.json`),
    getJson(`${F1_API}${year}/constructorStandings.json`),
  ]);
  const total = cal.MRData?.RaceTable?.Races?.length || 0;
  const dl = ds.MRData?.StandingsTable?.StandingsLists?.[0];
  const cl = cs.MRData?.StandingsTable?.StandingsLists?.[0];
  const done = dl && Number(dl.round) === total;
  const out = {};
  for (const q of qs) {
    let v = null, note = null;
    if (!done) note = `Het seizoen is nog niet afgelopen${dl ? ` (stand na ronde ${dl.round} van ${total})` : ""}.`;
    else if (q.auto_key === "drivers_champion") {
      const id = state.drivers.find(d => d.ext_id === dl.DriverStandings?.[0]?.Driver?.driverId)?.id;
      if (id) v = { driver_id: id };
    } else if (q.auto_key === "constructors_champion") {
      const id = state.teams.find(t => t.ext_id === cl?.ConstructorStandings?.[0]?.Constructor?.constructorId)?.id;
      if (id) v = { team_id: id };
    }
    out[q.id] = { v, src: "automatisch", note };
  }
  return out;
}

async function admResults(box) {
  const year = state.season;
  if (!year) { box.innerHTML = `<p class="panel">Er is nog geen seizoen. Voeg dat eerst toe onder Kalender.</p>`; return; }
  const { data: gps } = await sb.from("grand_prix").select("*").eq("season", year)
    .neq("status", "geannuleerd").order("race_start", { ascending: true, nullsFirst: false });
  const list = gps || [];
  const past = list.filter(g => g.race_start && new Date(g.race_start) <= new Date());
  if (!resultsSel || (resultsSel !== "seizoen" && !list.some(g => String(g.id) === resultsSel))) {
    resultsSel = past.length ? String(past[past.length - 1].id) : list[0] ? String(list[0].id) : "seizoen";
  }
  const sel = resultsSel;
  const gp = list.find(g => String(g.id) === sel);
  box.innerHTML = `
    <div class="panel stack">
      <label class="field"><span>Uitslag invullen voor</span>
      <select id="resSel">
        ${list.map(g => `<option value="${g.id}" ${String(g.id) === sel ? "selected" : ""}>${g.round ?? "–"}. ${esc(g.name)} (${fmtDate(g.race_start)})</option>`).join("")}
        <option value="seizoen" ${sel === "seizoen" ? "selected" : ""}>Seizoensvragen ${year}</option>
      </select></label>
      <div class="row wrap" style="justify-content:space-between">
        <p class="muted small" style="flex:1 1 20rem">Ophalen vult in wat zeker is en doet een voorstel (oranje) waar je zelf naar moet kijken. Een voorstel telt pas mee als je de uitslag opslaat. Wat je zelf hebt ingevuld, wordt nooit overschreven.</p>
        <button type="button" class="btn ghost" id="fetchRes">Uitslag ophalen</button>
      </div>
    </div>
    <div id="resBox">${LOADING}</div>`;
  $("#resSel").onchange = e => { resultsSel = e.target.value; fetchNotes = {}; admResults(box); };

  const base = sb.from("gp_questions").select("*");
  const { data: qs } = await (sel === "seizoen" ? base.eq("season", year) : base.eq("grand_prix_id", Number(sel))).order("sort_order");
  const rb = $("#resBox");
  if (!qs?.length) { rb.innerHTML = `<p class="panel">Hier zijn geen vragen voor.</p>`; return; }
  const { data: ans } = await sb.from("correct_answers").select("*").in("gp_question_id", qs.map(q => q.id));
  const cur = id => (ans || []).find(a => a.gp_question_id === id);

  // Wat er in het formulier staat; confirm = voorstellen ook bevestigen
  const collectResults = confirm => {
    const form = $("#resForm");
    const changed = [], inserts = [];
    if (!form) return { changed, inserts };
    for (const q of qs) {
      const v = form.elements["r" + q.id].value;
      const a = cur(q.id);
      const same = v ? a && sameAnswer(a, answerRow(q, v)) && (!confirm || a.source !== "voorstel") : !a;
      if (same) continue;
      changed.push(q.id);
      if (v) inserts.push({ gp_question_id: q.id, source: "handmatig", ...answerRow(q, v) });
    }
    return { changed, inserts };
  };
  const writeResults = async ({ changed, inserts }) => {
    let { error } = await sb.from("correct_answers").delete().in("gp_question_id", changed);
    if (!error && inserts.length) ({ error } = await sb.from("correct_answers").insert(inserts));
    return error;
  };

  $("#fetchRes").onclick = async e => {
    const b = e.target;
    b.disabled = true;
    b.textContent = "Bezig met ophalen…";
    try {
      // Eerst bewaren wat je zelf al had ingevuld, zodat ophalen dat nooit overschrijft
      const pending = collectResults(false);
      if (pending.changed.length) {
        const error = await writeResults(pending);
        if (error) throw new Error(error.message);
      }
      const { data: fresh } = await sb.from("correct_answers").select("*").in("gp_question_id", qs.map(q => q.id));
      const manual = new Set((fresh || []).filter(a => a.source === "handmatig").map(a => a.gp_question_id));
      const out = sel === "seizoen" ? await deriveSeason(year, qs) : await deriveResults(gp, qs);
      fetchNotes = Object.fromEntries(Object.entries(out).map(([id, o]) => [id, o.note]));
      const ids = Object.keys(out).map(Number).filter(id => out[id].v && !manual.has(id));
      if (ids.length) {
        let { error } = await sb.from("correct_answers").delete().in("gp_question_id", ids).neq("source", "handmatig");
        if (!error) ({ error } = await sb.from("correct_answers").insert(ids.map(id => ({
          gp_question_id: id, source: out[id].src, note: out[id].note,
          driver_id: null, team_id: null, position: null, ...out[id].v,
        }))));
        if (error) throw new Error(error.message);
      }
      const sure = ids.filter(id => out[id].src === "automatisch").length;
      const prop = ids.length - sure;
      toast(ids.length ? `Opgehaald: ${sure} zeker${prop ? `, ${prop} voorstel${prop > 1 ? "len" : ""} om te controleren` : ""}.` : "Er was niets nieuws op te halen.");
    } catch (err) {
      toast("Ophalen lukte niet: " + (err.message || err));
    }
    admResults(box);
  };

  const status = a => !a ? `<span class="muted small">Nog leeg</span>`
    : a.source === "voorstel" ? `<span class="tag prop">Voorstel</span>`
    : a.source === "automatisch" ? `<span class="tag auto">Opgehaald</span>`
    : `<span class="muted small">Handmatig</span>`;
  const groups = CATS.map(([k, l]) => ({ l, items: qs.filter(q => q.category === k) })).filter(g => g.items.length);
  const props = (ans || []).filter(a => a.source === "voorstel").length;
  rb.innerHTML = `<form id="resForm" class="stack">
    ${props ? `<p class="muted small">${props === 1 ? "Er staat 1 voorstel" : `Er staan ${props} voorstellen`} klaar. Controleer ${props === 1 ? "het" : "ze"} en klik onderaan op <b>Uitslag opslaan</b> om te bevestigen.</p>` : ""}
    ${groups.map(g => `<fieldset class="panel"><legend>${g.l}</legend>
      ${g.items.map(q => {
        const a = cur(q.id);
        const note = a?.source === "voorstel" ? a.note : fetchNotes[q.id];
        return `<div class="resline ${a?.source === "voorstel" ? "isprop" : ""}">
          <span>${esc(q.text)}${note ? `<br><span class="muted small">${esc(note)}</span>` : ""}</span>
          ${answerInput(q, a ? answerValue(q, a) : null, `name="r${q.id}" aria-label="Uitslag: ${esc(q.text)}"`)}
          <span data-tag>${status(a)}</span>
        </div>`;
      }).join("")}
    </fieldset>`).join("")}
    <div class="row wrap" style="justify-content:space-between">
      <p class="muted small">Laat een vraag leeg zolang de uitslag nog niet bekend is. Na het opslaan worden de punten in de stand direct bijgewerkt.</p>
      <button class="btn">Uitslag opslaan</button>
    </div>
  </form>`;
  // Direct zien wat je hebt aangepast maar nog niet hebt opgeslagen
  $("#resForm").oninput = e => {
    const line = e.target.closest(".resline");
    if (!line) return;
    const q = qs.find(x => "r" + x.id === e.target.name);
    const a = cur(q.id);
    const v = e.target.value;
    const unchanged = v ? a && sameAnswer(a, answerRow(q, v)) : !a;
    line.classList.toggle("isprop", unchanged && a?.source === "voorstel");
    line.classList.toggle("edited", !unchanged);
    line.querySelector("[data-tag]").innerHTML = unchanged ? status(a) : `<span class="tag edit">Aangepast</span>`;
  };
  $("#resForm").onsubmit = async e => {
    e.preventDefault();
    const pending = collectResults(true);
    if (!pending.changed.length) return toast("Er was niets gewijzigd");
    const error = await writeResults(pending);
    if (error) return toast("Opslaan lukte niet: " + error.message);
    fetchNotes = {};
    toast("Uitslag opgeslagen");
    admResults(box);
  };
}

    location.href = `mailto:${encodeURIComponent(email)}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
    toast(`${email} is uitgenodigd`);
    setTimeout(() => admPeople(box), 600);
  };

    const r = e.target.closest("[data-reset-mfa]");
    if (r) {

      const { error } = await sb.rpc("admin_reset_mfa", { target: r.dataset.resetMfa });
      if (error) return toast("Uitzetten lukte niet: " + error.message);
      toast("Tweestapsverificatie uitgezet");

    if (!b) return;

    toast("Uitnodiging ingetrokken");
    admPeople(box);
  };

// Meldingen: wanneer en welke tekst
async function admNotifications(box) {
  const [{ data: st }, { data: log }, { data: next }] = await Promise.all([
    sb.from("notification_settings").select("*").order("kind"),
    sb.from("notification_log").select("*, grand_prix(name)").order("sent_at", { ascending: false }).limit(8),
    sb.from("grand_prix").select("id, name, closes_at").neq("status", "geannuleerd")
      .gt("closes_at", new Date().toISOString()).order("closes_at").limit(1),
  ]);
  if (!st?.length) { box.innerHTML = `<p class="panel">De meldingen zijn nog niet ingesteld. Draai eerst het SQL-script voor de meldingen.</p>`; return; }
  const LABEL = {
    aankondiging: "Er komt een race aan: op maandag van de raceweek, naar iedereen",
    herinnering: "Herinnering: de avond voor het sluiten, alleen naar wie nog niet alles heeft ingevuld",
  };
  const g = next?.[0];
  const dueOf = s => {
    const d = new Date(g.closes_at);
    if (s.kind === "aankondiging") d.setDate(d.getDate() - ((d.getDay() + 6) % 7));
    else d.setDate(d.getDate() - 1);

    d.setHours(Number(h), Number(m), 0, 0);

  };
  box.innerHTML = `<form id="ntForm" class="stack">
    ${st.map(s => `<fieldset class="panel stack"><legend>${LABEL[s.kind] || s.kind}</legend>
      <div class="ntline">
        <label class="check"><input type="checkbox" name="en_${s.kind}" ${s.enabled ? "checked" : ""}> Aan</label>
        <label class="field"><span>Tijd</span><input type="time" name="time_${s.kind}" value="${s.at_time.slice(0, 5)}" required></label>
      </div>
      <label class="field"><span>Titel</span><input name="title_${s.kind}" value="${esc(s.title)}" required maxlength="60"></label>
      <label class="field"><span>Tekst (${"{race}"} wordt de naam van de race, ${"{sluiting}"} de sluitingstijd)</span><input name="body_${s.kind}" value="${esc(s.body)}" required maxlength="160"></label>
      ${g && s.enabled ? `<p class="muted small">${dueOf(s) < new Date() ? "Voor deze race al voorbij" : "Volgende keer: " + fmtDateTime(dueOf(s))}, ${esc(g.name)} (sluit ${fmtDateTime(g.closes_at)}).</p>` : ""}
    </fieldset>`).join("")}
    <div class="row wrap" style="justify-content:space-between">
      <p class="muted small">Het invullen sluit om 01:00 op de dag van de eerste vrije training. De dagen van de meldingen schuiven daarmee mee; alleen het tijdstip stel je hier in.</p>
      <button class="btn">Opslaan</button>
    </div>
  </form>
  ${log?.length ? `<div class="panel"><h3>Laatst verstuurd</h3><ul class="list">${log.map(l => `<li>
    <span>${esc(l.grand_prix?.name || "")}: ${l.kind}<br><span class="muted small">${fmtDateTime(l.sent_at)}</span></span>
    <span class="muted small">${l.recipients} apparaten</span></li>`).join("")}</ul></div>` : ""}`;
  $("#ntForm").onsubmit = async e => {
    e.preventDefault();
    const f = new FormData(e.target);
    for (const s of st) {
      const { error } = await sb.from("notification_settings").update({
        enabled: f.get("en_" + s.kind) === "on",
        at_time: f.get("time_" + s.kind),
        title: String(f.get("title_" + s.kind)).trim(),
        body: String(f.get("body_" + s.kind)).trim(),
      }).eq("kind", s.kind);
      if (error) return toast("Opslaan lukte niet: " + error.message);
    }
    toast("Meldingen opgeslagen");
    admNotifications(box);
  };
}

<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F3F5EF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1A1D18" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bierlijst">
<title>Bierlijst</title>
<link rel="icon" href="favicon-32-v2.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon-v2.png">
<link rel="manifest" href="manifest.webmanifest?v=3">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<style>
:root {
  --paper: #F3F5EF;
  --surface: #FFFFFF;
  --ink: #1E241C;
  --muted: #646C5F;
  --line: #D8DDD1;
  --hop: #4A6A2A;
  --hop-ink: #FFFFFF;
  --hop-soft: #E3EBD6;
  --danger: #A3322A;
  --gold: #D9A21B;
  --radius-lg: 18px;
  --radius: 10px;
  --display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body: "Source Sans 3", "Segoe UI", system-ui, -apple-system, sans-serif;
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
}
@media (prefers-color-scheme: dark) {
  :root {
    --paper: #1A1D18;
    --surface: #242922;
    --ink: #EEF1E9;
    --muted: #A2AA9C;
    --line: #3A4136;
    --hop: #9CC167;
    --hop-ink: #172010;
    --hop-soft: #2F3B25;
    --danger: #F08A80;
    --gold: #F0BE45;
    color-scheme: dark;
  }
}
*, *::before, *::after { box-sizing: inherit; }
[hidden] { display: none !important; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font: 400 17px/1.5 var(--body);
  -webkit-font-smoothing: antialiased;
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  background: var(--paper); z-index: 30;
}
h1, h2, h3 { font-family: var(--display); line-height: 1.1; margin: 0; }
h1 { font-size: clamp(2rem, 7vw, 2.8rem); font-weight: 800; letter-spacing: -0.02em; }
h2 { font-size: 1.5rem; font-weight: 700; letter-spacing: -0.01em; }
h3 { font-size: 1.12rem; font-weight: 700; }
p { margin: 0; }
a { color: var(--hop); }
img { max-width: 100%; display: block; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }

.wrap { max-width: 760px; margin: 0 auto; padding: 0 18px; }

/* Topbalk */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  background: var(--paper);
  border-bottom: 1px solid var(--line);
}
.top .wrap { display: flex; align-items: center; justify-content: space-between; height: 58px; }
.brand { font: 800 1.3rem var(--display); letter-spacing: -0.02em; text-decoration: none; color: var(--ink); display: flex; align-items: center; gap: 9px; }
.brand svg { width: 22px; height: 26px; }

/* Kopbalk en menu */
.top .wrap.top-grid { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; height: 60px; max-width: none; }
.top-left { display: flex; align-items: center; }
.top-right { display: flex; justify-content: flex-end; align-items: center; gap: 4px; }
.brand { justify-self: center; }
.icon-btn {
  appearance: none; border: 0; background: transparent; color: var(--ink); cursor: pointer;
  width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center;
  text-decoration: none;
}
.icon-btn:hover { background: var(--hop-soft); }
.icon-btn svg { width: 26px; height: 26px; }
.icon-btn.add { background: var(--hop); color: var(--hop-ink); border-radius: 50%; width: 38px; height: 38px; }
.icon-btn.add svg { width: 20px; height: 20px; }
#menuBtn .chev-close { display: none; }
body.menu-open #menuBtn .chev-open { display: none; }
body.menu-open #menuBtn .chev-close { display: inline; }

.backdrop {
  position: fixed; inset: 0; z-index: 18; background: rgba(20, 24, 18, 0.25);
  opacity: 0; pointer-events: none;
}
.drawer {
  position: fixed; z-index: 19;
  top: calc(60px + 12px + env(safe-area-inset-top, 0px)); left: 12px;
  width: min(260px, calc(100vw - 24px));
  max-height: calc(100vh - 96px - env(safe-area-inset-top, 0px)); overflow-y: auto;
  background: var(--surface); border: 1px solid var(--line); border-radius: 20px;
  padding: 12px; display: flex; flex-direction: column; gap: 10px;
  box-shadow: 0 12px 32px rgba(20, 24, 18, 0.16);
  opacity: 0; transform: translateX(-12px); visibility: hidden;
}
body.menu-open .backdrop { opacity: 1; pointer-events: auto; }
body.menu-open .drawer { opacity: 1; transform: none; visibility: visible; }
@media (prefers-reduced-motion: no-preference) {
  .backdrop { transition: opacity .18s; }
  .drawer { transition: opacity .18s, transform .18s ease-out, visibility .18s; }
  main { transition: padding-left .18s ease-out; }
}
.drawer a {
  display: flex; align-items: center; gap: 14px; min-height: 48px; padding: 0 18px;
  border: 1.5px solid var(--line); border-radius: 999px;
  text-decoration: none; color: var(--ink); font-weight: 600; font-size: 1.05rem;
}
.drawer a svg { width: 22px; height: 22px; flex: none; }
.drawer a:hover { border-color: var(--muted); }
.drawer a[aria-current="page"] { background: var(--hop-soft); border-color: var(--hop); }
.drawer-admin { display: flex; flex-direction: column; gap: 10px; }
.drawer-admin[hidden] { display: none; }
.drawer hr { border: 0; border-top: 1px solid var(--line); margin: 2px 8px; width: auto; }

/* Brede schermen: menu naast de inhoud, inhoud schuift op */
@media (min-width: 1000px) {
  .backdrop { display: none; }
  .drawer { box-shadow: none; }
  body.menu-open main { padding-left: 290px; }
}

main { padding: 26px 0 40px; }
.stack > * + * { margin-top: 16px; }
.muted { color: var(--muted); }
.small { font-size: 0.9rem; }

/* Knoppen en velden */
.btn {
  appearance: none; border: 0; cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 46px; padding: 0 20px; border-radius: 999px;
  background: var(--hop); color: var(--hop-ink); font-weight: 700;
  text-decoration: none;
}
.btn:disabled { opacity: 0.55; cursor: progress; }
.btn.ghost { background: transparent; color: var(--ink); border: 1.5px solid var(--line); }
.btn.soft { background: var(--hop-soft); color: var(--ink); }
.btn.danger { background: transparent; color: var(--danger); border: 1.5px solid currentColor; }
.btn.small { min-height: 36px; padding: 0 14px; font-size: 0.92rem; }
.btn.block { width: 100%; }
.btn svg { width: 20px; height: 20px; }

label.field { display: block; }
label.field > span { display: block; font-weight: 600; font-size: 0.92rem; margin-bottom: 5px; }
.input, select.input, textarea.input {
  width: 100%; min-height: 46px; padding: 10px 13px;
  border: 1.5px solid var(--line); border-radius: var(--radius);
  background: var(--surface);
}
textarea.input { min-height: 92px; resize: vertical; }
.input:focus { outline: none; border-color: var(--hop); }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
@media (max-width: 480px) { .grid3 { grid-template-columns: 1fr 1fr; } }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg); padding: 20px; }

/* Collectie-kop met bierspectrum */
.collection-head { display: flex; align-items: end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.avatar-edit { display: flex; align-items: center; gap: 18px; }
.avatar-edit .stack > * + * { margin-top: 8px; }
.title-with-avatar { display: flex; align-items: center; gap: 14px; }
.spectrum {
  display: flex; height: 54px; border-radius: 12px; overflow: hidden;
  border: 1px solid var(--line); background: var(--surface);
}
.spectrum span { flex: 1 1 0; min-width: 2px; }
.spectrum-legend { display: flex; justify-content: space-between; font-size: 0.82rem; color: var(--muted); margin-top: 6px; }
/* Vier vakken die altijd naast elkaar passen */
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.stats div { min-width: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 10px 8px; text-align: center; }
.stats div b { display: block; font: 800 clamp(1.1rem, 5.2vw, 1.6rem)/1.1 var(--display); white-space: nowrap; }
.stats div span { display: block; font-size: clamp(0.68rem, 2.8vw, 0.85rem); line-height: 1.2; color: var(--muted); margin-top: 4px; overflow-wrap: anywhere; }

.filters { display: grid; grid-template-columns: 1fr auto auto; gap: 10px; }
@media (max-width: 560px) { .filters { grid-template-columns: 1fr 1fr; } .filters .search { grid-column: 1 / -1; } }

/* Bierkaarten */
.beers { display: grid; gap: 12px; }
.beer {
  display: grid; grid-template-columns: 88px minmax(0, 1fr); gap: 14px; align-items: center;
  width: 100%; text-align: left; cursor: pointer;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg);
  padding: 10px; color: inherit;
}
.beer:hover { border-color: var(--muted); }
.beer-photo {
  position: relative; border-radius: 12px; overflow: hidden; aspect-ratio: 1;
  background: var(--paper);
}
/* Vaste maten: Safari laat een vierkant anders meegroeien met de hoogte van de kaart */
.beer > .beer-photo { width: 88px; height: 88px; }
.db-row > .beer-photo, .chosen > .beer-photo { width: 60px; height: 60px; }
.bc-row > .beer-photo { width: 52px; height: 52px; }
.beer-photo img { display: block; }
.beer-photo img { width: 100%; height: 100%; object-fit: cover; }
.beer-photo::after {
  content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 9px; background: var(--srm);
}
.glass { width: 100%; height: 100%; display: grid; place-items: center; }
.glass svg { width: 44%; height: auto; }
.beer-body { min-width: 0; display: flex; flex-direction: column; justify-content: center; gap: 2px; padding-right: 4px; }
.beer-body h3 { overflow-wrap: anywhere; }
.beer-meta { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 0.9rem; color: var(--muted); }
.beer-foot { display: flex; align-items: center; gap: 10px; margin-top: 4px; font-size: 0.9rem; }
.count { color: var(--muted); }

.stars {
  --pct: calc(var(--r, 0) / 5 * 100%);
  display: inline-block; font-size: 1.05rem; letter-spacing: 2px; line-height: 1;
  background: linear-gradient(90deg, var(--gold) var(--pct), var(--line) var(--pct));
  -webkit-background-clip: text; background-clip: text; color: transparent;
}

.empty { text-align: center; padding: 40px 16px; }
.empty svg { width: 64px; margin: 0 auto 14px; }

/* Inchecken */
.chosen { display: grid; grid-template-columns: 60px minmax(0, 1fr) auto; gap: 12px; align-items: center; }
.chosen .beer-photo { width: 60px; }
.results { display: grid; gap: 6px; margin-top: 8px; }
.result {
  display: flex; justify-content: space-between; gap: 10px; align-items: center;
  padding: 10px 12px; border-radius: var(--radius); border: 1px solid var(--line);
  background: var(--surface); cursor: pointer; text-align: left; width: 100%;
}
.result:hover { border-color: var(--hop); }
.beer-stats { padding: 16px 18px; }
.stat-line { display: flex; align-items: center; gap: 14px; }
.stat-big { font: 800 1.7rem/1 var(--display); color: var(--hop); flex: none; }
.stat-big.new { font-size: 1.2rem; background: var(--gold); color: #2A1E05; padding: 6px 12px; border-radius: 999px; }
.friend-stats { display: grid; gap: 8px; margin-top: 8px; }
.friend-stat { display: flex; align-items: center; gap: 10px; }
.friend-stat .avatar { width: 32px; height: 32px; font-size: .85rem; }
.db-list { display: grid; gap: 8px; }
.tag.warn { background: #FBEFD0; color: #6B4A00; border-color: transparent; }
@media (prefers-color-scheme: dark) { .tag.warn { background: #4A3A12; color: #F6D98A; } }
.notice { background: var(--hop-soft); border-radius: var(--radius); padding: 10px 14px; margin-top: 8px; }
fieldset.plain { border: 0; padding: 0; margin: 0; min-width: 0; display: grid; gap: 16px; }
fieldset.plain:disabled .input { opacity: .6; }
.role-switches { display: flex; flex-direction: column; gap: 6px; align-items: flex-end; }
.review-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg); padding: 16px; display: grid; gap: 10px; }
.review-head { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.review-actions { display: flex; gap: 8px; flex-wrap: wrap; }
table.diff td { white-space: normal; }
.diff-img { width: 64px; height: 64px; object-fit: cover; border-radius: 8px; }
.count-badge { margin-left: auto; background: var(--danger); color: #fff; border-radius: 999px; font-size: .78rem; font-weight: 700; padding: 1px 8px; }
.bc-row {
  display: grid; grid-template-columns: 52px minmax(0, 1fr) auto; gap: 12px; align-items: center;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg); padding: 8px;
}
.bc-row .beer-photo { width: 52px; }
.preset-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.preset {
  appearance: none; cursor: pointer; text-align: left; color: inherit;
  display: flex; flex-direction: column; gap: 2px; padding: 14px; border-radius: var(--radius-lg);
  background: var(--surface); border: 1.5px solid var(--line);
}
.preset:hover { border-color: var(--hop); }
.check-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px; }
.check { display: flex; align-items: center; gap: 8px; cursor: pointer; }
.check input { width: 18px; height: 18px; accent-color: var(--hop); flex: none; margin: 0; }
.pairs { display: grid; gap: 8px; margin-top: 8px; }
.pair { display: grid; gap: 8px; padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--radius); overflow-wrap: anywhere; }
.pair.on { border-color: var(--hop); background: var(--hop-soft); }
.pair-main, .pair-over { display: flex; gap: 12px; align-items: flex-start; cursor: pointer; }
.pair-over { padding: 8px 0 0 32px; border-top: 1px dashed var(--line); }
.pair input { width: 20px; height: 20px; margin-top: 2px; accent-color: var(--hop); flex: none; }
label.switch.panel { padding: 16px 18px; }
.import-sum { margin: 0; padding-left: 20px; display: grid; gap: 4px; }
.table-scroll { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius); margin-top: 8px; }
table.preview { border-collapse: collapse; width: 100%; font-size: .88rem; }
table.preview th, table.preview td { padding: 7px 10px; text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap; }
table.preview th { background: var(--surface); font-weight: 700; }
table.preview td.wrap { white-space: normal; min-width: 220px; }
details.panel summary { cursor: pointer; }
details.panel[open] summary { margin-bottom: 8px; }
.db-row {
  display: grid; grid-template-columns: 60px minmax(0, 1fr); gap: 12px; align-items: center; width: 100%; text-align: left;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg); padding: 8px; cursor: pointer; color: inherit;
}
.db-row:hover { border-color: var(--muted); }
.db-row .beer-photo { width: 60px; }
.db-body { display: flex; flex-direction: column; gap: 2px; min-width: 0; overflow-wrap: anywhere; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 3px; }
.tag { font-size: 0.76rem; font-weight: 600; padding: 2px 9px; border-radius: 999px; background: var(--paper); color: var(--muted); border: 1px solid var(--line); }
.tag.on { background: var(--hop-soft); color: var(--ink); border-color: transparent; }
.loc-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.chip {
  appearance: none; cursor: pointer; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink);
  border-radius: 999px; padding: 6px 12px; font-weight: 600; font-size: .9rem; max-width: 100%;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.chip:hover { border-color: var(--muted); }
.chip.on { background: var(--hop-soft); border-color: var(--hop); }
.result { cursor: pointer; }
.result:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
#results .result { display: grid; grid-template-columns: 1fr auto auto; align-items: center; gap: 4px 10px; padding: 8px 12px; }
.res-main { grid-column: 1; grid-row: 1; min-width: 0; overflow-wrap: break-word; line-height: 1.35; }
.res-stats { grid-column: 2; grid-row: 1; display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
#results .result > .muted.small:last-child { grid-column: 3; grid-row: 1; }
/* Smalle telefoon: "Kies" weg (de hele regel is aan te tikken), zodat de naam meer ruimte heeft */
@media (max-width: 520px) {
  #results .result { grid-template-columns: 1fr auto; }
  #results .result > .muted.small:last-child { display: none; }
}
.tag.new { background: #FBEFD0; color: #6B4A00; border-color: transparent; }
@media (prefers-color-scheme: dark) { .tag.new { background: #4A3A12; color: #F6D98A; } }
button.tag { cursor: pointer; font: inherit; font-size: 0.76rem; font-weight: 700; }
.tag.friends { background: var(--surface); color: var(--ink); border-color: var(--hop); }
.tag.friends:hover { background: var(--hop-soft); }
.friend-lines { display: grid; gap: 6px; }
.friend-line { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); }
.friend-line:first-child { border-top: 0; }
.friend-line .grow { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.friend-score { display: flex; align-items: center; gap: 6px; flex: none; }
.linkish { appearance: none; border: 0; background: none; padding: 0; color: var(--hop); font: inherit; font-weight: 700; text-decoration: underline; cursor: pointer; }
.code-list { display: flex; flex-wrap: wrap; gap: 6px; }
.code-chip { display: inline-flex; align-items: center; gap: 4px; padding: 4px 6px 4px 12px; border-radius: 999px; background: var(--paper); border: 1px solid var(--line); font-weight: 600; font-variant-numeric: tabular-nums; }
.code-chip button { appearance: none; border: 0; background: transparent; color: var(--muted); font-size: 1.1rem; line-height: 1; width: 26px; height: 26px; border-radius: 50%; cursor: pointer; }
.code-chip button:hover { background: var(--hop-soft); color: var(--danger); }
.type-code { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
.or { display: flex; align-items: center; gap: 12px; color: var(--muted); font-size: 0.9rem; }
.or::before, .or::after { content: ""; flex: 1; height: 1px; background: var(--line); }
#reader { position: relative; border-radius: var(--radius-lg); overflow: hidden; background: #000; aspect-ratio: 1; }
#reader video { width: 100%; height: 100%; object-fit: cover; display: block; }
.scan-frame {
  position: absolute; left: 50%; top: 50%; width: 72%; aspect-ratio: 1; transform: translate(-50%, -50%);
  border: 3px solid rgba(255, 255, 255, 0.9); border-radius: 18px;
  box-shadow: 0 0 0 999px rgba(0, 0, 0, 0.35);
}
.rating-row { display: flex; align-items: center; gap: 14px; }
.rating-row input[type=range] { flex: 1; accent-color: var(--gold); height: 32px; }
.rating-row output { font: 800 1.4rem var(--display); min-width: 3.2ch; text-align: right; }
.segmented { display: flex; flex-wrap: wrap; gap: 8px; }
.segmented label { cursor: pointer; }
.segmented input { position: absolute; opacity: 0; pointer-events: none; }
.segmented span {
  display: inline-block; padding: 8px 15px; border-radius: 999px;
  border: 1.5px solid var(--line); font-weight: 600; font-size: 0.95rem;
}
.segmented input:checked + span { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.segmented input:focus-visible + span { outline: 3px solid var(--gold); outline-offset: 2px; }
.photo-pick { display: flex; gap: 12px; align-items: center; }
.photo-pick img { width: 84px; height: 84px; object-fit: cover; border-radius: 12px; }

/* Dialoog */
dialog {
  border: 0; padding: 0; width: min(640px, 100vw); max-height: 92vh;
  border-radius: var(--radius-lg); background: var(--paper); color: var(--ink);
}
dialog::backdrop { background: rgba(20, 24, 18, 0.55); }
@media (max-width: 640px) {
  dialog { margin: auto 0 0; max-height: 94vh; border-radius: var(--radius-lg) var(--radius-lg) 0 0; }
}
.dlg-head { position: sticky; top: 0; z-index: 2; display: flex; justify-content: flex-end; padding: 10px; background: linear-gradient(var(--paper) 60%, transparent); }
.dlg-body { padding: 0 20px 28px; }

  const p = partsIn(iso, tz);
  const time = `${String(p.h).padStart(2, "0")}:${String(p.mi).padStart(2, "0")}`;
  const other = tz && tz !== DEVICE_TZ ? ` plaatselijke tijd (${tz.split("/").pop().replace(/_/g, " ")})` : "";
  return `${fmtDate(iso, tz)}, ${time}${other}`;
}

// Bierkleur op basis van de stijl (benadering van de SRM-kleurschaal)
const COLORS = [
  [/kriek|framboos|fruit|cherry|raspberry/, "#A23142", 5],
  [/stout|porter|zwart|black|schwarz/, "#2A1810", 9],
  [/quad|bock|dubbel|brown|bruin|dunkel|barley/, "#5C2D14", 8],
  [/amber|red|rood|scotch|alt|märzen|marzen|vienna/, "#8E3E16", 7],
  [/ipa|pale|apa|saison|tripel|strong|bitter/, "#C47A1C", 6],
  [/blond|golden|kölsch|kolsch|helles|lager|pils/, "#E2B13A", 3],
  [/wit|weizen|weiss|wheat|blanche|gose|berliner|sour|zuur|lambiek|geuze|gueuze/, "#EACF7C", 2],
];
function beerColor(style) {
  const s = (style || "").toLowerCase();
  for (const [re, hex, rank] of COLORS) if (re.test(s)) return { hex, rank };
  return { hex: "#B98A35", rank: 4 };
}

function glassSvg(hex) {
  return `<div class="glass" aria-hidden="true"><svg viewBox="0 0 40 52"><path d="M4 4h32l-4 44H8z" fill="${hex}"/><path d="M4 4h32l-.8 8H4.8z" fill="var(--surface)"/><path d="M4 4h32l-4 44H8z" fill="none" stroke="var(--ink)" stroke-width="2.4" stroke-linejoin="round"/></svg></div>`;
}
function photoBlock(path, style, cls = "beer-photo") {
  const c = beerColor(style);
  const url = photoUrl(path);
  // De grote foto in een detailkaart kun je aantikken om hem te vergroten
  if (url && cls === "hero-photo") return `<button type="button" class="${cls} zoomable" style="--srm:${c.hex}" data-zoom="${esc(url)}" aria-label="Foto groot bekijken"><img src="${esc(url)}" alt="" loading="lazy"></button>`;
  return `<div class="${cls}" style="--srm:${c.hex}">${url ? `<img src="${esc(url)}" alt="" loading="lazy">` : glassSvg(c.hex)}</div>`;
}
// Tekens tellen zoals mensen ze zien: één emoji is één teken
const segmenter = typeof Intl.Segmenter === "function" ? new Intl.Segmenter("nl", { granularity: "grapheme" }) : null;
function charList(str) { return segmenter ? [...segmenter.segment(str)].map(x => x.segment) : [...str]; }
function charCount(str) { return charList(str || "").length; }
function clampChars(str, n) { const l = charList(str || ""); return l.length > n ? l.slice(0, n).join("") : str; }
function limitedTextarea(name, limit, value = "", attrs = "") {
  return `<textarea class="input" name="${name}" data-limit="${limit}" ${attrs}>${esc(value)}</textarea>
    <span class="char-count">${charCount(value)} / ${limit}</span>`;
}
document.addEventListener("input", e => {
  const ta = e.target.closest("textarea[data-limit]");
  if (!ta) return;
  const limit = Number(ta.dataset.limit);
  if (charCount(ta.value) > limit) ta.value = clampChars(ta.value, limit);
  const n = charCount(ta.value);
  const cnt = ta.parentElement.querySelector(".char-count");
  if (cnt) { cnt.textContent = `${n} / ${limit}`; cnt.classList.toggle("full", n >= limit); }
});

// Afbeelding openen, ook op browsers die niet alle opties ondersteunen
async function loadBitmap(file) {
  try { return await createImageBitmap(file, { imageOrientation: "from-image" }); } catch {}
  try { return await createImageBitmap(file); } catch {}
  return await new Promise((res, rej) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => { URL.revokeObjectURL(url); res(img); };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error("Deze afbeelding kan niet worden geopend.")); };
    img.src = url;
  });
}

// Foto verkleinen: maximaal 250 kB per foto, zodat de gratis opslag lang meegaat
const MAX_PHOTO_BYTES = 250 * 1024;
function canvasBlob(canvas, quality) {
  return new Promise(res => canvas.toBlob(res, "image/jpeg", quality));
}
async function compressImage(file) {
  const bmp = await loadBitmap(file);
  const steps = [[1600, 0.82], [1600, 0.72], [1400, 0.7], [1200, 0.68], [1024, 0.65], [900, 0.6], [800, 0.55]];
  let blob;
  for (const [max, q] of steps) {
    const scale = Math.min(1, max / Math.max(bmp.width, bmp.height));
    const canvas = document.createElement("canvas");
    canvas.width = Math.round(bmp.width * scale);
    canvas.height = Math.round(bmp.height * scale);
    canvas.getContext("2d").drawImage(bmp, 0, 0, canvas.width, canvas.height);
    blob = await canvasBlob(canvas, q);
    if (blob.size <= MAX_PHOTO_BYTES) break;
  }
  bmp.close?.();
  if (blob.size > MAX_PHOTO_BYTES) throw new Error("Deze foto kon niet klein genoeg worden gemaakt. Probeer een andere foto.");
  return blob;
}
// Profielfoto: vierkant bijgesneden, 400 x 400 pixels
async function compressAvatar(file) {
  const bmp = await loadBitmap(file);
  const side = Math.min(bmp.width, bmp.height);
  const canvas = document.createElement("canvas");
  canvas.width = canvas.height = 400;
  canvas.getContext("2d").drawImage(bmp, (bmp.width - side) / 2, (bmp.height - side) / 2, side, side, 0, 0, 400, 400);
  bmp.close?.();
  return canvasBlob(canvas, 0.82);
}
async function uploadPhoto(file) {
  const blob = await compressImage(file);
  const path = `${state.user.id}/${crypto.randomUUID()}.jpg`;
  const { error } = await sb.storage.from("photos").upload(path, blob, { contentType: "image/jpeg" });
  if (error) throw error;
  return path;
}

function groupBeers(checkins) {
  const map = new Map();
  for (const c of checkins) {
    if (!c.beer) continue;
    if (!map.has(c.beer_id)) map.set(c.beer_id, { beer: c.beer, checkins: [] });
    map.get(c.beer_id).checkins.push(c);
  }
  return [...map.values()].map(g => {
    g.checkins.sort((a, b) => b.drunk_at.localeCompare(a.drunk_at));
    const rs = g.checkins.map(c => c.rating).filter(r => r != null).map(Number);
    g.avg = rs.length ? rs.reduce((a, b) => a + b, 0) / rs.length : null;
    g.last = g.checkins[0].drunk_at;
    g.lastTz = g.checkins[0].tz;
    g.photo = (g.checkins.find(c => c.photo_path) || {}).photo_path || g.beer.image_path;
    return g;
  });
}

function friendlyAuthError(err) {
  const m = (err && err.message) || "";
  if (/database error saving new user|niet uitgenodigd/i.test(m)) return "Dit e-mailadres is nog niet uitgenodigd. Vraag een vriend om je uit te nodigen.";
  if (/invalid login credentials/i.test(m)) return "E-mailadres of wachtwoord klopt niet.";
  if (/already registered|already been registered/i.test(m)) return "Er bestaat al een account met dit e-mailadres. Log in.";
  if (/email not confirmed/i.test(m)) return "Je e-mailadres is nog niet bevestigd.";
  if (/password/i.test(m)) return "Het wachtwoord moet minstens 8 tekens hebben.";
  return m || "Er ging iets mis. Probeer het opnieuw.";
}

function renderAuth(mode = "login") {
  setTab(null);
  setNav(false);
  view().innerHTML = `
    <div class="auth stack">
      <h1>Elk bier dat je drinkt, op één plek.</h1>
      <p class="muted">Houd je bieren bij en zie wat je vrienden drinken. Een account maken kan alleen met een uitnodiging.</p>
      <div class="auth-tabs" role="tablist">
        <button role="tab" aria-selected="${mode === "login"}" data-mode="login">Inloggen</button>
        <button role="tab" aria-selected="${mode === "signup"}" data-mode="signup">Account maken</button>
      </div>
      <form class="panel stack" id="authForm" novalidate>
        <label class="field"><span>E-mailadres</span><input class="input" type="email" name="email" autocomplete="email" required></label>
        <label class="field"><span>Wachtwoord</span><input class="input" type="password" name="password" minlength="8" autocomplete="${mode === "login" ? "current-password" : "new-password"}" required></label>
        ${mode === "signup" ? `<label class="field"><span>Je naam</span><input class="input" name="name" autocomplete="nickname" required></label>` : ""}
        <p class="error" id="authErr" hidden></p>
        <button class="btn block" type="submit">${mode === "login" ? "Inloggen" : "Account maken"}</button>
        ${mode === "login" ? `<p class="muted small">Wachtwoord vergeten? Vraag de beheerder om een tijdelijk wachtwoord.</p>` : ""}
      </form>
    </div>`;
  view().querySelectorAll("[data-mode]").forEach(b => b.onclick = () => renderAuth(b.dataset.mode));
  $("#authForm").onsubmit = async e => {
    e.preventDefault();
    const f = new FormData(e.target);
    const btn = e.target.querySelector("button[type=submit]");
    const errEl = $("#authErr");
    errEl.hidden = true; btn.disabled = true;
    const email = String(f.get("email")).trim().toLowerCase();
    const password = String(f.get("password"));
    try {
      if (mode === "login") {
        const { error } = await sb.auth.signInWithPassword({ email, password });
        if (error) throw error;
      } else {
        if (password.length < 8) throw new Error("password");
        const { data, error } = await sb.auth.signUp({ email, password, options: { emailRedirectTo: SITE_URL } });
        if (error) throw error;
        if (data.user && data.session) {
          await sb.from("profiles").update({ display_name: String(f.get("name")).trim() || email.split("@")[0] }).eq("id", data.user.id);
          await loadMe();
          route();
        } else {
          errEl.textContent = "Bijna klaar: bevestig je account via de link in je mail.";
          errEl.hidden = false;
        }
      }
    } catch (err) {
      errEl.textContent = friendlyAuthError(err);
      errEl.hidden = false;
    } finally {
      btn.disabled = false;
    }
  };
}

async function fetchCheckins(userId) {
  const { data, error } = await sb
    .from("checkins")
    .select("*, beer:beers(*)")
    .eq("user_id", userId)
    .order("drunk_at", { ascending: false });
  if (error) throw error;
  return data;
}

function renderCollection(groups, { title, intro, own, profile }) {
  const sorted = [...groups].sort((a, b) => beerColor(a.beer.style).rank - beerColor(b.beer.style).rank);
  const total = groups.reduce((n, g) => n + g.checkins.length, 0);
  const rated = groups.filter(g => g.avg != null);
  const avg = rated.length ? rated.reduce((s, g) => s + g.avg, 0) / rated.length : null;
  const styles = [...new Set(groups.map(g => g.beer.style).filter(Boolean))].sort((a, b) => a.localeCompare(b, "nl"));

  view().innerHTML = `
    <div class="stack">
      <div class="collection-head">
        <div class="title-with-avatar">
          ${profile && !own ? avatarHtml(profile, 56) : ""}
          <div>
          <h1>${esc(title)}</h1>
          ${intro ? `<p class="muted">${intro}</p>` : ""}
          </div>
        </div>
        ${own && groups.length ? `<a class="btn" href="#inchecken">Bier inchecken</a>` : ""}
      </div>
      ${groups.length ? `
        <div>
          <div class="spectrum" role="img" aria-label="Kleuren van ${groups.length} bieren, van licht naar donker">
            ${sorted.map(g => `<span style="background:${beerColor(g.beer.style).hex}" title="${esc(g.beer.name)}"></span>`).join("")}
          </div>
          <div class="spectrum-legend"><span>Licht</span><span>Donker</span></div>
        </div>
        ${(() => {
          const earned = earnedSorted(computeBadges(groups.flatMap(g => g.checkins.map(c => ({ ...c, beer: g.beer })))));
          if (!earned.length) return "";
          const link = state.user ? `#badges${own ? "" : "/" + profile?.id}` : "";
          return `<section>
            <div style="display:flex;justify-content:space-between;align-items:baseline;gap:10px">
              <h2>Badges</h2>
              ${link ? `<a href="${link}" class="small">Alle ${earned.length} bekijken</a>` : `<span class="muted small">${earned.length} verdiend</span>`}
            </div>
            <div class="badge-strip" style="margin-top:8px">${earned.slice(0, 10).map(b => badgeHtml(b, true)).join("")}</div>
          </section>`;
        })()}
        <div class="stats">
          <div><b>${groups.length}</b><span>unieke bieren</span></div>
          <div><b>${total}</b><span>check-ins</span></div>
          <div><b>${avg != null ? nf(avg, 2) : "–"}</b><span>gem. score</span></div>
          <div><b>${styles.length}</b><span>stijlen</span></div>
        </div>
        <div class="filters">
          <input class="input search" type="search" id="fSearch" placeholder="Zoek op bier of brouwerij" aria-label="Zoeken">
          <select class="input" id="fStyle" aria-label="Stijl">
            <option value="">Alle stijlen</option>
            ${styles.map(s => `<option>${esc(s)}</option>`).join("")}
          </select>
          <select class="input" id="fSort" aria-label="Sorteren">
            <option value="recent">Laatst gedronken</option>
            <option value="score">Hoogste score</option>
            <option value="name">Naam</option>
            <option value="abv">Sterkste eerst</option>
            <option value="color">Licht naar donker</option>
          </select>
        </div>
        <div class="beers" id="beerList"></div>
      ` : `
        <div class="panel empty">
          ${glassSvg("var(--line)")}
          <h2>${own ? "Nog geen bieren" : "Nog niets ingecheckt"}</h2>
          <p class="muted">${own ? "Check je eerste bier in door de barcode te scannen of de naam op te zoeken." : "Zodra er bieren zijn ingecheckt, zie je ze hier."}</p>
          ${own ? `<p style="margin-top:16px"><a class="btn" href="#inchecken">Eerste bier inchecken</a></p>` : ""}
        </div>`}
    </div>`;

  if (!groups.length) return;

  const draw = () => {
    const q = $("#fSearch").value.trim().toLowerCase();
    const st = $("#fStyle").value;
    const sort = $("#fSort").value;
    let list = groups.filter(g =>
      (!q || `${g.beer.name} ${g.beer.brewery || ""}`.toLowerCase().includes(q)) &&
      (!st || g.beer.style === st));
    const by = {
      recent: (a, b) => b.last.localeCompare(a.last),
      score: (a, b) => (b.avg ?? -1) - (a.avg ?? -1),
      name: (a, b) => a.beer.name.localeCompare(b.beer.name, "nl"),
      abv: (a, b) => (b.beer.abv ?? -1) - (a.beer.abv ?? -1),
      color: (a, b) => beerColor(a.beer.style).rank - beerColor(b.beer.style).rank,
    };
    list.sort(by[sort]);
    $("#beerList").innerHTML = list.length ? list.map(g => `
      <button class="beer" data-beer="${g.beer.id}">
        ${photoBlock(g.photo, g.beer.style)}
        <div class="beer-body">
          <h3>${esc(g.beer.name)}</h3>
          <div class="beer-meta">
            ${g.beer.brewery ? `<span>${esc(g.beer.brewery)}</span>` : ""}
            ${g.beer.style ? `<span>${esc(g.beer.style)}</span>` : ""}
            ${g.beer.abv != null ? `<span>${nf(g.beer.abv)}%</span>` : ""}
          </div>
          <div class="beer-foot">
            ${stars(g.avg)}
            <span class="count">${g.checkins.length > 1 ? `${g.checkins.length} keer` : fmtDate(g.last, g.lastTz)}</span>
          </div>
        </div>
      </button>`).join("") : `<p class="muted">Geen bieren gevonden met deze filters.</p>`;
  };
  ["fSearch", "fStyle", "fSort"].forEach(id => $("#" + id).addEventListener("input", draw));
  draw();

  view().onclick = e => {
    const bd = e.target.closest("[data-badge]");
    if (!bd) return;
    const all = computeBadges(groups.flatMap(g => g.checkins.map(c => ({ ...c, beer: g.beer }))));
    showBadgeDialog(all.find(x => x.key === bd.dataset.badge));
  };
  $("#beerList").addEventListener("click", e => {
    const b = e.target.closest("[data-beer]");
    if (!b) return;
    const g = groups.find(x => x.beer.id === b.dataset.beer);
    showBeer(g, { own, profile });
  });
}

function toLocalInput(iso, tz) {

  return `${p.y}-${z(p.m)}-${z(p.d)}T${z(p.h)}:${z(p.mi)}`;
}
function fromLocalInput(value, tz) {

  return wallToUtc(+m[1], +m[2], +m[3], +m[4], +m[5], 0, tz || DEVICE_TZ).toISOString();
}

// Barcode controleren met het controlecijfer (EAN-8, UPC-A, EAN-13, GTIN-14)
// Alles wat geen cijfer is weghalen, zoals de apostrof die Excel nodig heeft
function cleanBarcode(v) { return String(v || "").trim().replace(/[.,]0+$/, "").replace(/\D/g, ""); }
function validBarcode(code) {
  if (!/^(\d{8}|\d{12}|\d{13}|\d{14})$/.test(code)) return false;
  const digits = [...code].map(Number);
  const check = digits.pop();
  const sum = digits.reverse().reduce((s, d, i) => s + d * (i % 2 === 0 ? 3 : 1), 0);
  return (10 - (sum % 10)) % 10 === check;
}

function offToPrefill(p, code) {

    brewery: (p.brands || "").split(",")[0].trim(),
    abv: abv != null && abv !== "" && !isNaN(Number(abv)) ? Number(abv) : null,
    country: (p.countries || "").split(",")[0].replace(/^en:/, "").trim(),
    image_path: p.image_front_url || null,
    source: "Open Food Facts",
  };
}
async function searchOFF(q) {
  const url = "https://world.openfoodfacts.org/cgi/search.pl?" + new URLSearchParams({
    search_terms: q, search_simple: "1", action: "process", json: "1", page_size: "8",
    tagtype_0: "categories", tag_contains_0: "contains", tag_0: "en:beers",
    fields: "code,product_name,product_name_nl,product_name_en,brands,nutriments,countries,image_front_url",
  });
  const ctrl = new AbortController();
  const t = setTimeout(() => ctrl.abort(), 20000);
  let r;
  try { r = await fetch(url, { signal: ctrl.signal }); }
  catch (ex) { throw new Error(ex.name === "AbortError" ? "Open Food Facts reageert te traag. Probeer het zo nog eens." : "Open Food Facts is niet bereikbaar (" + (ex.message || ex) + ")."); }
  finally { clearTimeout(t); }
  if (r.status === 429) throw new Error("Open Food Facts vraagt om even te wachten. Probeer het over een minuut opnieuw.");
  if (!r.ok) throw new Error("Open Food Facts gaf een fout (code " + r.status + ").");
  const j = await r.json();
  return (j.products || []).filter(p => p.product_name || p.product_name_nl || p.product_name_en);
}

async function lookupBarcode(code) {
  const data = await findBeerByCode(code);
  if (data) return { beer: data };

  // 1. Alle bronnen tegelijk via de Edge Function in Supabase
  try {
    const { data: res, error } = await sb.functions.invoke("barcode-lookup", { body: { code } });
    if (!error && res) {
      const f = res.found;
      if (f) return { prefill: { barcode: code, name: f.name || "", brewery: f.brewery || "", abv: f.abv ?? null, country: f.country || "", image_path: f.image || null, source: f.source } };
      return { prefill: { barcode: code } };
    }
  } catch { /* functie niet beschikbaar: hieronder rechtstreeks proberen */ }

  // 2. Terugvaloptie: rechtstreeks vanuit de browser
  try {
    const r = await fetch(`https://world.openfoodfacts.org/api/v2/product/${encodeURIComponent(code)}.json?fields=product_name,product_name_nl,product_name_en,brands,nutriments,countries,image_front_url`);
    const j = await r.json();
    if (j.status === 1 && j.product) return { prefill: { ...offToPrefill(j.product, code), source: "Open Food Facts" } };
  } catch {}
  try {
    const ctrl = new AbortController();
    const t = setTimeout(() => ctrl.abort(), 8000);
    const r = await fetch(`https://api.upcitemdb.com/prod/trial/lookup?upc=${encodeURIComponent(code)}`, { signal: ctrl.signal });
    clearTimeout(t);
    if (r.ok) {
      const it = (await r.json()).items?.[0];
      if (it?.title) return { prefill: { barcode: code, name: it.title, brewery: it.brand || "", image_path: it.images?.[0] || null, source: "UPCitemdb" } };
    }
  } catch {}
  return { prefill: { barcode: code } };
}

// Barcodelezer: leest EAN/UPC-barcodes horizontaal én verticaal
const BarcodeScan = (() => {
  let reader = null;
  function getReader() {
    if (!reader) {
      const F = ZXing.BarcodeFormat, H = new Map();
      H.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, [F.EAN_13, F.EAN_8, F.UPC_A, F.UPC_E]);
      H.set(ZXing.DecodeHintType.TRY_HARDER, true);
      reader = new ZXing.MultiFormatReader();
      reader.setHints(H);
    }
    return reader;
  }
  const canvas = document.createElement("canvas");
  const ctx = canvas.getContext("2d", { willReadFrequently: true });

  // Tekent een uitsnede van de bron (video of afbeelding), eventueel 90 graden gedraaid
  function draw(src, sx, sy, sw, sh, maxSide, rotate) {
    const scale = Math.min(1, maxSide / Math.max(sw, sh));
    const w = Math.round(sw * scale), h = Math.round(sh * scale);
    canvas.width = rotate ? h : w;
    canvas.height = rotate ? w : h;
    ctx.save();
    if (rotate) { ctx.translate(h, 0); ctx.rotate(Math.PI / 2); }
    ctx.drawImage(src, sx, sy, sw, sh, 0, 0, w, h);
    ctx.restore();
  }
  function decodeCanvas() {
    const { data } = ctx.getImageData(0, 0, canvas.width, canvas.height);
    const lum = new Uint8ClampedArray(canvas.width * canvas.height);
    for (let i = 0, j = 0; i < data.length; i += 4, j++) lum[j] = (data[i] * 77 + data[i + 1] * 150 + data[i + 2] * 29) >> 8;
    const bmp = new ZXing.BinaryBitmap(new ZXing.HybridBinarizer(new ZXing.RGBLuminanceSource(lum, canvas.width, canvas.height)));
    try { return getReader().decodeWithState(bmp).getText(); }
    catch { return null; } finally { getReader().reset(); }
  }
  function tryRegion(src, sx, sy, sw, sh, maxSide, rotations) {
    for (const r of rotations) {
      draw(src, sx, sy, sw, sh, maxSide, r);
      const code = decodeCanvas();
      if (code) return code;
    }
    return null;
  }
  // Foto: hele beeld en het midden, recht en gedraaid
  async function fromFile(file) {
    const bmp = await loadBitmap(file);
    const W = bmp.width, H = bmp.height;
    const crop = c => [W * (1 - c) / 2, H * (1 - c) / 2, W * c, H * c];
    const code =
      tryRegion(bmp, 0, 0, W, H, 1800, [false, true]) ||
      tryRegion(bmp, ...crop(0.6), 1400, [false, true]) ||
      tryRegion(bmp, ...crop(0.35), 1000, [false, true]) ||
      tryRegion(bmp, 0, 0, W, H, 1000, [false, true]);
    bmp.close?.();
    return code;
  }
  // Live camerabeeld: midden van het beeld, afwisselend recht en gedraaid
  let frame = 0;
  function fromVideo(video) {
    const W = video.videoWidth, H = video.videoHeight;
    if (!W || !H) return null;
    const side = Math.min(W, H) * 0.75;
    frame++;
    return tryRegion(video, (W - side) / 2, (H - side) / 2, side, side, 1000, [frame % 2 === 1]);
  }
  return { fromFile, fromVideo };
})();

      <div class="panel stack">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:10px">
          <h2>Nieuw bier</h2>
          <button class="btn ghost small" id="changeBtn" type="button">Annuleren</button>
        </div>
        ${d.prefill?.source && d.prefill.source !== "manual" ? `<p class="muted small">Gegevens gevonden via ${esc(d.prefill.source)}. Controleer ze en vul aan waar nodig.</p>` : ""}
        ${d.prefill?.barcode && !d.prefill?.source ? `<p class="muted small">Barcode ${esc(d.prefill.barcode)} is in geen enkele bron bekend. Vul de gegevens in, dan herkent de app dit bier voortaan.</p>` : ""}
        ${beerFields(d.prefill || {}, { barcode: true })}
      </div>
      ${d.prefill?.barcode ? `
      <div class="panel stack" id="linkBox">
        <h2>Staat dit bier al in jullie lijst?</h2>
        <p class="muted small">Koppel barcode ${esc(d.prefill.barcode)} aan het bestaande bier. Dan herkent de app het voortaan bij het scannen.</p>
        <input class="input" type="search" id="linkSearch" placeholder="Zoek op naam of brouwerij" autocomplete="off">
        <div class="results" id="linkResults"></div>
      </div>` : ""}`) : "";

  view().innerHTML = `
    <form class="stack" id="checkinForm" novalidate>
      <h1>Inchecken</h1>
      ${d ? chosenHtml : chooseHtml}
      ${d ? `
      <div class="panel stack">
        <div>
          <label class="field" for="rating"><span>Score</span></label>
          <div class="rating-row">
            <input type="range" id="rating" name="rating" min="0" max="5" step="0.25" value="3.5">
            <output id="ratingOut">3,5</output>
          </div>
          <div id="ratingStars">${stars(3.5)}</div>
        </div>
        <div>
          <span class="field" style="display:block;font-weight:600;font-size:.92rem;margin-bottom:6px">Hoe gedronken</span>
          <div class="segmented">
            ${servingOptions(null)}
          </div>
        </div>
        <div>
          <label class="field"><span>Locatie</span><input class="input" name="location_name" id="locName" placeholder="Bijv. café of stad"></label>
          <div class="loc-chips" id="locChips">
            <button type="button" class="chip" data-loc="${HOME_LABEL}">🏠 ${HOME_LABEL}</button>
          </div>
          <button class="btn soft small" type="button" id="geoBtn" style="margin-top:8px">Huidige locatie gebruiken</button>
          <input type="hidden" name="latitude" id="lat"><input type="hidden" name="longitude" id="lon">
        </div>
        <label class="field"><span>Wanneer</span><input class="input" type="datetime-local" name="drunk_at" value="${now}"></label>
        <label class="field"><span>Notities</span>${limitedTextarea("notes", 300, "", 'placeholder="Smaak, geur, met wie…"')}</label>
        <div>
          <span style="display:block;font-weight:600;font-size:.92rem;margin-bottom:6px">Foto</span>
          <div class="photo-pick">
            <img id="photoPreview" alt="" hidden>
            <label class="btn soft small" style="cursor:pointer">
              <input type="file" accept="image/*" id="photoInput" hidden>
              Foto maken of kiezen
            </label>
          </div>
        </div>
        <p class="error" id="checkinErr" hidden></p>
        <button class="btn block" type="submit" id="saveBtn">Check-in opslaan</button>
      </div>` : ""}
    </form>`;

  if (!d) {
    $("#scanBtn").onclick = () => startScan();
    bindBarcodePhoto(handleBarcode);
    const lookupTyped = async () => {
      const code = cleanBarcode($("#typedCode").value);
      if (!validBarcode(code)) return toast("Deze barcode klopt niet. Controleer de cijfers onder de streepjes.");
      await stopScanner();
      await handleBarcode(code);
    };
    $("#typedCodeBtn").onclick = lookupTyped;
    $("#typedCode").onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); lookupTyped(); } };
    $("#newBtn").onclick = () => { stopScanner(); state.draft = { prefill: { name: $("#beerSearch").value.trim() } }; renderCheckin(); };
    let timer, seq = 0, own = [], ext = [], offState = "idle", offMsg = "";
    let ownStats = {};
    const item = (attrs, title, sub, extra = "") => `
      <div class="result" role="button" tabindex="0" ${attrs}>
        <span class="res-main"><b>${esc(title)}</b><br><span class="muted small">${esc(sub)}</span></span>
        ${extra}
        <span class="muted small">Kies</span>
      </div>`;
    const cleanQ = () => $("#beerSearch").value.trim().replace(/[,()%*\\]/g, " ").trim();
    const draw = () => {
      const q = cleanQ();
      if (q.length < 2) { $("#results").innerHTML = ""; return; }
      $("#results").innerHTML =
        (own.length ? `<p class="small muted">In jullie lijst</p>` + own.map(b => item(`data-id="${b.id}"`, b.name, [b.brewery, b.style].filter(Boolean).join(", "), statTags(ownStats[b.id], b.id))).join("")
                    : `<p class="small muted">Niet gevonden in jullie lijst.</p>`) +
        (offState === "loading" ? `<p class="small muted" style="margin-top:6px">Zoeken in Open Food Facts…</p>` : "") +
        (offState === "done" ? (ext.length
            ? `<p class="small muted" style="margin-top:6px">Uit Open Food Facts</p>` + ext.map((p, i) => item(`data-off="${i}"`, p.product_name || p.product_name_nl || p.product_name_en, (p.brands || "").split(",")[0])).join("")
            : `<p class="small muted" style="margin-top:6px">Ook niet gevonden in Open Food Facts. Voeg het toe als nieuw bier.</p>`) : "") +
        (offState === "error" ? `<p class="small error" style="margin-top:6px">${esc(offMsg)}</p>` : "") +
        (offState !== "loading" && offState !== "done" ? `<button type="button" class="btn soft small" id="offBtn" style="margin-top:8px">Zoek in Open Food Facts</button>` : "");
    };
    const runOff = async () => {
      const q = cleanQ();
      if (q.length < 3) return toast("Typ minstens 3 letters.");
      const my = ++seq;
      offState = "loading"; draw();
      try {
        const known = new Set(own.map(b => b.barcode).filter(Boolean));
        const res = await searchOFF(q);
        if (my !== seq) return;
        ext = res.filter(p => !known.has(p.code));
        offState = "done";
      } catch (ex) {
        if (my !== seq) return;
        offState = "error"; offMsg = ex.message;
      }
      draw();
    };
    $("#beerSearch").oninput = () => {
      clearTimeout(timer);
      seq++; offState = "idle"; ext = [];
      const q = cleanQ();
      if (q.length < 2) { own = []; draw(); return; }
      timer = setTimeout(async () => {
        const my = seq;
        const { data } = await sb.from("beers").select("*").or(`name.ilike.%${q}%,brewery.ilike.%${q}%`).order("name").limit(8);
        if (my !== seq) return;
        own = data || [];
        ownStats = {};
        draw();
        const st = await statsForBeers(own.map(b => b.id));
        if (my !== seq) return;
        ownStats = st;
        // Beers zonder check-ins krijgen een leeg record, zodat "Nieuw voor jou" verschijnt
        for (const b of own) ownStats[b.id] ||= { mine: [], friends: new Map() };
        draw();
      }, 300);
    };
    $("#beerSearch").onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); runOff(); } };
    $("#results").onkeydown = ev => { if (ev.key === "Enter" && ev.target.matches(".result")) { ev.preventDefault(); ev.target.click(); } };
    $("#results").onclick = ev => {
      if (ev.target.closest("#offBtn")) return runOff();
      const fr = ev.target.closest("[data-friends]");
      if (fr) {
        ev.stopPropagation();
        return showFriendsDialog(own.find(x => x.id === fr.dataset.friends), ownStats[fr.dataset.friends]);
      }
      const r = ev.target.closest("[data-id], [data-off]");
      if (!r) return;
      stopScanner();
      state.draft = r.dataset.id ? { beer: own.find(x => x.id === r.dataset.id) } : { prefill: offToPrefill(ext[Number(r.dataset.off)]) };
      renderCheckin();
    };
    return;
  }

  $("#changeBtn").onclick = () => { state.draft = null; renderCheckin(); };
  if (d.beer) loadBeerStats(d.beer);

  const ls = $("#linkSearch");
  if (ls) {
    let lt, lseq = 0, found = [];
    ls.onkeydown = e => { if (e.key === "Enter") e.preventDefault(); };
    ls.oninput = () => {
      clearTimeout(lt);
      const q = ls.value.trim().replace(/[,()%*\\]/g, " ").trim();
      if (q.length < 2) { $("#linkResults").innerHTML = ""; return; }
      lt = setTimeout(async () => {
        const my = ++lseq;
        const { data } = await sb.from("beers").select("*").or(`name.ilike.%${q}%,brewery.ilike.%${q}%`).order("name").limit(8);
        if (my !== lseq) return;
        found = data || [];
        $("#linkResults").innerHTML = found.length ? found.map(b => `
          <button type="button" class="result" data-link="${b.id}" ${b.barcode ? "disabled" : ""}>
            <span><b>${esc(b.name)}</b><br><span class="muted small">${esc([b.brewery, b.style].filter(Boolean).join(", "))}</span></span>
            <span class="muted small">${b.barcode ? "Heeft al een barcode" : "Koppelen"}</span>
          </button>`).join("") : `<p class="muted small">Niet gevonden. Vul hierboven de gegevens in als nieuw bier.</p>`;
      }, 300);
    };
    $("#linkResults").onclick = async e => {
      const r = e.target.closest("[data-link]");
      if (!r || r.disabled) return;
      r.disabled = true;
      const { error } = await sb.rpc("link_barcode", { beer: r.dataset.link, code: d.prefill.barcode });
      if (error) { r.disabled = false; return toast(error.message); }
      const beer = found.find(b => b.id === r.dataset.link);
      state.draft = { beer: { ...beer, barcode: d.prefill.barcode } };
      toast("Barcode gekoppeld. Voortaan herkent de app dit bier.");
      renderCheckin();
    };
  }

  const r = $("#rating");
  r.oninput = () => { $("#ratingOut").textContent = nf(r.value, 1); $("#ratingStars").innerHTML = stars(r.value); };

  // Snelkeuzes: Tapped at Home en je laatste locaties
  const setLoc = (name, lat, lon) => {
    $("#locName").value = name;
    $("#lat").value = isHome(name) ? "" : (lat ?? "");
    $("#lon").value = isHome(name) ? "" : (lon ?? "");
    $("#geoBtn").textContent = "Huidige locatie gebruiken";
    document.querySelectorAll("#locChips .chip").forEach(c => c.classList.toggle("on", c.dataset.loc === name));
  };
  $("#locChips").onclick = e => {
    const c = e.target.closest("[data-loc]");
    if (c) setLoc(c.dataset.loc, c.dataset.lat || null, c.dataset.lon || null);
  };
  $("#locName").addEventListener("input", () => {
    if (isHome($("#locName").value)) { $("#lat").value = ""; $("#lon").value = ""; }
    document.querySelectorAll("#locChips .chip").forEach(c => c.classList.remove("on"));
  });
  sb.from("checkins").select("location_name, latitude, longitude").eq("user_id", state.user.id)
    .not("location_name", "is", null).order("drunk_at", { ascending: false }).limit(60)
    .then(({ data }) => {
      const box = $("#locChips");
      if (!box || !data) return;
      const seen = new Set();
      const recent = data.filter(r => {
        const k = r.location_name.trim().toLowerCase();
        if (isHome(k) || seen.has(k)) return false;
        seen.add(k); return true;
      }).slice(0, 4);
      box.insertAdjacentHTML("beforeend", recent.map(r =>
        `<button type="button" class="chip" data-loc="${esc(r.location_name)}" data-lat="${r.latitude ?? ""}" data-lon="${r.longitude ?? ""}">📍 ${esc(r.location_name)}</button>`).join(""));
    });

  $("#geoBtn").onclick = () => {
    if (!navigator.geolocation) return toast("Je browser kan je locatie niet bepalen.");
    $("#geoBtn").disabled = true;
    navigator.geolocation.getCurrentPosition(async pos => {
      const { latitude, longitude } = pos.coords;
      $("#lat").value = latitude; $("#lon").value = longitude;
      try {
        const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=18&accept-language=nl&lat=${latitude}&lon=${longitude}`);
        const j = await res.json();
        const a = j.address || {};
        const place = j.name || a.amenity || a.pub || a.bar || a.restaurant || a.road;
        const city = a.city || a.town || a.village;
        if (!$("#locName").value) $("#locName").value = [place, city].filter(Boolean).join(", ");
      } catch {}
      $("#geoBtn").disabled = false;
      $("#geoBtn").textContent = "Locatie toegevoegd";
    }, () => { $("#geoBtn").disabled = false; toast("Locatie niet beschikbaar. Geef de browser toestemming."); }, { enableHighAccuracy: true, timeout: 10000 });
  };

  let photoFile = null;
  $("#photoInput").onchange = e => {
    photoFile = e.target.files[0] || null;
    const img = $("#photoPreview");
    if (photoFile) { img.src = URL.createObjectURL(photoFile); img.hidden = false; }
  };

  $("#checkinForm").onsubmit = async e => {
    e.preventDefault();
    const f = new FormData(e.target);
    const err = $("#checkinErr");
    const btn = $("#saveBtn");
    err.hidden = true; btn.disabled = true; btn.textContent = "Opslaan…";
    try {
      let beer = d.beer;
      if (!beer) {
        const fields = readBeerFields(f);
        if (!fields.name) throw new Error("Vul de naam van het bier in.");
        if (fields.barcode && !validBarcode(fields.barcode)) throw new Error("Deze barcode klopt niet. Controleer de cijfers onder de streepjes, of laat het veld leeg.");
        const insert = { ...fields, source: d.prefill?.source || "manual", image_path: d.prefill?.image_path || null };
        const { data, error } = await sb.from("beers").insert(insert).select().single();
        if (error && error.code === "23505" && insert.barcode) {
          const { data: existing } = await sb.from("beers").select("*").eq("barcode", insert.barcode).single();
          beer = existing;
        } else if (error) throw error;
        else beer = data;
      }

      let photo_path = null;
      if (photoFile) {
        btn.textContent = "Foto uploaden…";
        photo_path = await uploadPhoto(photoFile);
        if (!beer.image_path && beer.created_by === state.user.id) {
          await sb.from("beers").update({ image_path: photo_path }).eq("id", beer.id);
        }
      }

      const home = isHome(f.get("location_name"));
      const lat = home ? null : f.get("latitude"), lon = home ? null : f.get("longitude");
      const { data: inserted, error } = await sb.from("checkins").insert({
        beer_id: beer.id,
        rating: Number(f.get("rating")),
        serving: f.get("serving") || null,
        location_name: home ? HOME_LABEL : (String(f.get("location_name") || "").trim() || null),
        latitude: lat ? Number(lat) : null,
        longitude: lon ? Number(lon) : null,
        drunk_at: f.get("drunk_at") ? new Date(f.get("drunk_at")).toISOString() : new Date().toISOString(),
        tz: currentTz(),
        notes: clampChars(String(f.get("notes") || "").trim(), 300) || null,
        photo_path,
      }).select("id").single();
      if (error) throw error;
      state.draft = null;
      toast(`${beer.name} ingecheckt. Proost!`);
      let fresh = [];
      try {
        const all = await fetchCheckins(state.user.id);
        fresh = newBadgesBetween(computeBadges(all.filter(c => c.id !== inserted.id)), computeBadges(all));
      } catch {}
      location.hash = "lijst";
      if (fresh.length) setTimeout(() => celebrate(fresh), 400);
    } catch (ex) {
      err.textContent = ex.message || "Opslaan lukte niet.";
      err.hidden = false;
      btn.disabled = false; btn.textContent = "Check-in opslaan";
    }
  };
}

async function handleBarcode(code) {
  const msg = $("#scanMsg");
  if (msg) { msg.hidden = false; msg.textContent = `Barcode ${code} gevonden. Gegevens opzoeken…`; }
  const found = await lookupBarcode(code);
  state.draft = found.beer ? { beer: found.beer } : { prefill: found.prefill };
  renderCheckin();
}

async function loadBeerStats(beer) {
  const box = $("#beerStats");
  if (!box) return;
  try {
    const ids = [state.user.id, ...(await friendIds())];
    const { data, error } = await sb
      .from("checkins")
      .select("user_id, rating, drunk_at, profile:profiles!checkins_user_id_fkey(id, display_name, avatar_path)")
      .eq("beer_id", beer.id)
      .in("user_id", ids)
      .order("drunk_at", { ascending: false });
    if (error) throw error;
    if (!$("#beerStats")) return;
    const mine = data.filter(c => c.user_id === state.user.id);
    const per = {};
    for (const c of data.filter(c => c.user_id !== state.user.id)) {
      const p = (per[c.user_id] ||= { profile: c.profile, n: 0, ratings: [], last: c.drunk_at });
      p.n++; if (c.rating != null) p.ratings.push(Number(c.rating));
    }
    const friends = Object.values(per).sort((a, b) => b.n - a.n);
    setTimeout(() => {
      const more = $("#statsMore");
      if (more) more.onclick = async () => showFriendsDialog(beer, (await statsForBeers([beer.id]))[beer.id]);
    });
    const avg = list => list.length ? nf(list.reduce((s, x) => s + x, 0) / list.length, 2) : null;
    const myAvg = avg(mine.filter(c => c.rating != null).map(c => Number(c.rating)));
    const total = friends.reduce((s, f) => s + f.n, 0);
    box.innerHTML = `
      <div class="stat-line">
        <span class="stat-big ${mine.length ? "" : "new"}">${mine.length ? `${mine.length}×` : "Nieuw!"}</span>
        <span>${mine.length
          ? `Jij hebt dit bier ${mine.length === 1 ? "één keer" : mine.length + " keer"} gedronken, voor het laatst op ${fmtDate(mine[0].drunk_at)}${myAvg ? `. Je gaf gemiddeld ${myAvg}` : ""}.`
          : "Dit bier heb je nog nooit ingecheckt. Een nieuwe voor je lijst."}</span>
      </div>
      ${friends.length ? `
        <p class="small" style="margin-top:12px"><b>${friends.length} ${friends.length === 1 ? "vriend heeft" : "vrienden hebben"} dit gedronken</b>, samen ${total} keer: <button type="button" class="linkish" id="statsMore">bekijk</button></p>
        <div class="friend-stats">
          ${friends.map(f => `
            <div class="friend-stat">
              ${avatarHtml(f.profile, 32)}
              <span class="grow"><b>${esc(f.profile?.display_name || "Iemand")}</b> <span class="muted small">${f.n}×${avg(f.ratings) ? `, gemiddeld ${avg(f.ratings)}` : ""}</span></span>
            </div>`).join("")}
        </div>` : `<p class="muted small" style="margin-top:10px">Nog geen van je vrienden heeft dit bier ingecheckt.</p>`}`;
  } catch {
    if ($("#beerStats")) $("#beerStats").hidden = true;
  }
}

function barcodeToolsHtml() {
  return `
      <button class="btn block" id="scanBtn" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 7V4h3M21 7V4h-3M3 17v3h3M21 17v3h-3M7 8v8M10 8v8M13 8v8M17 8v8"/></svg>
        Barcode scannen
      </button>
      <div id="reader" hidden></div>
      <p class="small" id="scanMsg" hidden></p>
      <label class="btn soft block" style="cursor:pointer">
        <input type="file" accept="image/*" capture="environment" id="barcodePhoto" hidden>
        Foto van de barcode maken
      </label>`;
}
function bindBarcodePhoto(onCode) {
  $("#barcodePhoto").onchange = async e => {
    const file = e.target.files[0];
    if (!file) return;
    if (typeof ZXing === "undefined") return toast("De scanner kon niet worden geladen. Ververs de pagina.");
    const msg = $("#scanMsg");
    msg.hidden = false; msg.textContent = "Barcode zoeken in de foto…";
    await stopScanner();
    try {
      const code = await BarcodeScan.fromFile(file);
      if (code) await onCode(code);
      else msg.textContent = "Geen barcode gevonden in de foto. Zorg dat de barcode scherp en goed belicht in beeld is, en probeer het opnieuw.";
    } catch {
      msg.textContent = "De foto kon niet worden gelezen. Probeer het opnieuw.";
    } finally {
      e.target.value = "";
    }
  };
}

// ---------------------------------------------------------------------
// Wie heeft dit bier al gedronken? (jij en je vrienden)
// ---------------------------------------------------------------------
let _friendCache = { at: 0, ids: [] };
async function cachedFriendIds() {
  if (Date.now() - _friendCache.at < 60000) return _friendCache.ids;
  _friendCache = { at: Date.now(), ids: await friendIds() };
  return _friendCache.ids;
}
async function statsForBeers(beerIds) {
  const out = {};
  if (!beerIds.length) return out;
  const ids = [state.user.id, ...(await cachedFriendIds())];
  const { data, error } = await sb
    .from("checkins")
    .select("beer_id, user_id, rating, drunk_at, tz, profile:profiles!checkins_user_id_fkey(id, display_name, avatar_path)")
    .in("beer_id", beerIds)
    .in("user_id", ids)
    .order("drunk_at", { ascending: false });
  if (error) return out;
  for (const c of data) {
    const st = (out[c.beer_id] ||= { mine: [], friends: new Map() });
    if (c.user_id === state.user.id) { st.mine.push(c); continue; }
    if (!st.friends.has(c.user_id)) st.friends.set(c.user_id, { profile: c.profile, list: [] });
    st.friends.get(c.user_id).list.push(c);
  }
  return out;
}
function statTags(st, beerId) {
  if (!st) return "";
  const n = st.mine.length, f = st.friends.size;
  return `<span class="res-stats">
    ${n ? `<span class="tag on">Jij ${n}×</span>` : `<span class="tag new">Nieuw</span>`}
    ${f ? `<button type="button" class="tag friends" data-friends="${beerId}">👥 ${f} ${f === 1 ? "vriend" : "vrienden"}</button>` : ""}
  </span>`;
}
function showFriendsDialog(beer, st) {
  const avg = list => { const r = list.filter(c => c.rating != null).map(c => Number(c.rating)); return r.length ? r.reduce((a, b) => a + b, 0) / r.length : null; };
  const line = (profile, list, me) => {
    const a = avg(list);
    return `
      <div class="friend-line">
        ${avatarHtml(me ? state.me : profile, 40)}
        <div class="grow">
          <b>${me ? "Jij" : esc(profile?.display_name || "Iemand")}</b> <span class="muted small">${list.length}×</span><br>
          <span class="muted small">Laatst op ${fmtDate(list[0].drunk_at, list[0].tz)}</span>
        </div>
        <div class="friend-score">${a != null ? `${stars(a)}<b>${nf(a, 2)}</b>` : `<span class="muted small">Geen score</span>`}</div>
      </div>`;
  };
  const friends = [...(st?.friends.values() || [])].sort((x, y) => y.list.length - x.list.length);
  openDialog(`
    <div class="stack">
      <div>
        <h2>${esc(beer.name)}</h2>
        ${beer.brewery ? `<p class="muted">${esc(beer.brewery)}</p>` : ""}

async function startScan(onCode = handleBarcode) {
  const reader = $("#reader"), msg = $("#scanMsg"), btn = $("#scanBtn");
  if (typeof ZXing === "undefined") {
    msg.hidden = false;
    msg.textContent = "De scanner kon niet worden geladen. Controleer je internetverbinding en ververs de pagina.";
    return;
  }
  if (state.scanner) { await stopScanner(); btn.lastChild.textContent = " Barcode scannen"; msg.hidden = true; return; }

  msg.hidden = false;
  msg.textContent = "Houd de barcode in het kader. Recht of rechtop maakt niet uit.";
  btn.lastChild.textContent = " Stoppen met scannen";
  reader.hidden = false;
  reader.innerHTML = `<video playsinline muted autoplay></video><div class="scan-frame" aria-hidden="true"></div>`;
  const video = reader.querySelector("video");

  try {
    if (!window.isSecureContext || !navigator.mediaDevices?.getUserMedia) throw new Error("insecure");
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: "environment" }, width: { ideal: 1920 }, height: { ideal: 1080 } },
      audio: false,
    });
    state.scanner = { stream, timer: null };
    video.srcObject = stream;
    await video.play();

    const tick = async () => {
      if (!state.scanner) return;
      let code = null;
      try { code = BarcodeScan.fromVideo(video); } catch {}
      if (code) {
        if (navigator.vibrate) navigator.vibrate(60);
        await stopScanner();
        btn.lastChild.textContent = " Barcode scannen";
        await onCode(code);
        return;
      }
      state.scanner.timer = setTimeout(tick, 90);
    };
    tick();
  } catch (ex) {
    await stopScanner();
    btn.lastChild.textContent = " Barcode scannen";
    const t = String(ex?.name || ex?.message || ex);
    msg.textContent =
      /insecure/.test(t) || !window.isSecureContext ? "De camera werkt alleen via een https-adres. Open de app via https://." :
      /NotAllowed|Permission/i.test(t) ? "De browser heeft geen toestemming voor de camera. Op een iPhone: Instellingen, Safari, Camera, kies Sta toe. Of gebruik de knop 'Foto van de barcode maken'." :
      /NotFound|Overconstrained/i.test(t) ? "Er is geen camera gevonden op dit apparaat. Gebruik een telefoon, of zoek het bier op naam." :
      /NotReadable|in use/i.test(t) ? "De camera is in gebruik door een andere app. Sluit die app en probeer het opnieuw." :
      `De camera kon niet worden gestart (${t}). Gebruik de knop 'Foto van de barcode maken', of zoek het bier op naam.`;
  }
}

function normCountry(raw) {
  if (!raw) return null;
  const k = String(raw).toLowerCase().replace(/^[a-z]{2}:/, "").trim().replace(/\s+/g, "-");

  for (const [code, name, al, colors] of COUNTRIES) if (al.split(" ").includes(k) || name.toLowerCase() === k) return { code, name, colors };
  const t = String(raw).replace(/^[a-z]{2}:/, "").trim();
  return { code: null, name: t[0].toUpperCase() + t.slice(1), colors: null };
}
function flag(code) {
  return code ? String.fromCodePoint(...[...code].map(c => 0x1F1A5 + c.charCodeAt(0))) : "🏳️";
}
function hashHue(str) {
  let h = 2166136261;
  for (const ch of str) { h ^= ch.codePointAt(0); h = Math.imul(h, 16777619); }
  return ((h >>> 0) * 137.508) % 360 | 0;
}
function initials(name) {

  const w = words.length ? words : [name];
  return (w.length === 1 ? w[0].slice(0, 2) : w.slice(0, 2).map(x => x[0]).join("")).toUpperCase();

function computeBadges(checkins, extra = {}) {
  const sorted = [...checkins].filter(c => c.beer).sort((a, b) => a.drunk_at.localeCompare(b.drunk_at));
  const fam = {};
  const ensure = (key, meta) => (fam[key] ||= { key, ...meta, count: 0, dates: [] });
  const setCount = (key, meta, value, date) => {
    const f = ensure(key, meta);
    if (value <= f.count) return;
    for (const t of f.t) if (t > f.count && t <= value) f.dates.push(date);
    f.count = value;
  };
  const bump = (key, meta, date) => setCount(key, meta, (fam[key]?.count || 0) + 1, date);
  const once = new Set();
  const bumpOnce = (key, id, date) => { if (once.has(key + "|" + id)) return; once.add(key + "|" + id); bump(key, BADGE_FAMILIES[key], date); };
  const B = BADGE_FAMILIES;
  for (const k of Object.keys(B)) ensure(k, B[k]);
  for (const [id, name, emoji, plural] of STYLE_GROUPS) ensure("style:" + id, { cat: "stijl", name, emoji, t: [5, 10, 25, 50, 100], desc: t => `Drink ${t} verschillende ${plural}` });

  const seenBeer = new Set(), seenCountry = new Set(), seenBrewery = new Set(), seenPlace = new Set(), seenStyle = new Set();
  const perBeer = {}, perDayBeers = {}, perDayPlaces = {};
  const breweryImg = {};
  let prevDay = null, streak = 0, prevWeek = null, weekRun = 0, first = null;
  const dayKeyOf = (y, m, d) => { const t = new Date(Date.UTC(y, m - 1, d)); return `${t.getUTCFullYear()}-${t.getUTCMonth() + 1}-${t.getUTCDate()}`; };

  for (const c of sorted) {
    const iso = c.drunk_at, b = c.beer, dt = new Date(iso);
    const lp = partsIn(iso, c.tz);   // plaatselijke tijd waar het bier gedronken is
    const h = lp.h, wd = lp.wd, m = lp.m, day = lp.d, y = lp.y;
    const style = (b.style || "").toLowerCase();
    const abv = b.abv != null ? Number(b.abv) : null;
    const ct = normCountry(b.country);
    first ||= dt;

    bump("checkins", B.checkins, iso);
    if (c.photo_path) bump("photos", B.photos, iso);
    if (c.notes) bump("notes", B.notes, iso);
    if (c.rating != null) {
      bump("rated", B.rated, iso);
      if (Number(c.rating) >= 5) bump("perfect", B.perfect, iso);
      if (Number(c.rating) <= 1) bump("harsh", B.harsh, iso);
    }
    if (c.serving === "tap") bump("tap", B.tap, iso);
    if (c.serving === "fles") bump("bottle", B.bottle, iso);
    if (c.serving === "blik") bump("can", B.can, iso);
    if (h < 4) bump("night", B.night, iso);
    if (h >= 6 && h < 12) bump("early", B.early, iso);
    if (wd === 5 && h >= 16 && h < 20) bump("friday", B.friday, iso);
    if (wd === 0 || wd === 6) bump("weekend", B.weekend, iso);
    if (wd === 1) bump("monday", B.monday, iso);

    const atHome = isHome(c.location_name);
    if (atHome) bump("home", B.home, iso);
    const place = atHome ? "" : (c.location_name || "").trim().toLowerCase();
    if (place && !seenPlace.has(place)) { seenPlace.add(place); bump("places", B.places, iso); }
    const dk = dayKeyOf(y, m, day);
    if (place) { (perDayPlaces[dk] ||= new Set()).add(place); setCount("tour", B.tour, perDayPlaces[dk].size, iso); }
    (perDayBeers[dk] ||= new Set()).add(c.beer_id);
    setCount("tasting", B.tasting, perDayBeers[dk].size, iso);
    perBeer[c.beer_id] = (perBeer[c.beer_id] || 0) + 1;
    setCount("loyal", B.loyal, perBeer[c.beer_id], iso);

    if (dk !== prevDay) {
      streak = prevDay === dayKeyOf(y, m, day - 1) ? streak + 1 : 1;
      prevDay = dk;
      setCount("streak", B.streak, streak, iso);
    }
    const wk = Math.floor((Date.UTC(y, m - 1, day) / 86400000 + 3) / 7);
    if (wk !== prevWeek) { weekRun = prevWeek === wk - 1 ? weekRun + 1 : 1; prevWeek = wk; setCount("weeks", B.weeks, weekRun, iso); }
    setCount("years", B.years, Math.floor((dt - first) / (365.25 * 86400000)), iso);

    if (m === 4 && day === 27) bumpOnce("kingsday", y, iso);
    if ((m === 12 && day === 31) || (m === 1 && day === 1)) bumpOnce("newyear", m === 12 ? y : y - 1, iso);
    if (m === 12 && day >= 24 && day <= 26) bumpOnce("xmas", y, iso);
    if (m === 2 && day === 14) bumpOnce("valentine", y, iso);
    if (m === 3 && day === 17 && (/stout|porter/.test(style) || ct?.code === "IE")) bumpOnce("patrick", y, iso);

    if (seenBeer.has(c.beer_id)) continue;
    // Vanaf hier: alleen de eerste keer dat je dit bier drinkt
    seenBeer.add(c.beer_id);
    bump("unique", B.unique, iso);
    if (abv != null && abv >= 10) bump("strong", B.strong, iso);
    if (abv != null && abv >= 12) bump("heavy", B.heavy, iso);
    if (abv != null && abv > 0.5 && abv <= 4) bump("light", B.light, iso);
    if (NONALC.test(style) || (abv != null && abv <= 0.5)) bump("nonalc", B.nonalc, iso);
    if (m >= 9 && m <= 11 && /\bbock|\bbok\b|bokbier/.test(style)) bump("bockseason", B.bockseason, iso);
    if (m >= 9 && m <= 10 && ct?.code === "DE") bump("oktober", B.oktober, iso);
    if (m >= 6 && m <= 8 && /wit|weizen|weiss|wheat|blanche|pils|lager|helles/.test(style)) bump("summer", B.summer, iso);
    if ((m === 12 || m <= 2) && /stout|porter|quad|barley ?wine|gerstewijn|imperial/.test(style)) bump("winter", B.winter, iso);

    if (ct) {
      const ck = (ct.code || ct.name).toLowerCase();
      if (!seenCountry.has(ck)) { seenCountry.add(ck); bump("countries", B.countries, iso); }
      bump("country:" + ck, {
        cat: "land", name: `Bier uit ${ct.name}`, emoji: flag(ct.code), colors: ct.colors,
        t: [5, 10, 25, 50, 100, 250], desc: t => `Drink ${t} verschillende bieren uit ${ct.name}`,
      }, iso);
    }
    const br = (b.brewery || "").trim();
    if (br) {
      const bk = br.toLowerCase();
      if (!seenBrewery.has(bk)) { seenBrewery.add(bk); bump("breweries", B.breweries, iso); }
      breweryImg[bk] ||= b.image_path || c.photo_path || null;
      bump("brewery:" + bk, {
        cat: "brouwerij", name: br, emoji: null, monogram: initials(br), hue: hashHue(bk),
        t: [3, 5, 10, 25, 50], desc: t => `Drink ${t} verschillende bieren van ${br}`,
      }, iso);
    }
    for (const [id, name, emoji, plural, re] of STYLE_GROUPS) {
      if (re.test(style)) {
        bump("style:" + id, fam["style:" + id], iso);
        if (!seenStyle.has(id)) { seenStyle.add(id); bump("styles", B.styles, iso); }
      }
    }
  }
  for (const [bk, img] of Object.entries(breweryImg)) if (fam["brewery:" + bk]) fam["brewery:" + bk].image = img;

  for (const [key, dates] of Object.entries(extra)) {
    if (!B[key]) continue;
    [...dates].sort().forEach(d => bump(key, B[key], d));
  }

  return Object.values(fam).map(f => {
    const level = f.dates.length;
    const next = f.t[level];
    return {
      key: f.key, name: f.name, emoji: f.emoji, cat: f.cat, colors: f.colors, image: f.image, monogram: f.monogram, hue: f.hue,
      level, maxLevel: f.t.length, thresholds: f.t, dates: f.dates, count: f.count,
      earnedAt: level ? f.dates[level - 1] : null,
      next, desc: f.desc(next ?? f.t[f.t.length - 1]), descOf: f.desc,
      progress: next ? Math.min(1, f.count / next) : 1,
    };
  });
}

function coasterHtml(b, cls = "") {
  const earned = b.level > 0;
  const tier = TIER_COLORS[Math.max(0, b.level - 1)] || TIER_COLORS.at(-1);
  let ring = "";
  if (earned && b.colors) {
    const seg = 360 / 24, n = b.colors.length;
    ring = `--ring: repeating-conic-gradient(${b.colors.map((c, i) => `${c} ${i * seg}deg ${(i + 1) * seg}deg`).join(", ")});`;
  }
  const img = b.image ? photoUrl(b.image) : null;
  const center = img
    ? `<img class="center-img" src="${esc(img)}" alt="" loading="lazy">`
    : b.monogram
      ? `<span class="mono" style="--hue:${b.hue}">${esc(b.monogram)}</span>`
      : `<span class="em" aria-hidden="true">${b.emoji}</span>`;
  return `<span class="coaster ${cls} ${earned ? "" : "locked"} ${b.colors ? "flagged" : ""}" style="--tier:${earned ? tier : "var(--line)"};${ring}">
    ${center}${earned ? `<span class="lvl">${b.level}</span>` : ""}
  </span>`;
}

function badgeHtml(b, small) {
  const earned = b.level > 0;
  return `
    <button type="button" class="badge ${small ? "small" : ""}" data-badge="${esc(b.key)}">
      ${coasterHtml(b)}
      <span class="badge-name">${esc(b.name)}</span>
      ${small ? "" : earned
        ? `<span class="muted small">${b.level === b.maxLevel ? "Hoogste niveau" : `Niveau ${b.level}`}</span>`
        : `<span class="bar" aria-hidden="true"><span style="width:${Math.round(b.progress * 100)}%"></span></span><span class="muted small">${b.count} / ${b.next}</span>`}
    </button>`;
}

function earnedSorted(badges) {
  return badges.filter(b => b.level > 0).sort((a, b) => b.earnedAt.localeCompare(a.earnedAt));
}

async function fetchSocial(id) {
  try {
    const [g, r, c] = await Promise.all([
      sb.from("cheers").select("created_at").eq("user_id", id),
      sb.from("cheers").select("created_at, checkin:checkins!inner(user_id)").eq("checkin.user_id", id),
      sb.from("comments").select("created_at").eq("user_id", id),
    ]);
    return {
      cheersGiven: (g.data || []).map(x => x.created_at),
      cheersReceived: (r.data || []).map(x => x.created_at),
      comments: (c.data || []).map(x => x.created_at),
    };
  } catch { return {}; }
}

async function renderBadges(userId) {

  view().innerHTML = `<div class="loading">Badges berekenen…</div>`;
  let profile = state.me, checkins, social;

  } catch (err) {

    return;
  }
  const badges = computeBadges(checkins, social);
  const earned = earnedSorted(badges);
  const levels = earned.reduce((n, b) => n + b.level, 0);
  const almost = badges
    .filter(b => b.next && b.count > 0 && b.progress >= 0.3)
    .sort((a, b) => b.progress - a.progress)
    .slice(0, 9);
  const almostKeys = new Set(almost.map(b => b.key));
  const todo = cat => badges
    .filter(b => b.cat === cat && b.level === 0 && !almostKeys.has(b.key))
    .filter(b => !["land", "brouwerij"].includes(cat) || b.count > 0)

  view().innerHTML = `

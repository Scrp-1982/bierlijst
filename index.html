function computeBadges(checkins, extra = {}) {
  const sorted = [...checkins].filter(c => c.beer).sort((a, b) => a.drunk_at.localeCompare(b.drunk_at));
  const fam = {};
  const ensure = (key, meta) => (fam[key] ||= { key, ...meta, count: 0, dates: [] });
  const setCount = (key, meta, value, date) => {
    const f = ensure(key, meta);
    if (value <= f.count) return;
    for (const t of f.t) if (t > f.count && t <= value) f.dates.push(date);
    f.count = value;
  };
  const bump = (key, meta, date) => setCount(key, meta, (fam[key]?.count || 0) + 1, date);
  const once = new Set();
  const bumpOnce = (key, id, date) => { if (once.has(key + "|" + id)) return; once.add(key + "|" + id); bump(key, BADGE_FAMILIES[key], date); };
  const B = BADGE_FAMILIES;
  for (const k of Object.keys(B)) ensure(k, B[k]);
  for (const [id, name, emoji, plural] of STYLE_GROUPS) ensure("style:" + id, { cat: "stijl", name, emoji, t: [5, 10, 25, 50, 100], desc: t => `Drink ${t} verschillende ${plural}` });

  const seenBeer = new Set(), seenCountry = new Set(), seenBrewery = new Set(), seenPlace = new Set(), seenStyle = new Set();
  const perBeer = {}, perDayBeers = {}, perDayPlaces = {};
  const breweryImg = {};
  let prevDay = null, streak = 0, prevWeek = null, weekRun = 0, first = null;
  const dayKey = d => `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`;
  const weekIndex = d => Math.floor((Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 86400000 + 3) / 7);

  for (const c of sorted) {
    const iso = c.drunk_at, b = c.beer, dt = new Date(iso);
    const h = dt.getHours(), wd = dt.getDay(), m = dt.getMonth() + 1, day = dt.getDate(), y = dt.getFullYear();
    const style = (b.style || "").toLowerCase();
    const abv = b.abv != null ? Number(b.abv) : null;
    const ct = normCountry(b.country);
    first ||= dt;

    bump("checkins", B.checkins, iso);
    if (c.photo_path) bump("photos", B.photos, iso);
    if (c.notes) bump("notes", B.notes, iso);
    if (c.rating != null) {
      bump("rated", B.rated, iso);
      if (Number(c.rating) >= 5) bump("perfect", B.perfect, iso);
      if (Number(c.rating) <= 1) bump("harsh", B.harsh, iso);
    }
    if (c.serving === "tap") bump("tap", B.tap, iso);
    if (c.serving === "fles") bump("bottle", B.bottle, iso);
    if (c.serving === "blik") bump("can", B.can, iso);
    if (h < 4) bump("night", B.night, iso);
    if (h >= 6 && h < 12) bump("early", B.early, iso);
    if (wd === 5 && h >= 16 && h < 20) bump("friday", B.friday, iso);
    if (wd === 0 || wd === 6) bump("weekend", B.weekend, iso);
    if (wd === 1) bump("monday", B.monday, iso);

    const place = (c.location_name || "").trim().toLowerCase();
    if (place && !seenPlace.has(place)) { seenPlace.add(place); bump("places", B.places, iso); }
    const dk = dayKey(dt);
    if (place) { (perDayPlaces[dk] ||= new Set()).add(place); setCount("tour", B.tour, perDayPlaces[dk].size, iso); }
    (perDayBeers[dk] ||= new Set()).add(c.beer_id);
    setCount("tasting", B.tasting, perDayBeers[dk].size, iso);
    perBeer[c.beer_id] = (perBeer[c.beer_id] || 0) + 1;
    setCount("loyal", B.loyal, perBeer[c.beer_id], iso);

    if (dk !== prevDay) {
      const yesterday = new Date(dt); yesterday.setDate(dt.getDate() - 1);
      streak = prevDay === dayKey(yesterday) ? streak + 1 : 1;
      prevDay = dk;
      setCount("streak", B.streak, streak, iso);
    }
    const wk = weekIndex(dt);
    if (wk !== prevWeek) { weekRun = prevWeek === wk - 1 ? weekRun + 1 : 1; prevWeek = wk; setCount("weeks", B.weeks, weekRun, iso); }
    setCount("years", B.years, Math.floor((dt - first) / (365.25 * 86400000)), iso);

    if (m === 4 && day === 27) bumpOnce("kingsday", y, iso);
    if ((m === 12 && day === 31) || (m === 1 && day === 1)) bumpOnce("newyear", m === 12 ? y : y - 1, iso);
    if (m === 12 && day >= 24 && day <= 26) bumpOnce("xmas", y, iso);
    if (m === 2 && day === 14) bumpOnce("valentine", y, iso);
    if (m === 3 && day === 17 && (/stout|porter/.test(style) || ct?.code === "IE")) bumpOnce("patrick", y, iso);

    if (seenBeer.has(c.beer_id)) continue;
    // Vanaf hier: alleen de eerste keer dat je dit bier drinkt
    seenBeer.add(c.beer_id);
    bump("unique", B.unique, iso);
    if (abv != null && abv >= 10) bump("strong", B.strong, iso);
    if (abv != null && abv >= 12) bump("heavy", B.heavy, iso);
    if (abv != null && abv > 0.5 && abv <= 4) bump("light", B.light, iso);
    if (NONALC.test(style) || (abv != null && abv <= 0.5)) bump("nonalc", B.nonalc, iso);
    if (b.ibu != null && Number(b.ibu) >= 60) bump("bitter", B.bitter, iso);
    if (m >= 9 && m <= 11 && /\bbock|\bbok\b|bokbier/.test(style)) bump("bockseason", B.bockseason, iso);
    if (m >= 9 && m <= 10 && ct?.code === "DE") bump("oktober", B.oktober, iso);
    if (m >= 6 && m <= 8 && /wit|weizen|weiss|wheat|blanche|pils|lager|helles/.test(style)) bump("summer", B.summer, iso);
    if ((m === 12 || m <= 2) && /stout|porter|quad|barley ?wine|gerstewijn|imperial/.test(style)) bump("winter", B.winter, iso);

    if (ct) {
      const ck = (ct.code || ct.name).toLowerCase();
      if (!seenCountry.has(ck)) { seenCountry.add(ck); bump("countries", B.countries, iso); }
      bump("country:" + ck, {
        cat: "land", name: `Bier uit ${ct.name}`, emoji: flag(ct.code), colors: ct.colors,
        t: [5, 10, 25, 50, 100, 250], desc: t => `Drink ${t} verschillende bieren uit ${ct.name}`,
      }, iso);
    }
    const br = (b.brewery || "").trim();
    if (br) {
      const bk = br.toLowerCase();
      if (!seenBrewery.has(bk)) { seenBrewery.add(bk); bump("breweries", B.breweries, iso); }
      breweryImg[bk] ||= b.image_path || c.photo_path || null;
      bump("brewery:" + bk, {
        cat: "brouwerij", name: br, emoji: null, monogram: initials(br), hue: hashHue(bk),
        t: [3, 5, 10, 25, 50], desc: t => `Drink ${t} verschillende bieren van ${br}`,
      }, iso);
    }
    for (const [id, name, emoji, plural, re] of STYLE_GROUPS) {
      if (re.test(style)) {
        bump("style:" + id, fam["style:" + id], iso);
        if (!seenStyle.has(id)) { seenStyle.add(id); bump("styles", B.styles, iso); }
      }
    }
  }
  for (const [bk, img] of Object.entries(breweryImg)) if (fam["brewery:" + bk]) fam["brewery:" + bk].image = img;

  for (const [key, dates] of Object.entries(extra)) {
    if (!B[key]) continue;
    [...dates].sort().forEach(d => bump(key, B[key], d));
  }

  return Object.values(fam).map(f => {
    const level = f.dates.length;
    const next = f.t[level];
    return {
      key: f.key, name: f.name, emoji: f.emoji, cat: f.cat, colors: f.colors, image: f.image, monogram: f.monogram, hue: f.hue,
      level, maxLevel: f.t.length, thresholds: f.t, dates: f.dates, count: f.count,
      earnedAt: level ? f.dates[level - 1] : null,
      next, desc: f.desc(next ?? f.t[f.t.length - 1]), descOf: f.desc,
      progress: next ? Math.min(1, f.count / next) : 1,
    };
  });
}

function coasterHtml(b, cls = "") {
  const earned = b.level > 0;
  const tier = TIER_COLORS[Math.max(0, b.level - 1)] || TIER_COLORS.at(-1);
  let ring = "";
  if (earned && b.colors) {
    const seg = 360 / 24, n = b.colors.length;
    ring = `--ring: repeating-conic-gradient(${b.colors.map((c, i) => `${c} ${i * seg}deg ${(i + 1) * seg}deg`).join(", ")});`;
  }
  const img = b.image ? photoUrl(b.image) : null;
  const center = img
    ? `<img class="center-img" src="${esc(img)}" alt="" loading="lazy">`
    : b.monogram
      ? `<span class="mono" style="--hue:${b.hue}">${esc(b.monogram)}</span>`
      : `<span class="em" aria-hidden="true">${b.emoji}</span>`;
  return `<span class="coaster ${cls} ${earned ? "" : "locked"} ${b.colors ? "flagged" : ""}" style="--tier:${earned ? tier : "var(--line)"};${ring}">
    ${center}${earned ? `<span class="lvl">${b.level}</span>` : ""}
  </span>`;
}

function badgeHtml(b, small) {
  const earned = b.level > 0;
  return `
    <button type="button" class="badge ${small ? "small" : ""}" data-badge="${esc(b.key)}">
      ${coasterHtml(b)}
      <span class="badge-name">${esc(b.name)}</span>
      ${small ? "" : earned
        ? `<span class="muted small">${b.level === b.maxLevel ? "Hoogste niveau" : `Niveau ${b.level}`}</span>`
        : `<span class="bar" aria-hidden="true"><span style="width:${Math.round(b.progress * 100)}%"></span></span><span class="muted small">${b.count} / ${b.next}</span>`}
    </button>`;
}

function showBadgeDialog(b) {
  if (!b) return;
  const earned = b.level > 0;
  openDialog(`
    <div class="stack badge-detail">
      ${coasterHtml(b, "big")}
      <h2>${esc(b.name)}</h2>
      ${earned ? `<p class="muted">Niveau ${b.level} van ${b.maxLevel}, verdiend op ${fmtDate(b.earnedAt)}</p>` : `<p class="muted">Nog niet verdiend</p>`}
      ${b.next ? `
        <div>
          <p><b>Volgende niveau:</b> ${esc(b.desc)}</p>
          <span class="bar" aria-hidden="true" style="margin-top:8px"><span style="width:${Math.round(b.progress * 100)}%"></span></span>
          <p class="muted small">${b.count} van ${b.next}</p>
        </div>` : `<p>Je hebt het hoogste niveau bereikt. Proost!</p>`}
      <div>
        <h3>Alle niveaus</h3>
        <ol class="levels">
          ${b.thresholds.map((t, i) => `<li class="${i < b.level ? "done" : ""}"><span class="dot" style="background:${TIER_COLORS[i] || TIER_COLORS.at(-1)}"></span><span>${esc(b.descOf(t))}${b.dates[i] ? ` <span class="muted small">(${fmtDate(b.dates[i])})</span>` : ""}</span></li>`).join("")}
        </ol>
      </div>
    </div>`);
}

function earnedSorted(badges) {
  return badges.filter(b => b.level > 0).sort((a, b) => b.earnedAt.localeCompare(a.earnedAt));
}

async function fetchSocial(id) {
  try {
    const [g, r, c] = await Promise.all([
      sb.from("cheers").select("created_at").eq("user_id", id),
      sb.from("cheers").select("created_at, checkin:checkins!inner(user_id)").eq("checkin.user_id", id),
      sb.from("comments").select("created_at").eq("user_id", id),
    ]);
    return {
      cheersGiven: (g.data || []).map(x => x.created_at),
      cheersReceived: (r.data || []).map(x => x.created_at),
      comments: (c.data || []).map(x => x.created_at),
    };
  } catch { return {}; }
}

async function renderBadges(userId) {
  setTab("badges");
  const id = userId || state.user.id;
  const own = id === state.user.id;
  view().innerHTML = `<div class="loading">Badges berekenen…</div>`;
  let profile = state.me, checkins, social;
  try {
    if (!own) ({ data: profile } = await sb.from("profiles").select("*").eq("id", id).maybeSingle());
    [checkins, social] = await Promise.all([fetchCheckins(id), fetchSocial(id)]);
  } catch (err) {
    view().innerHTML = `<p class="error">Badges konden niet worden geladen: ${esc(err.message)}</p>`;
    return;
  }
  const badges = computeBadges(checkins, social);
  const earned = earnedSorted(badges);
  const levels = earned.reduce((n, b) => n + b.level, 0);
  const almost = badges
    .filter(b => b.next && b.count > 0 && b.progress >= 0.3)
    .sort((a, b) => b.progress - a.progress)
    .slice(0, 9);
  const almostKeys = new Set(almost.map(b => b.key));
  const todo = cat => badges
    .filter(b => b.cat === cat && b.level === 0 && !almostKeys.has(b.key))
    .filter(b => !["land", "brouwerij"].includes(cat) || b.count > 0)
    .sort((a, b) => b.progress - a.progress);

  view().innerHTML = `
    <div class="stack">
      <div class="title-with-avatar">
        ${!own ? avatarHtml(profile, 56) : ""}
        <div>
          <h1>${own ? "Mijn badges" : `Badges van ${esc(profile?.display_name || "een vriend")}`}</h1>
          <p class="muted">${earned.length} ${earned.length === 1 ? "badge" : "badges"} verdiend, ${levels} ${levels === 1 ? "niveau" : "niveaus"} in totaal</p>
        </div>
      </div>
      ${earned.length ? `<section class="stack"><h2>Verdiend</h2><div class="badges">${earned.map(b => badgeHtml(b)).join("")}</div></section>`
        : `<div class="panel empty">${coasterHtml({ level: 0, emoji: "🍺" }, "big")}<h2 style="margin-top:12px">Nog geen badges</h2><p class="muted">${own ? "Check je eerste bier in en verdien meteen je eerste badge." : "Nog niets verdiend."}</p></div>`}
      ${almost.length ? `<section class="stack"><h2>Bijna</h2><div class="badges">${almost.map(b => badgeHtml(b)).join("")}</div></section>` : ""}
      ${BADGE_CATS.map(([cat, label]) => {
        const list = todo(cat);
        return list.length ? `<section class="stack"><h2>Nog te verdienen: ${label.toLowerCase()}</h2><div class="badges">${list.map(b => badgeHtml(b)).join("")}</div></section>` : "";
      }).join("")}
    </div>`;
  view().onclick = e => {
    const el = e.target.closest("[data-badge]");
    if (el) showBadgeDialog(badges.find(b => b.key === el.dataset.badge));
  };
}

function newBadgesBetween(before, after) {
  const prev = Object.fromEntries(before.map(b => [b.key, b.level]));
  return after.filter(b => b.level > (prev[b.key] || 0));
}
function celebrate(newOnes) {
  openDialog(`

async function fetchAllBeers() {
  let all = [];
  for (let from = 0; ; from += 1000) {
    const { data, error } = await sb.from("beers").select("*").order("name").range(from, from + 999);
    if (error) throw error;
    all = all.concat(data);
    if (data.length < 1000) break;
  }
  return all;
}

function downloadCsv(rows, cols, filename) {
  const cell = v => {
    if (v == null) return "";
    const s = typeof v === "number" ? String(v).replace(".", ",") : String(v);
    return /[;"\n\r]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
  };
  const csv = [cols.join(";"), ...rows.map(r => cols.map(c => cell(r[c])).join(";"))].join("\r\n");
  const blob = new Blob(["\ufeff" + csv], { type: "text/csv;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

const CSV_COLS = ["naam", "brouwerij", "stijl", "alcohol", "ibu", "land", "barcode", "omschrijving", "foto"];

async function exportDatabase() {
  toast("Database ophalen…");
  try {
    const beers = await fetchAllBeers();
    const rows = beers.map(b => ({
      naam: b.name, brouwerij: b.brewery, stijl: b.style, alcohol: b.abv, ibu: b.ibu,
      land: b.country, barcode: b.barcode, omschrijving: b.description, foto: photoUrl(b.image_path),
    }));
    downloadCsv(rows, CSV_COLS, `bierdatabase-${new Date().toISOString().slice(0, 10)}.csv`);
    toast(`${rows.length} bieren geëxporteerd`);
  } catch (err) { toast("Exporteren lukte niet: " + err.message); }
}

// Kolomnamen die we herkennen (Nederlands, Engels en Untappd-export)
const CSV_SYNONYMS = {
  name: ["naam", "bier", "biernaam", "name", "beer", "beername", "beer_name", "product", "productname", "product_name", "title"],
  brewery: ["brouwerij", "brouwer", "brewery", "brewer", "brewery_name", "breweryname", "brand", "brands", "merk"],
  style: ["stijl", "biertype", "soort", "type", "style", "beer_type", "beertype", "beer_style"],
  abv: ["alcohol", "alc", "abv", "alcoholpercentage", "alcohol_percentage", "beer_abv", "vol", "alcvol"],
  ibu: ["ibu", "bitterheid", "beer_ibu"],
  country: ["land", "herkomst", "country", "brewery_country", "origin", "countries"],
  barcode: ["barcode", "ean", "ean13", "gtin", "upc", "code"],
  description: ["omschrijving", "beschrijving", "description", "notes", "beer_description"],
  image: ["foto", "afbeelding", "image", "photo", "photo_url", "image_url", "beer_label", "label"],
};
const FIELD_LABELS = { name: "Naam", brewery: "Brouwerij", style: "Stijl", abv: "Alcohol", ibu: "IBU", country: "Land", barcode: "Barcode", description: "Omschrijving", image: "Foto" };

function mapColumns(headers) {
  const norm = h => String(h).toLowerCase().replace(/^\ufeff/, "").trim().replace(/[\s.%()-]+/g, "_").replace(/^_+|_+$/g, "");
  const map = {};
  for (const [field, names] of Object.entries(CSV_SYNONYMS)) {
    const h = headers.find(h => names.includes(norm(h)) || names.includes(norm(h).replace(/_/g, "")));
    if (h) map[field] = h;
  }
  return map;
}

async function readCsvFile(file) {
  const buf = await file.arrayBuffer();
  let text;
  try { text = new TextDecoder("utf-8", { fatal: true }).decode(buf); }
  catch { text = new TextDecoder("windows-1252").decode(buf); }
  const res = Papa.parse(text.replace(/^\ufeff/, ""), { header: true, skipEmptyLines: "greedy", transformHeader: h => h.trim() });
  return { rows: res.data, headers: res.meta.fields || [] };
}

function rowToBeer(r, map) {
  const get = f => (map[f] ? String(r[map[f]] ?? "").trim() : "");
  const num = v => { const n = parseFloat(String(v).replace(",", ".").replace(/[^\d.]/g, "")); return isNaN(n) ? null : n; };
  const name = get("name");
  if (!name) return { skip: "geen naam" };
  let barcode = cleanBarcode(get("barcode")).replace(/\.0+$/, "");
  let badCode = false;
  if (barcode && !validBarcode(barcode)) {
    // Excel laat voorloopnullen weg: probeer ze terug te zetten
    const fixed = [12, 13, 14].map(n => barcode.padStart(n, "0")).find(validBarcode);
    if (fixed) barcode = fixed; else { barcode = ""; badCode = true; }
  }
  const abv = num(get("abv"));
  const ibu = num(get("ibu"));
  const ct = normCountry(get("country"));
  const img = get("image");
  return {
    beer: {
      name: name.slice(0, 200),
      brewery: get("brewery") || null,
      style: get("style") || null,
      abv: abv != null && abv >= 0 && abv <= 70 ? abv : null,
      ibu: ibu != null && ibu >= 0 && ibu <= 300 ? Math.round(ibu) : null,
      country: ct ? ct.name : null,
      barcode: barcode || null,
      description: get("description") || null,
      image_path: /^https:\/\//.test(img) ? img : null,
    },
    badCode,
  };
}

function openImportDialog() {
  openDialog(`
    <div class="stack">
      <h2>CSV importeren</h2>
      <p>Kies een CSV-bestand met bieren. De app herkent kolommen als naam, brouwerij, stijl, alcohol, IBU, land, barcode en omschrijving, ook in het Engels of uit een Untappd-export.</p>
      <p class="muted small">Je ziet eerst een voorbeeld; er wordt pas iets opgeslagen als je op Importeren klikt.</p>
      <div style="display:flex;gap:10px;flex-wrap:wrap">
        <label class="btn" style="cursor:pointer"><input type="file" accept=".csv,text/csv" id="csvFile" hidden>CSV-bestand kiezen</label>
        <button class="btn ghost" type="button" id="csvTemplate">Voorbeeldbestand downloaden</button>
      </div>
      <div id="csvResult"></div>
    </div>`);
  $("#csvTemplate").onclick = downloadTemplate;
  $("#csvFile").onchange = async e => {
    const file = e.target.files[0];
    if (!file) return;
    const box = $("#csvResult");
    box.innerHTML = `<p class="muted">Bestand lezen en vergelijken met de database…</p>`;
    try {
      if (typeof Papa === "undefined") throw new Error("De CSV-lezer kon niet worden geladen. Ververs de pagina.");
      const { rows, headers } = await readCsvFile(file);
      const map = mapColumns(headers);
      if (!map.name) {
        box.innerHTML = `<p class="error">Er is geen kolom met de naam van het bier gevonden. Gevonden kolommen: ${esc(headers.join(", "))}. Noem de kolom bijvoorbeeld “naam”.</p>`;
        return;
      }
      const existing = await fetchAllBeers();
      const byCode = new Map(existing.filter(b => b.barcode).map(b => [b.barcode, b]));
      const key = b => `${(b.name || "").toLowerCase().trim()}|${(b.brewery || "").toLowerCase().trim()}`;
      const byName = new Map(existing.map(b => [key(b), b]));

      const plan = { insert: [], fill: [], same: 0, skipped: 0, badCodes: 0, dupes: 0 };
      const seen = new Set();
      for (const r of rows) {
        const res = rowToBeer(r, map);
        if (res.skip) { plan.skipped++; continue; }
        if (res.badCode) plan.badCodes++;
        const nb = res.beer;
        const k = nb.barcode || key(nb);
        if (seen.has(k)) { plan.dupes++; continue; }
        seen.add(k);
        const match = (nb.barcode && byCode.get(nb.barcode)) || byName.get(key(nb));
        if (!match) {
          if (nb.barcode && byCode.has(nb.barcode)) { plan.same++; continue; }
          plan.insert.push({ ...nb, source: "csv" });
          continue;
        }
        const patch = {};
        for (const f of ["brewery", "style", "abv", "ibu", "country", "barcode", "description", "image_path"]) {
          if ((match[f] == null || match[f] === "") && nb[f] != null && nb[f] !== "") {
            if (f === "barcode" && byCode.has(nb[f])) continue;
            patch[f] = nb[f];
          }
        }
        if (Object.keys(patch).length) plan.fill.push({ id: match.id, name: match.name, patch });
        else plan.same++;
      }

      const preview = plan.insert.slice(0, 5);
      box.innerHTML = `
        <div class="stack" style="margin-top:8px">
          <div class="panel stack">
            <h3>Herkende kolommen</h3>
            <p class="small">${Object.entries(map).map(([f, h]) => `<b>${FIELD_LABELS[f]}</b> uit “${esc(h)}”`).join(", ")}</p>
            ${headers.filter(h => !Object.values(map).includes(h)).length ? `<p class="muted small">Niet gebruikt: ${esc(headers.filter(h => !Object.values(map).includes(h)).join(", "))}</p>` : ""}
          </div>
          <div class="panel">
            <ul class="import-sum">
              <li><b>${plan.insert.length}</b> ${plan.insert.length === 1 ? "nieuw bier" : "nieuwe bieren"}</li>
              <li><b>${plan.fill.length}</b> ${plan.fill.length === 1 ? "bestaand bier" : "bestaande bieren"} met aan te vullen gegevens</li>
              <li><b>${plan.same}</b> ${plan.same === 1 ? "staat" : "staan"} al volledig in de database</li>
              ${plan.dupes ? `<li><b>${plan.dupes}</b> dubbel in het bestand, één keer meegenomen</li>` : ""}
              ${plan.skipped ? `<li><b>${plan.skipped}</b> ${plan.skipped === 1 ? "regel" : "regels"} zonder naam, overgeslagen</li>` : ""}
              ${plan.badCodes ? `<li><b>${plan.badCodes}</b> ${plan.badCodes === 1 ? "ongeldige barcode" : "ongeldige barcodes"} weggelaten (het bier zelf wordt wel toegevoegd)</li>` : ""}
            </ul>
          </div>
          ${preview.length ? `
            <div>
              <h3>Voorbeeld van nieuwe bieren</h3>
              <div class="table-scroll"><table class="preview">
                <thead><tr><th>Naam</th><th>Brouwerij</th><th>Stijl</th><th>Alc.</th><th>Land</th><th>Barcode</th></tr></thead>
                <tbody>${preview.map(b => `<tr><td>${esc(b.name)}</td><td>${esc(b.brewery)}</td><td>${esc(b.style)}</td><td>${b.abv != null ? nf(b.abv) + "%" : ""}</td><td>${esc(b.country)}</td><td>${esc(b.barcode)}</td></tr>`).join("")}</tbody>
              </table></div>
            </div>` : ""}
          ${plan.fill.length ? `<label class="switch"><span>Lege velden van bestaande bieren aanvullen<br><span class="muted small">Bestaande gegevens worden nooit overschreven.</span></span><input type="checkbox" id="csvFill" checked></label>` : ""}
          ${plan.insert.length || plan.fill.length
            ? `<button class="btn block" type="button" id="csvGo">Importeren</button>`
            : `<p class="muted">Er is niets nieuws om te importeren.</p>`}
          <div id="csvProgress" hidden><span class="bar"><span style="width:0%"></span></span><p class="muted small" style="margin-top:6px"></p></div>
        </div>`;

      const go = $("#csvGo");
      if (go) go.onclick = async () => {
        go.disabled = true;
        const fill = $("#csvFill") ? $("#csvFill").checked : false;
        const jobs = plan.insert.length + (fill ? plan.fill.length : 0);
        let done = 0, failed = 0;
        const prog = $("#csvProgress"); prog.hidden = false;
        const tick = () => {
          prog.querySelector(".bar > span").style.width = `${Math.round(done / Math.max(1, jobs) * 100)}%`;
          prog.querySelector("p").textContent = `${done} van ${jobs} verwerkt${failed ? `, ${failed} mislukt` : ""}`;
        };
        for (let i = 0; i < plan.insert.length; i += 200) {
          const chunk = plan.insert.slice(i, i + 200);
          const { error } = await sb.from("beers").insert(chunk);
          if (error) {
            // Eén foute regel mag de rest niet tegenhouden: dan per stuk
            for (const b of chunk) { const { error: e1 } = await sb.from("beers").insert(b); if (e1) failed++; done++; tick(); }
          } else { done += chunk.length; tick(); }
        }
        if (fill) {
          for (let i = 0; i < plan.fill.length; i += 5) {
            await Promise.all(plan.fill.slice(i, i + 5).map(async f => {
              const { error } = await sb.from("beers").update(f.patch).eq("id", f.id);
              if (error) failed++;
              done++;
            }));
            tick();
          }
        }
        tick();
        $("#csvResult").insertAdjacentHTML("beforeend", `
          <div class="panel" style="margin-top:12px">
            <h3>Klaar</h3>
            <p>${plan.insert.length} ${plan.insert.length === 1 ? "bier" : "bieren"} toegevoegd${fill && plan.fill.length ? ` en ${plan.fill.length} aangevuld` : ""}.${failed ? ` ${failed} lukte niet, bijvoorbeeld door een barcode die al bij een ander bier hoort.` : ""}</p>
            <button class="btn" type="button" id="csvDone">Naar de database</button>
          </div>`);
        $("#csvDone").onclick = () => { closeDialog(); renderDatabase(); };
      };
    } catch (err) {
      box.innerHTML = `<p class="error">${esc(err.message || err)}</p>`;
    } finally {
      e.target.value = "";
    }
  };
}

const DB_PAGE = 30;

async function renderDatabase() {
  setTab("database");
  view().innerHTML = `<div class="loading">Database ophalen…</div>`;
  const [{ data: mine }, { count: total }, { count: withCode }] = await Promise.all([
    sb.from("checkins").select("beer_id").eq("user_id", state.user.id),
    sb.from("beers").select("id", { count: "exact", head: true }),
    sb.from("beers").select("id", { count: "exact", head: true }).not("barcode", "is", null),
  ]);
  const myCount = {};
  for (const r of mine || []) myCount[r.beer_id] = (myCount[r.beer_id] || 0) + 1;

  view().innerHTML = `
    <div class="stack">
      <div class="collection-head">
        <div>
          <h1>Bierdatabase</h1>
          <p class="muted">${total ?? 0} bieren, waarvan ${withCode ?? 0} met barcode</p>
        </div>
        <a class="btn" href="#database/nieuw">Bier toevoegen</a>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn ghost small" type="button" id="dbExport">Exporteren (CSV)</button>
        ${state.me?.is_admin ? `<button class="btn ghost small" type="button" id="dbImport">Importeren (CSV)</button>` : ""}
      </div>
      <div class="filters">
        <input class="input search" type="search" id="dbSearch" placeholder="Zoek op bier of brouwerij" aria-label="Zoeken">
        <select class="input" id="dbFilter" aria-label="Filter">
          <option value="">Alle bieren</option>
          <option value="nocode">Zonder barcode</option>
          <option value="nophoto">Zonder foto</option>
          <option value="incomplete">Onvolledig</option>
          <option value="new">Nog niet gedronken</option>
        </select>
      </div>
      <div class="db-list" id="dbList"></div>
      <button class="btn ghost block" id="dbMore" type="button" hidden>Meer laden</button>
    </div>`;

  let items = [], seq = 0;
  const rowHtml = b => `
    <button type="button" class="db-row" data-dbbeer="${b.id}">
      ${photoBlock(b.image_path, b.style)}
      <span class="db-body">
        <b>${esc(b.name)}</b>
        <span class="beer-meta">
          ${b.brewery ? `<span>${esc(b.brewery)}</span>` : ""}
          ${b.style ? `<span>${esc(b.style)}</span>` : ""}
          ${b.abv != null ? `<span>${nf(b.abv)}%</span>` : ""}
        </span>
        <span class="tags">
          ${myCount[b.id] ? `<span class="tag on">Jij: ${myCount[b.id]}×</span>` : ""}
          ${b.barcode ? "" : `<span class="tag">Geen barcode</span>`}
          ${!b.style || b.abv == null || !b.country ? `<span class="tag">Onvolledig</span>` : ""}
        </span>
      </span>
    </button>`;

  const load = async (append) => {
    const my = ++seq;
    const q = $("#dbSearch").value.trim().replace(/[,()%*\\]/g, " ").trim();
    const filter = $("#dbFilter").value;
    let query = sb.from("beers").select("*").order("name");
    if (q) query = query.or(`name.ilike.%${q}%,brewery.ilike.%${q}%`);
    if (filter === "nocode") query = query.is("barcode", null);
    if (filter === "nophoto") query = query.is("image_path", null);
    if (filter === "incomplete") query = query.or("style.is.null,abv.is.null,country.is.null");
    if (filter === "new" && Object.keys(myCount).length) query = query.not("id", "in", `(${Object.keys(myCount).join(",")})`);
    const from = append ? items.length : 0;
    const { data, error } = await query.range(from, from + DB_PAGE - 1);
    if (my !== seq) return;
    if (error) { $("#dbList").innerHTML = `<p class="error">Laden lukte niet: ${esc(error.message)}</p>`; return; }
    items = append ? items.concat(data) : data;
    $("#dbList").innerHTML = items.length ? items.map(rowHtml).join("") : `<p class="muted">Geen bieren gevonden.${q ? ` <a href="#database/nieuw">Voeg “${esc(q)}” toe</a>.` : ""}</p>`;
    $("#dbMore").hidden = data.length < DB_PAGE;
  };
  let t;
  $("#dbSearch").oninput = () => { clearTimeout(t); t = setTimeout(() => load(false), 300); };
  $("#dbFilter").onchange = () => load(false);
  $("#dbMore").onclick = () => load(true);
  $("#dbExport").onclick = exportDatabase;
  if ($("#dbImport")) $("#dbImport").onclick = openImportDialog;
  $("#dbList").onclick = e => {
    const r = e.target.closest("[data-dbbeer]");
    if (r) showDbBeer(items.find(b => b.id === r.dataset.dbbeer));
  };
  load(false);
}

async function renderBeerForm(id) {
  setTab("database");
  let beer = {};
  if (id) {
    view().innerHTML = `<div class="loading">Bier ophalen…</div>`;
    const { data } = await sb.from("beers").select("*").eq("id", id).maybeSingle();
    if (!data) { view().innerHTML = `<p class="error">Dit bier bestaat niet (meer).</p>`; return; }
    beer = data;
  }
  const isNew = !id;
  let source = "manual", lookedUpImage = null, photoFile = null;

  view().innerHTML = `
    <form class="stack" id="beerForm" novalidate>
      <div>
        <p><a href="#database" class="small">Terug naar de bierdatabase</a></p>
        <h1>${isNew ? "Bier toevoegen" : "Bier bewerken"}</h1>
        ${isNew ? `<p class="muted">Het bier komt in de database zonder dat je het incheckt.</p>` : ""}
      </div>

      <div class="panel stack">
        <h2>Barcode</h2>
        ${barcodeToolsHtml()}
        <div class="type-code">
          <input class="input" name="barcode" id="formCode" inputmode="numeric" autocomplete="off" placeholder="Barcode intypen" aria-label="Barcode" value="${esc(beer.barcode)}">
          <button class="btn ghost" type="button" id="formLookup">Opzoeken</button>
        </div>
        <p class="muted small" id="lookupMsg">Scan of typ de barcode en kies Opzoeken. Lege velden worden dan aangevuld uit alle bronnen.</p>
      </div>

      <div class="panel stack">
        <h2>Gegevens</h2>
        ${beerFields(beer)}
      </div>

      <div class="panel stack">
        <h2>Foto</h2>
        <div class="photo-pick">
          <img id="beerPhotoPreview" alt="" ${beer.image_path ? `src="${esc(photoUrl(beer.image_path))}"` : "hidden"}>
          <label class="btn soft small" style="cursor:pointer">
            <input type="file" accept="image/*" id="beerPhoto" hidden>
            ${beer.image_path ? "Andere foto kiezen" : "Foto kiezen"}
          </label>
        </div>
      </div>

      <p class="error" id="beerFormErr" hidden></p>
      <div style="display:flex;gap:10px;flex-wrap:wrap">
        ${isNew
          ? `<button class="btn" type="submit" data-then="db">Opslaan</button><button class="btn soft" type="submit" data-then="checkin">Opslaan en inchecken</button>`
          : `<button class="btn" type="submit" data-then="db">Wijzigingen opslaan</button>`}
        ${!isNew && state.me?.is_admin ? `<button class="btn danger" type="button" id="beerDelete">Bier verwijderen</button>` : ""}
      </div>
    </form>`;

  const form = $("#beerForm");
  const msg = $("#lookupMsg");

  const fill = pre => {
    let n = 0;
    for (const k of ["name", "brewery", "style", "abv", "ibu", "country", "description"]) {
      const el = form.elements[k];
      if (el && !String(el.value).trim() && pre[k] != null && pre[k] !== "") { el.value = pre[k]; n++; }
    }
    if (pre.image_path && !beer.image_path && !photoFile) {
      lookedUpImage = pre.image_path;
      const img = $("#beerPhotoPreview"); img.src = photoUrl(pre.image_path); img.hidden = false;
    }
    if (pre.source) source = pre.source;
    return n;
  };

  const onCode = async code => {
    $("#formCode").value = code;
    msg.textContent = `Barcode ${code}: opzoeken in alle bronnen…`;
    const found = await lookupBarcode(code);
    if (found.beer && found.beer.id !== beer.id) {
      msg.innerHTML = `Dit bier staat al in de database: <b>${esc(found.beer.name)}</b>. <a href="#database/bewerk/${found.beer.id}">Openen</a>`;
      return;
    }
    if (found.beer) { msg.textContent = "Deze barcode hoort al bij dit bier."; return; }
    if (found.prefill?.source) {
      const n = fill(found.prefill);
      msg.textContent = `Gevonden via ${found.prefill.source}. ${n ? `${n} ${n === 1 ? "veld" : "velden"} aangevuld, controleer ze even.` : "Alle velden waren al ingevuld."}`;
    } else {
      msg.textContent = "Deze barcode is in geen enkele bron bekend. Vul de gegevens zelf in, dan kent de app hem voortaan.";
    }
  };

  $("#scanBtn").onclick = () => startScan(onCode);
  bindBarcodePhoto(onCode);
  $("#formLookup").onclick = () => {
    const code = cleanBarcode($("#formCode").value);
    if (!validBarcode(code)) return toast("Deze barcode klopt niet. Controleer de cijfers onder de streepjes.");
    stopScanner();
    onCode(code);
  };
  $("#formCode").onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); $("#formLookup").click(); } };
  $("#beerPhoto").onchange = e => {
    photoFile = e.target.files[0] || null;
    if (photoFile) { const img = $("#beerPhotoPreview"); img.src = URL.createObjectURL(photoFile); img.hidden = false; }
  };

  const del = $("#beerDelete");
  if (del) del.onclick = async () => {
    if (!confirm(`${beer.name} verwijderen uit de database?`)) return;
    const { data, error } = await sb.from("beers").delete().eq("id", beer.id).select("id");
    if (error) return toast("Verwijderen lukte niet: " + error.message);
    if (!data?.length) return toast("Dit bier kan niet worden verwijderd, omdat er al op is ingecheckt.");
    toast("Bier verwijderd"); location.hash = "database";
  };

  form.onsubmit = async e => {
    e.preventDefault();
    const then = e.submitter?.dataset.then || "db";
    const err = $("#beerFormErr");
    const buttons = form.querySelectorAll("button[type=submit]");
    const fail = m => { err.textContent = m; err.hidden = false; buttons.forEach(b => b.disabled = false); };
    err.hidden = true; buttons.forEach(b => b.disabled = true);
    const fields = readBeerFields(new FormData(form));
    if (!fields.name) return fail("Vul de naam van het bier in.");
    if (fields.barcode && !validBarcode(fields.barcode)) return fail("Deze barcode klopt niet. Controleer de cijfers, of laat het veld leeg.");
    try {
      if (photoFile) fields.image_path = await uploadPhoto(photoFile);
      else if (lookedUpImage) fields.image_path = lookedUpImage;
      const { data, error } = isNew
        ? await sb.from("beers").insert({ ...fields, source }).select().single()
        : await sb.from("beers").update(fields).eq("id", beer.id).select().single();
      if (error) return fail(error.code === "23505" ? "Deze barcode hoort al bij een ander bier in de database." : "Opslaan lukte niet: " + error.message);
      toast(isNew ? `${data.name} toegevoegd aan de database` : "Wijzigingen opgeslagen");
      if (then === "checkin") { state.draft = { beer: data }; location.hash = "inchecken"; }
      else location.hash = "database";
    } catch (ex) {
      fail("Opslaan lukte niet: " + (ex.message || ex));
    }
  };
}

// Activiteit: alle check-ins met reacties
// ---------------------------------------------------------------------
const FEED_PAGE = 20;
const feedState = { items: [], done: false, ids: [] };

function relTime(iso) {
  const rtf = new Intl.RelativeTimeFormat("nl", { numeric: "auto" });
  const sec = (new Date(iso) - Date.now()) / 1000;
  const units = [["year", 31536000], ["month", 2592000], ["week", 604800], ["day", 86400], ["hour", 3600], ["minute", 60]];
  for (const [u, n] of units) if (Math.abs(sec) >= n) return rtf.format(Math.round(sec / n), u);
  return "zojuist";
}

async function fetchFeed(from) {
  const { data, error } = await sb
    .from("checkins")
    .select("*, beer:beers(*), profile:profiles(id, display_name, avatar_path), comments(id, body, created_at, user_id, profile:profiles(id, display_name, avatar_path)), cheers(user_id, profile:profiles(id, display_name))")
    .in("user_id", feedState.ids)
    .order("created_at", { ascending: false })
    .order("created_at", { referencedTable: "comments", ascending: true })
    .range(from, from + FEED_PAGE - 1);
  if (error) throw error;
  return data;
}

function postHtml(c) {
  const mine = c.user_id === state.user.id;
  const b = c.beer || {};
  const canDel = cm => cm.user_id === state.user.id || mine || state.me?.is_admin;
  return `
    <article class="post" data-post="${c.id}">
      <div class="post-head">
        ${avatarHtml(c.profile, 44)}
        <div>
          <p class="post-title"><b>${esc(c.profile?.display_name || "Iemand")}</b> dronk <a href="#" class="beername" data-open="${c.id}">${esc(b.name || "een bier")}</a></p>
          <p class="post-meta">${esc([b.brewery, b.style].filter(Boolean).join(", "))}</p>
          <p class="post-meta">${relTime(c.drunk_at)}${c.location_name ? `, ${esc(c.location_name)}` : ""}${c.serving ? `, ${esc(c.serving)}` : ""}</p>
        </div>
      </div>
      ${c.rating != null ? `<div class="post-rating">${stars(c.rating)}<b>${nf(c.rating, 2)}</b></div>` : ""}
      ${c.notes ? `<p class="post-notes">${esc(c.notes)}</p>` : ""}
      ${c.photo_path ? `<div class="post-photo"><img src="${esc(photoUrl(c.photo_path))}" alt="Foto van ${esc(b.name || "het bier")}" loading="lazy"></div>` : ""}
      ${cheerHtml(c, mine)}
      <div class="comments">
        ${(c.comments || []).map(cm => `
          <div class="comment">
            ${avatarHtml(cm.profile)}
            <div class="comment-body">
              <b>${esc(cm.profile?.display_name || "Iemand")}</b> <span class="post-meta">${relTime(cm.created_at)}</span>
              <p>${esc(cm.body)}</p>
            </div>
            ${canDel(cm) ? `<button class="comment-del" type="button" data-delcomment="${cm.id}" aria-label="Reactie verwijderen">Verwijderen</button>` : ""}
          </div>`).join("")}
        <form class="comment-form" data-commentform="${c.id}">
          <textarea class="input" name="body" data-limit="50" placeholder="Reageer…" aria-label="Reactie" rows="1"></textarea>
          <button class="btn small" type="submit">Plaatsen</button>
          <span class="char-count">0 / 50</span>
          <div class="emoji-row">${["🍺", "🍻", "👍", "😋", "🔥", "😍", "👌", "🤢"].map(em => `<button type="button" data-emoji="${em}" aria-label="${em} invoegen">${em}</button>`).join("")}</div>
        </form>
      </div>
    </article>`;
}

function cheerHtml(c, mine) {
  const list = c.cheers || [];
  const iCheered = list.some(x => x.user_id === state.user.id);
  const names = list
    .sort((a, b) => (b.user_id === state.user.id) - (a.user_id === state.user.id))
    .map(x => x.user_id === state.user.id ? "Jij" : (x.profile?.display_name || "Iemand"));
  let who = "";
  if (names.length === 1) who = names[0] === "Jij" ? "Jij proost mee" : `${names[0]} proost mee`;
  else if (names.length === 2) who = `${names[0]} en ${names[1]} proosten mee`;
  else if (names.length > 2) who = `${names[0]}, ${names[1]} en ${names.length - 2} ${names.length - 2 === 1 ? "ander" : "anderen"} proosten mee`;
  if (mine && !list.length) return "";
  return `
    <div class="post-actions">
      ${mine ? "" : `<button type="button" class="cheer-btn ${iCheered ? "on" : ""}" data-cheer="${c.id}" aria-pressed="${iCheered}">🍻 Proost</button>`}
      ${who ? `<span class="post-meta">${esc(who)}</span>` : ""}
    </div>`;
}

function rerenderPost(id) {
  const c = feedState.items.find(x => x.id === id);
  const el = document.querySelector(`[data-post="${id}"]`);
  if (c && el) el.outerHTML = postHtml(c);
}

async function renderFeed() {
  setTab("activiteit");
  view().innerHTML = `<div class="loading">Activiteit ophalen…</div>`;
  try {
    feedState.ids = [state.user.id, ...(await friendIds())];
    feedState.items = await fetchFeed(0);
    feedState.done = feedState.items.length < FEED_PAGE;
  } catch (err) {
    view().innerHTML = `<p class="error">Activiteit kon niet worden geladen: ${esc(err.message)}</p>`;
    return;
  }
  view().innerHTML = `
    <div class="stack">
      <h1>Activiteit</h1>
      <p class="muted">Jij en ${feedState.ids.length - 1} ${feedState.ids.length - 1 === 1 ? "vriend" : "vrienden"}</p>
      ${feedState.items.length ? `<div class="feed" id="feed">${feedState.items.map(postHtml).join("")}</div>
        <button class="btn ghost block" id="moreBtn" type="button" ${feedState.done ? "hidden" : ""}>Meer laden</button>`
      : `<div class="panel empty">${glassSvg("var(--line)")}<h2>Nog geen activiteit</h2><p class="muted">Hier zie je je eigen check-ins en die van je vrienden.</p><p style="margin-top:16px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap"><a class="btn" href="#inchecken">Bier inchecken</a><a class="btn ghost" href="#vrienden">Vrienden zoeken</a></p></div>`}
    </div>`;

  const more = $("#moreBtn");
  if (more) more.onclick = async () => {
    more.disabled = true;
    try {
      const next = await fetchFeed(feedState.items.length);
      feedState.items.push(...next);
      feedState.done = next.length < FEED_PAGE;
      $("#feed").insertAdjacentHTML("beforeend", next.map(postHtml).join(""));
    } catch (err) { toast("Laden lukte niet: " + err.message); }
    more.disabled = false;
    more.hidden = feedState.done;
  };

  // Emoji-knop: textarea houdt de focus, emoji komt op de cursorpositie
  view().onpointerdown = e => { if (e.target.closest("[data-emoji]")) e.preventDefault(); };

  view().onsubmit = async e => {
    const form = e.target.closest("[data-commentform]");
    if (!form) return;
    e.preventDefault();
    const body = clampChars(form.body.value.trim(), 50);
    if (!body) return;
    const btn = form.querySelector("button");
    btn.disabled = true;
    const { data, error } = await sb
      .from("comments")
      .insert({ checkin_id: form.dataset.commentform, body })
      .select("id, body, created_at, user_id, profile:profiles(id, display_name, avatar_path)")
      .single();
    if (error) { btn.disabled = false; return toast("Plaatsen lukte niet: " + error.message); }
    const c = feedState.items.find(x => x.id === form.dataset.commentform);
    (c.comments ||= []).push(data);
    rerenderPost(c.id);
  };

  view().onclick = async e => {
    const em = e.target.closest("[data-emoji]");
    if (em) {
      const ta = em.closest("form").body;
      const start = ta.selectionStart ?? ta.value.length, end = ta.selectionEnd ?? ta.value.length;
      const next = ta.value.slice(0, start) + em.dataset.emoji + ta.value.slice(end);
      if (charCount(next) > 50) return toast("Maximaal 50 tekens.");
      ta.value = next;
      const pos = start + em.dataset.emoji.length;
      ta.focus(); ta.setSelectionRange(pos, pos);
      ta.dispatchEvent(new Event("input", { bubbles: true }));
      return;
    }
    const ch = e.target.closest("[data-cheer]");
    if (ch) {
      const c = feedState.items.find(x => x.id === ch.dataset.cheer);
      const on = (c.cheers || []).some(x => x.user_id === state.user.id);
      ch.disabled = true;
      const { error } = on
        ? await sb.from("cheers").delete().eq("checkin_id", c.id).eq("user_id", state.user.id)
        : await sb.from("cheers").insert({ checkin_id: c.id });
      if (error) { ch.disabled = false; return toast("Proosten lukte niet: " + error.message); }
      c.cheers = on
        ? c.cheers.filter(x => x.user_id !== state.user.id)
        : [...(c.cheers || []), { user_id: state.user.id, profile: { display_name: state.me?.display_name } }];
      rerenderPost(c.id);
      if (!on) document.querySelector(`[data-cheer="${c.id}"]`)?.classList.add("pop");
      return;
    }
    const open = e.target.closest("[data-open]");
    if (open) {
      e.preventDefault();
      const c = feedState.items.find(x => x.id === open.dataset.open);
      if (c?.beer) showBeer({ beer: c.beer, checkins: [c], avg: c.rating, photo: c.photo_path || c.beer.image_path }, { own: c.user_id === state.user.id });
      return;
    }
    const del = e.target.closest("[data-delcomment]");
    if (del) {
      if (!confirm("Deze reactie verwijderen?")) return;
      const { error } = await sb.from("comments").delete().eq("id", del.dataset.delcomment);
      if (error) return toast("Verwijderen lukte niet: " + error.message);
      const post = feedState.items.find(x => (x.comments || []).some(cm => cm.id === del.dataset.delcomment));
      post.comments = post.comments.filter(cm => cm.id !== del.dataset.delcomment);
      rerenderPost(post.id);
    }
  };
}

const initial = n => esc((n || "?").trim()[0]?.toUpperCase() || "?");

async function fetchFriendships() {
  const { data, error } = await sb
    .from("friendships")
    .select("*, req:profiles!friendships_requester_fkey(id, display_name, avatar_path), adr:profiles!friendships_addressee_fkey(id, display_name, avatar_path)");
  if (error) throw error;
  return data || [];
}
async function friendIds() {
  try {
    const rows = await fetchFriendships();
    return rows.filter(r => r.status === "accepted").map(r => r.requester === state.user.id ? r.addressee : r.requester);
  } catch { return []; }
}

async function renderFriends() {
  setTab("vrienden");
  view().innerHTML = `<div class="loading">Vrienden ophalen…</div>`;
  let rows, people, counts;
  try {
    const [fr, { data: ppl }, { data: cks }] = await Promise.all([
      fetchFriendships(),
      sb.from("profiles").select("id, display_name, avatar_path").neq("id", state.user.id).order("display_name"),
      sb.from("checkins").select("user_id, beer_id"),
    ]);
    rows = fr; people = ppl || [];
    counts = {};
    for (const r of cks || []) (counts[r.user_id] ||= new Set()).add(r.beer_id);
  } catch (err) {
    view().innerHTML = `<p class="error">Vrienden konden niet worden geladen: ${esc(err.message)}</p>`;
    return;
  }
  const me = state.user.id;
  const relation = {};
  for (const r of rows) {
    const other = r.requester === me ? r.addressee : r.requester;
    relation[other] = r.status === "accepted" ? "friend" : (r.requester === me ? "sent" : "received");
  }
  const byRel = rel => people.filter(p => relation[p.id] === rel);
  const friends = byRel("friend"), received = byRel("received"), sent = byRel("sent");
  const others = people.filter(p => !relation[p.id]);
  const uniq = id => `${counts[id]?.size || 0} unieke bieren`;

  const row = (p, actions, link) => `
    <div class="person">
      ${link ? `<a href="#u/${p.id}" class="person-link">` : `<span class="person-link">`}
        ${avatarHtml(p)}
        <span class="grow"><b>${esc(p.display_name || "Naamloos")}</b><br><span class="muted small">${uniq(p.id)}</span></span>
      ${link ? `</a>` : `</span>`}
      <span class="person-actions">${actions}</span>
    </div>`;

  view().innerHTML = `
    <div class="stack">
      <h1>Vrienden</h1>

      ${received.length ? `
        <section class="stack">
          <h2>Vriendschapsverzoeken</h2>
          <div class="people">${received.map(p => row(p, `
            <button class="btn small" data-accept="${p.id}">Accepteren</button>
            <button class="btn ghost small" data-remove="${p.id}" data-confirm="Verzoek van ${esc(p.display_name)} afwijzen?">Afwijzen</button>`)).join("")}</div>
        </section>` : ""}

      <section class="stack">
        <h2>Je vrienden</h2>
        ${friends.length
          ? `<div class="people">${friends.map(p => row(p, `<button class="btn ghost small" data-remove="${p.id}" data-confirm="${esc(p.display_name)} verwijderen als vriend?">Verwijderen</button>`, true)).join("")}</div>`
          : `<p class="muted">Je hebt nog geen vrienden. Stuur hieronder een verzoek aan een ander lid. In Activiteit zie je alleen je eigen check-ins en die van je vrienden.</p>`}
      </section>

      ${sent.length ? `
        <section class="stack">
          <h2>Verstuurde verzoeken</h2>
          <div class="people">${sent.map(p => row(p, `<button class="btn ghost small" data-remove="${p.id}">Intrekken</button>`)).join("")}</div>
        </section>` : ""}

      <section class="stack">
        <h2>Andere leden</h2>
        ${others.length ? `
          <input class="input" type="search" id="memberFilter" placeholder="Zoek een lid op naam" aria-label="Lid zoeken">
          <div class="people" id="memberList">${others.map(p => `<div data-name="${esc((p.display_name || "").toLowerCase())}">${row(p, `<button class="btn soft small" data-request="${p.id}">Vriend toevoegen</button>`)}</div>`).join("")}</div>`
        : `<p class="muted">Er zijn geen andere leden die je nog kunt toevoegen.</p>`}
      </section>
    </div>`;

  const filter = $("#memberFilter");
  if (filter) filter.oninput = () => {
    const q = filter.value.trim().toLowerCase();
    document.querySelectorAll("#memberList > [data-name]").forEach(el => el.hidden = q && !el.dataset.name.includes(q));
  };

  view().onclick = async e => {
    const btn = e.target.closest("[data-request], [data-accept], [data-remove]");
    if (!btn) return;
    if (btn.dataset.confirm && !confirm(btn.dataset.confirm)) return;
    btn.disabled = true;
    let error;
    if (btn.dataset.request) {
      ({ error } = await sb.from("friendships").insert({ addressee: btn.dataset.request }));
      if (error?.code === "23505") error = { message: "Er loopt al een verzoek tussen jullie. Ververs de pagina." };
      if (!error) toast("Vriendschapsverzoek verstuurd");
    } else if (btn.dataset.accept) {
      ({ error } = await sb.from("friendships").update({ status: "accepted", accepted_at: new Date().toISOString() })
        .eq("requester", btn.dataset.accept).eq("addressee", me));
      if (!error) toast("Jullie zijn nu vrienden. Proost!");
    } else {
      const other = btn.dataset.remove;
      ({ error } = await sb.from("friendships").delete()
        .or(`and(requester.eq.${me},addressee.eq.${other}),and(requester.eq.${other},addressee.eq.${me})`));
      if (!error) toast("Bijgewerkt");
    }
    if (error) { btn.disabled = false; return toast("Dat lukte niet: " + error.message); }
    renderFriends();
  };
}

function tempPassword() {
  const chars = "abcdefghjkmnpqrstuvwxyzABCDEFGHJKMNPQRSTUVWXYZ23456789";
  const arr = crypto.getRandomValues(new Uint32Array(10));
  return [...arr].map(n => chars[n % chars.length]).join("");
}

function passwordForm(forced) {
  return `
    <form class="panel stack" id="pwForm">
      <h2>${forced ? "Kies een nieuw wachtwoord" : "Wachtwoord wijzigen"}</h2>
      ${forced ? `<p class="muted">Je bent ingelogd met een tijdelijk wachtwoord. Kies een eigen wachtwoord om verder te gaan.</p>` : ""}
      ${forced ? "" : `<label class="field"><span>Huidig wachtwoord</span><input class="input" type="password" name="current" autocomplete="current-password" required></label>`}
      <label class="field"><span>Nieuw wachtwoord</span><input class="input" type="password" name="pw1" minlength="8" autocomplete="new-password" required></label>
      <label class="field"><span>Nieuw wachtwoord herhalen</span><input class="input" type="password" name="pw2" minlength="8" autocomplete="new-password" required></label>
      <p class="error" id="pwErr" hidden></p>
      <button class="btn" type="submit">Wachtwoord opslaan</button>
    </form>`;
}
function bindPasswordForm(forced) {
  $("#pwForm").onsubmit = async e => {
    e.preventDefault();
    const f = new FormData(e.target);
    const err = $("#pwErr");
    const btn = e.target.querySelector("button[type=submit]");
    const fail = m => { err.textContent = m; err.hidden = false; btn.disabled = false; };
    err.hidden = true; btn.disabled = true;
    const pw1 = String(f.get("pw1")), pw2 = String(f.get("pw2"));
    if (pw1.length < 8) return fail("Het nieuwe wachtwoord moet minstens 8 tekens hebben.");
    if (pw1 !== pw2) return fail("De twee nieuwe wachtwoorden zijn niet gelijk.");
    if (!forced) {
      const { error } = await sb.auth.signInWithPassword({ email: state.user.email, password: String(f.get("current")) });
      if (error) return fail("Je huidige wachtwoord klopt niet.");
    }
    const { error } = await sb.auth.updateUser({ password: pw1 });
    if (error) return fail(/different|same/i.test(error.message) ? "Kies een ander wachtwoord dan je huidige." : "Opslaan lukte niet: " + error.message);
    await sb.from("profiles").update({ must_change_password: false }).eq("id", state.user.id);
    if (state.me) state.me.must_change_password = false;
    toast("Wachtwoord gewijzigd");
    if (forced) { location.hash = "lijst"; route(); } else e.target.reset(), (btn.disabled = false);
  };
}
function renderForcedPassword() {
  setTab(null);
  setNav(false);
  view().innerHTML = `<div class="auth stack">${passwordForm(true)}<button class="btn ghost" id="logoutBtn2" type="button">Uitloggen</button></div>`;
  bindPasswordForm(true);
  $("#logoutBtn2").onclick = () => sb.auth.signOut();
}

  };
  bindPasswordForm(false);

  const oldAvatar = p.avatar_path;
  const removeOld = async () => {
    if (oldAvatar && oldAvatar.startsWith(state.user.id + "/")) await sb.storage.from("photos").remove([oldAvatar]);
  };
  $("#avatarInput").onchange = async e => {
    const file = e.target.files[0];
    if (!file) return;
    toast("Foto uploaden…");
    try {
      const blob = await compressAvatar(file);
      const path = `${state.user.id}/avatar-${crypto.randomUUID()}.jpg`;
      const { error: upErr } = await sb.storage.from("photos").upload(path, blob, { contentType: "image/jpeg" });
      if (upErr) throw upErr;
      const { data, error } = await sb.from("profiles").update({ avatar_path: path }).eq("id", state.user.id).select().single();
      if (error) throw error;
      await removeOld();
      state.me = data; toast("Profielfoto opgeslagen"); renderProfile();
    } catch (ex) { toast("Uploaden lukte niet: " + (ex.message || ex)); }
  };
  const rmBtn = $("#avatarRemove");
  if (rmBtn) rmBtn.onclick = async () => {
    const { data, error } = await sb.from("profiles").update({ avatar_path: null }).eq("id", state.user.id).select().single();
    if (error) return toast("Verwijderen lukte niet: " + error.message);
    await removeOld();
    state.me = data; toast("Profielfoto verwijderd"); renderProfile();
  };

  $("#csvBtn").onclick = () => exportData("csv");
  $("#jsonBtn").onclick = () => exportData("json");
  $("#logoutBtn").onclick = async () => { await sb.auth.signOut(); };
}

async function exportData(kind) {
  const rows = await fetchCheckins(state.user.id);
  const flat = rows.map(c => ({
    datum: c.drunk_at,
    bier: c.beer?.name,
    brouwerij: c.beer?.brewery,
    stijl: c.beer?.style,
    alcohol: c.beer?.abv,
    ibu: c.beer?.ibu,
    land: c.beer?.country,
    barcode: c.beer?.barcode,
    score: c.rating,
    gedronken_uit: c.serving,
    locatie: c.location_name,
    breedtegraad: c.latitude,
    lengtegraad: c.longitude,
    notities: c.notes,
    foto: photoUrl(c.photo_path),
  }));
  let blob, name;
  const stamp = new Date().toISOString().slice(0, 10);
  if (kind === "json") {
    blob = new Blob([JSON.stringify(flat, null, 2)], { type: "application/json" });
    name = `bierlijst-${stamp}.json`;
  } else {
    const cols = Object.keys(flat[0] || { datum: "" });
    const cell = v => {
      if (v == null) return "";
      const s = typeof v === "number" ? String(v).replace(".", ",") : String(v);
      return /[;"\n\r]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
    };
    const csv = [cols.join(";"), ...flat.map(r => cols.map(c => cell(r[c])).join(";"))].join("\r\n");
    blob = new Blob(["\ufeff" + csv], { type: "text/csv;charset=utf-8" });
    name = `bierlijst-${stamp}.csv`;
  }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

// ---------------------------------------------------------------------
// Navigatie
// ---------------------------------------------------------------------
const params = new URLSearchParams(location.search);
const publicUser = params.get("u");

async function route() {
  if ($("#dlg").open) closeDialog();
  view().onclick = null;
  view().onchange = null;
  view().onsubmit = null;
  view().onpointerdown = null;
  if (location.hash !== "#inchecken") stopScanner();
  if (publicUser && (!location.hash || location.hash === "#")) return renderPublic(publicUser);
  if (!state.user) return renderAuth();
  if (state.me?.must_change_password) return renderForcedPassword();
  setNav(true);
  const h = location.hash.slice(1) || "lijst";
  if (h === "inchecken") return renderCheckin();
  if (h === "vrienden") return renderFriends();
  if (h === "activiteit") return renderFeed();
  if (h === "badges") return renderBadges();
  if (h === "database") return renderDatabase();
  if (h === "database/nieuw") return renderBeerForm(null);
  if (h.startsWith("database/bewerk/")) return renderBeerForm(h.slice(16));
  if (h.startsWith("badges/")) return renderBadges(h.slice(7));
  if (h === "profiel") return renderProfile();
  if (h === "beheer") return renderAdmin();
  if (h.startsWith("u/")) return renderUser(h.slice(2));
  return renderMine();
}
window.addEventListener("hashchange", route);

(async function init() {
  const { data } = await sb.auth.getSession();
  state.user = data.session?.user || null;
  if (state.user) await loadMe();
  route();
  sb.auth.onAuthStateChange(async (event, session) => {
    const before = state.user?.id;
    state.user = session?.user || null;
    if (state.user && state.user.id !== before) { await loadMe(); route(); }
    if (!state.user && before) { state.me = null; location.hash = ""; route(); }
  });
})();
</script>

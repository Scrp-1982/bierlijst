<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F3F5EF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1A1D18" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bierlijst">
<title>Bierlijst</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍺</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
:root {
  --paper: #F3F5EF;
  --surface: #FFFFFF;
  --ink: #1E241C;
  --muted: #646C5F;
  --line: #D8DDD1;
  --hop: #4A6A2A;
  --hop-ink: #FFFFFF;
  --hop-soft: #E3EBD6;
  --danger: #A3322A;
  --gold: #D9A21B;
  --radius-lg: 18px;
  --radius: 10px;
  --display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body: "Source Sans 3", "Segoe UI", system-ui, -apple-system, sans-serif;
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
}
@media (prefers-color-scheme: dark) {
  :root {
    --paper: #1A1D18;
    --surface: #242922;
    --ink: #EEF1E9;
    --muted: #A2AA9C;
    --line: #3A4136;
    --hop: #9CC167;
    --hop-ink: #172010;
    --hop-soft: #2F3B25;
    --danger: #F08A80;
    --gold: #F0BE45;
    color-scheme: dark;
  }
}
*, *::before, *::after { box-sizing: inherit; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font: 400 17px/1.5 var(--body);
  -webkit-font-smoothing: antialiased;
  padding-bottom: calc(84px + env(safe-area-inset-bottom, 0px));
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  background: var(--paper); z-index: 30;
}
h1, h2, h3 { font-family: var(--display); line-height: 1.1; margin: 0; }
h1 { font-size: clamp(2rem, 7vw, 2.8rem); font-weight: 800; letter-spacing: -0.02em; }
h2 { font-size: 1.5rem; font-weight: 700; letter-spacing: -0.01em; }
h3 { font-size: 1.12rem; font-weight: 700; }
p { margin: 0; }
a { color: var(--hop); }
img { max-width: 100%; display: block; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }

.wrap { max-width: 760px; margin: 0 auto; padding: 0 18px; }

/* Topbalk */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  background: var(--paper);
  border-bottom: 1px solid var(--line);
}
.top .wrap { display: flex; align-items: center; justify-content: space-between; height: 58px; }
.brand { font: 800 1.3rem var(--display); letter-spacing: -0.02em; text-decoration: none; color: var(--ink); display: flex; align-items: center; gap: 9px; }
.brand svg { width: 22px; height: 26px; }

/* Onderbalk */
.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  background: var(--surface); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
.tabs .wrap { display: grid; grid-template-columns: repeat(4, 1fr); height: 66px; padding: 0 6px; }
.tabs a {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  text-decoration: none; color: var(--muted); font-size: 0.78rem; font-weight: 600;
}
.tabs a svg { width: 24px; height: 24px; }
.tabs a[aria-current="page"] { color: var(--hop); }
.tabs a.checkin span.icon {
  background: var(--hop); color: var(--hop-ink); border-radius: 50%;
  width: 40px; height: 40px; display: grid; place-items: center; margin-top: -6px;
}
.tabs a.checkin svg { width: 22px; height: 22px; }

main { padding: 26px 0 40px; }
.stack > * + * { margin-top: 16px; }
.muted { color: var(--muted); }
.small { font-size: 0.9rem; }

/* Knoppen en velden */
.btn {
  appearance: none; border: 0; cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 46px; padding: 0 20px; border-radius: 999px;
  background: var(--hop); color: var(--hop-ink); font-weight: 700;
  text-decoration: none;
}
.btn:disabled { opacity: 0.55; cursor: progress; }
.btn.ghost { background: transparent; color: var(--ink); border: 1.5px solid var(--line); }
.btn.soft { background: var(--hop-soft); color: var(--ink); }
.btn.danger { background: transparent; color: var(--danger); border: 1.5px solid currentColor; }
.btn.small { min-height: 36px; padding: 0 14px; font-size: 0.92rem; }
.btn.block { width: 100%; }
.btn svg { width: 20px; height: 20px; }

label.field { display: block; }
label.field > span { display: block; font-weight: 600; font-size: 0.92rem; margin-bottom: 5px; }
.input, select.input, textarea.input {
  width: 100%; min-height: 46px; padding: 10px 13px;
  border: 1.5px solid var(--line); border-radius: var(--radius);
  background: var(--surface);
}
textarea.input { min-height: 92px; resize: vertical; }
.input:focus { outline: none; border-color: var(--hop); }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
@media (max-width: 480px) { .grid3 { grid-template-columns: 1fr 1fr; } }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg); padding: 20px; }

/* Collectie-kop met bierspectrum */
.collection-head { display: flex; align-items: end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.spectrum {
  display: flex; height: 54px; border-radius: 12px; overflow: hidden;
  border: 1px solid var(--line); background: var(--surface);
}
.spectrum span { flex: 1 1 0; min-width: 2px; }
.spectrum-legend { display: flex; justify-content: space-between; font-size: 0.82rem; color: var(--muted); margin-top: 6px; }
.stats { display: flex; gap: 26px; flex-wrap: wrap; }
.stats div b { display: block; font: 800 1.6rem/1 var(--display); }
.stats div span { font-size: 0.88rem; color: var(--muted); }

.filters { display: grid; grid-template-columns: 1fr auto auto; gap: 10px; }
@media (max-width: 560px) { .filters { grid-template-columns: 1fr 1fr; } .filters .search { grid-column: 1 / -1; } }

/* Bierkaarten */
.beers { display: grid; gap: 12px; }
.beer {
  display: grid; grid-template-columns: 88px 1fr; gap: 14px; align-items: stretch;
  width: 100%; text-align: left; cursor: pointer;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg);
  padding: 10px; color: inherit;
}
.beer:hover { border-color: var(--muted); }
.beer-photo {
  position: relative; border-radius: 12px; overflow: hidden; aspect-ratio: 1;
  background: var(--paper);
}
.beer-photo img { width: 100%; height: 100%; object-fit: cover; }
.beer-photo::after {
  content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 9px; background: var(--srm);
}
.glass { width: 100%; height: 100%; display: grid; place-items: center; }
.glass svg { width: 44%; height: auto; }
.beer-body { min-width: 0; display: flex; flex-direction: column; justify-content: center; gap: 2px; padding-right: 4px; }
.beer-body h3 { overflow-wrap: anywhere; }
.beer-meta { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 0.9rem; color: var(--muted); }
.beer-foot { display: flex; align-items: center; gap: 10px; margin-top: 4px; font-size: 0.9rem; }
.count { color: var(--muted); }

.stars {
  --pct: calc(var(--r, 0) / 5 * 100%);
  display: inline-block; font-size: 1.05rem; letter-spacing: 2px; line-height: 1;
  background: linear-gradient(90deg, var(--gold) var(--pct), var(--line) var(--pct));
  -webkit-background-clip: text; background-clip: text; color: transparent;
}

.empty { text-align: center; padding: 40px 16px; }
.empty svg { width: 64px; margin: 0 auto 14px; }

/* Inchecken */
.chosen { display: grid; grid-template-columns: 60px 1fr auto; gap: 12px; align-items: center; }
.chosen .beer-photo { width: 60px; }
.results { display: grid; gap: 6px; margin-top: 8px; }
.result {
  display: flex; justify-content: space-between; gap: 10px; align-items: center;
  padding: 10px 12px; border-radius: var(--radius); border: 1px solid var(--line);
  background: var(--surface); cursor: pointer; text-align: left; width: 100%;
}
.result:hover { border-color: var(--hop); }
.or { display: flex; align-items: center; gap: 12px; color: var(--muted); font-size: 0.9rem; }
.or::before, .or::after { content: ""; flex: 1; height: 1px; background: var(--line); }
#reader { border-radius: var(--radius-lg); overflow: hidden; background: #000; }
#reader video { width: 100% !important; }
.rating-row { display: flex; align-items: center; gap: 14px; }
.rating-row input[type=range] { flex: 1; accent-color: var(--gold); height: 32px; }
.rating-row output { font: 800 1.4rem var(--display); min-width: 3.2ch; text-align: right; }
.segmented { display: flex; flex-wrap: wrap; gap: 8px; }
.segmented label { cursor: pointer; }
.segmented input { position: absolute; opacity: 0; pointer-events: none; }
.segmented span {
  display: inline-block; padding: 8px 15px; border-radius: 999px;
  border: 1.5px solid var(--line); font-weight: 600; font-size: 0.95rem;
}
.segmented input:checked + span { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.segmented input:focus-visible + span { outline: 3px solid var(--gold); outline-offset: 2px; }
.photo-pick { display: flex; gap: 12px; align-items: center; }
.photo-pick img { width: 84px; height: 84px; object-fit: cover; border-radius: 12px; }

/* Dialoog */
dialog {
  border: 0; padding: 0; width: min(640px, 100vw); max-height: 92vh;
  border-radius: var(--radius-lg); background: var(--paper); color: var(--ink);
}
dialog::backdrop { background: rgba(20, 24, 18, 0.55); }
@media (max-width: 640px) {
  dialog { margin: auto 0 0; max-height: 94vh; border-radius: var(--radius-lg) var(--radius-lg) 0 0; }
}
.dlg-head { position: sticky; top: 0; z-index: 2; display: flex; justify-content: flex-end; padding: 10px; background: linear-gradient(var(--paper) 60%, transparent); }
.dlg-body { padding: 0 20px 28px; }
.hero-photo { border-radius: var(--radius-lg); overflow: hidden; aspect-ratio: 4 / 3; background: var(--surface); position: relative; }
.hero-photo img { width: 100%; height: 100%; object-fit: cover; }
.hero-photo .glass svg { width: 22%; }
.facts { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px 16px; }
.facts dt { font-size: 0.84rem; color: var(--muted); }
.facts dd { margin: 0; font-weight: 600; overflow-wrap: anywhere; }
.checkin-item { display: grid; grid-template-columns: 1fr auto; gap: 10px; padding: 14px 0; border-top: 1px solid var(--line); }
.checkin-item img { width: 72px; height: 72px; object-fit: cover; border-radius: 10px; }
.who { font-weight: 700; }

/* Vrienden */
.people { display: grid; gap: 8px; }
.person {
  display: flex; align-items: center; gap: 14px; padding: 12px 14px; text-decoration: none; color: inherit;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg);
}
.person:hover { border-color: var(--muted); }
.avatar {
  width: 44px; height: 44px; border-radius: 50%; flex: none;
  display: grid; place-items: center; font: 800 1.1rem var(--display);
  background: var(--hop-soft); color: var(--ink);
}
.person .grow { flex: 1; min-width: 0; }

.user-row { display: grid; grid-template-columns: 1fr auto; gap: 12px 16px; align-items: center; padding: 16px 0; border-top: 1px solid var(--line); }
.user-row:first-of-type { border-top: 0; }
.user-info { display: flex; gap: 12px; align-items: flex-start; min-width: 0; }
.user-info > div { min-width: 0; overflow-wrap: anywhere; }
.admin-switch { gap: 8px; font-weight: 600; font-size: .92rem; }
.switch.admin-switch input { width: 22px; height: 22px; }
.user-actions { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 8px; }
.switch { display: flex; align-items: center; justify-content: space-between; gap: 14px; cursor: pointer; }
.switch input { width: 48px; height: 28px; accent-color: var(--hop); flex: none; }

.toast {
  position: fixed; left: 50%; bottom: calc(92px + env(safe-area-inset-bottom, 0px)); z-index: 50;
  transform: translateX(-50%); max-width: calc(100vw - 32px);
  background: var(--ink); color: var(--paper); padding: 12px 18px; border-radius: 12px;
  font-weight: 600; box-shadow: 0 8px 24px rgba(0,0,0,.2);
}
.toast[hidden] { display: none; }

.auth { max-width: 420px; margin: 4vh auto 0; }
.auth-tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; background: var(--hop-soft); padding: 5px; border-radius: 999px; }
.auth-tabs button { border: 0; background: transparent; border-radius: 999px; min-height: 40px; font-weight: 700; cursor: pointer; }
.auth-tabs button[aria-selected="true"] { background: var(--surface); }
.error { color: var(--danger); font-weight: 600; }
.loading { padding: 60px 0; text-align: center; color: var(--muted); }

@media (prefers-reduced-motion: no-preference) {
  dialog[open] { animation: rise .22s ease-out; }
  @keyframes rise { from { transform: translateY(24px); opacity: 0; } }
}
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <a class="brand" href="#lijst" id="brand">
      <svg viewBox="0 0 22 26" aria-hidden="true"><path d="M2 3h18l-2 21H4z" fill="var(--gold)"/><path d="M2 3h18l-.5 5H2.5z" fill="var(--surface)" stroke="var(--ink)" stroke-width="1.5"/><path d="M2 3h18l-2 21H4z" fill="none" stroke="var(--ink)" stroke-width="1.5" stroke-linejoin="round"/></svg>
      Bierlijst
    </a>
    <div id="topRight"></div>
  </div>
</header>

<main><div class="wrap" id="view"><div class="loading">Laden…</div></div></main>

<nav class="tabs" id="tabs" hidden>
  <div class="wrap">
    <a href="#lijst" data-tab="lijst">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4h12l-1.5 17h-9z"/><path d="M6.4 9h11.2"/></svg>
      Mijn bieren
    </a>
    <a href="#inchecken" data-tab="inchecken" class="checkin">
      <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></span>

    </a>
    <a href="#vrienden" data-tab="vrienden">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5"/><circle cx="17" cy="9" r="2.5"/><path d="M16.5 14.6c2.6.2 4.4 1.9 5 4.4"/></svg>

    <a href="#profiel" data-tab="profiel">

<dialog id="dlg">

<script>
// ---------------------------------------------------------------------
// Instellingen
// ---------------------------------------------------------------------
const SUPABASE_URL = "https://pudgqufehuzfxqjbceys.supabase.co";
const SUPABASE_KEY = "sb_publishable_qZjWLWwVW_vyTIwFtawzCg_ohgpKmOv";

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const SITE_URL = location.origin + location.pathname;

const state = {
  user: null,
  me: null,
  draft: null,      // bier dat wordt ingecheckt
  scanner: null,
};

// ---------------------------------------------------------------------
// Hulpfuncties
// ---------------------------------------------------------------------
const $ = (sel, root = document) => root.querySelector(sel);
const view = () => $("#view");

function esc(v) {
  return String(v ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
const nf = (n, d = 1) => Number(n).toLocaleString("nl-NL", { minimumFractionDigits: d, maximumFractionDigits: 2 });
const fmtDate = iso => new Date(iso).toLocaleDateString("nl-NL", { day: "numeric", month: "short", year: "numeric" });

let toastTimer;
function toast(msg) {
  const t = $("#toast");
  t.textContent = msg; t.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => (t.hidden = true), 3200);
}

function photoUrl(path) {
  if (!path) return null;
  if (/^https?:\/\//.test(path)) return path;
  return sb.storage.from("photos").getPublicUrl(path).data.publicUrl;
}

// Bierkleur op basis van de stijl (benadering van de SRM-kleurschaal)
const COLORS = [
  [/kriek|framboos|fruit|cherry|raspberry/, "#A23142", 5],
  [/stout|porter|zwart|black|schwarz/, "#2A1810", 9],
  [/quad|bock|dubbel|brown|bruin|dunkel|barley/, "#5C2D14", 8],
  [/amber|red|rood|scotch|alt|märzen|marzen|vienna/, "#8E3E16", 7],
  [/ipa|pale|apa|saison|tripel|strong|bitter/, "#C47A1C", 6],
  [/blond|golden|kölsch|kolsch|helles|lager|pils/, "#E2B13A", 3],
  [/wit|weizen|weiss|wheat|blanche|gose|berliner|sour|zuur|lambiek|geuze|gueuze/, "#EACF7C", 2],
];
function beerColor(style) {
  const s = (style || "").toLowerCase();
  for (const [re, hex, rank] of COLORS) if (re.test(s)) return { hex, rank };
  return { hex: "#B98A35", rank: 4 };
}

function glassSvg(hex) {
  return `<div class="glass" aria-hidden="true"><svg viewBox="0 0 40 52"><path d="M4 4h32l-4 44H8z" fill="${hex}"/><path d="M4 4h32l-.8 8H4.8z" fill="var(--surface)"/><path d="M4 4h32l-4 44H8z" fill="none" stroke="var(--ink)" stroke-width="2.4" stroke-linejoin="round"/></svg></div>`;
}
function photoBlock(path, style, cls = "beer-photo") {
  const c = beerColor(style);
  const url = photoUrl(path);
  return `<div class="${cls}" style="--srm:${c.hex}">${url ? `<img src="${esc(url)}" alt="" loading="lazy">` : glassSvg(c.hex)}</div>`;
}
function stars(r) {
  if (r == null) return `<span class="muted small">Geen score</span>`;
  return `<span class="stars" style="--r:${Number(r)}" aria-label="${nf(r, 2)} van 5">★★★★★</span>`;
}

function setTab(name) {
  document.querySelectorAll("#tabs a").forEach(a => {
    if (a.dataset.tab === name) a.setAttribute("aria-current", "page");
    else a.removeAttribute("aria-current");
  });
}

function openDialog(html) {
  $("#dlgBody").innerHTML = html;
  const d = $("#dlg");
  if (!d.open) d.showModal();
  $("#dlgBody").scrollTop = 0;
}
function closeDialog() { $("#dlg").close(); }
$("#dlgClose").addEventListener("click", closeDialog);
$("#dlg").addEventListener("click", e => { if (e.target.id === "dlg") closeDialog(); });

// Foto verkleinen tot max 1600px JPEG, zodat de gratis opslag lang meegaat
async function compressImage(file, max = 1600) {
  const bmp = await createImageBitmap(file, { imageOrientation: "from-image" });
  const scale = Math.min(1, max / Math.max(bmp.width, bmp.height));
  const canvas = document.createElement("canvas");
  canvas.width = Math.round(bmp.width * scale);
  canvas.height = Math.round(bmp.height * scale);
  canvas.getContext("2d").drawImage(bmp, 0, 0, canvas.width, canvas.height);
  return new Promise(res => canvas.toBlob(res, "image/jpeg", 0.82));
}
async function uploadPhoto(file) {
  const blob = await compressImage(file);
  const path = `${state.user.id}/${crypto.randomUUID()}.jpg`;
  const { error } = await sb.storage.from("photos").upload(path, blob, { contentType: "image/jpeg" });
  if (error) throw error;
  return path;
}

function groupBeers(checkins) {
  const map = new Map();
  for (const c of checkins) {
    if (!c.beer) continue;
    if (!map.has(c.beer_id)) map.set(c.beer_id, { beer: c.beer, checkins: [] });
    map.get(c.beer_id).checkins.push(c);
  }
  return [...map.values()].map(g => {
    g.checkins.sort((a, b) => b.drunk_at.localeCompare(a.drunk_at));
    const rs = g.checkins.map(c => c.rating).filter(r => r != null).map(Number);
    g.avg = rs.length ? rs.reduce((a, b) => a + b, 0) / rs.length : null;
    g.last = g.checkins[0].drunk_at;
    g.photo = (g.checkins.find(c => c.photo_path) || {}).photo_path || g.beer.image_path;
    return g;
  });
}

// ---------------------------------------------------------------------
// Inloggen en registreren
// ---------------------------------------------------------------------
function friendlyAuthError(err) {
  const m = (err && err.message) || "";
  if (/database error saving new user|niet uitgenodigd/i.test(m)) return "Dit e-mailadres is nog niet uitgenodigd. Vraag een vriend om je uit te nodigen.";
  if (/invalid login credentials/i.test(m)) return "E-mailadres of wachtwoord klopt niet.";
  if (/already registered|already been registered/i.test(m)) return "Er bestaat al een account met dit e-mailadres. Log in.";
  if (/email not confirmed/i.test(m)) return "Je e-mailadres is nog niet bevestigd.";
  if (/password/i.test(m)) return "Het wachtwoord moet minstens 8 tekens hebben.";
  return m || "Er ging iets mis. Probeer het opnieuw.";
}

function renderAuth(mode = "login") {
  setTab(null);
  $("#tabs").hidden = true;
  $("#topRight").innerHTML = "";
  view().innerHTML = `
    <div class="auth stack">
      <h1>Elk bier dat je drinkt, op één plek.</h1>
      <p class="muted">Houd je bieren bij en zie wat je vrienden drinken. Een account maken kan alleen met een uitnodiging.</p>
      <div class="auth-tabs" role="tablist">
        <button role="tab" aria-selected="${mode === "login"}" data-mode="login">Inloggen</button>
        <button role="tab" aria-selected="${mode === "signup"}" data-mode="signup">Account maken</button>
      </div>
      <form class="panel stack" id="authForm" novalidate>
        <label class="field"><span>E-mailadres</span><input class="input" type="email" name="email" autocomplete="email" required></label>
        <label class="field"><span>Wachtwoord</span><input class="input" type="password" name="password" minlength="8" autocomplete="${mode === "login" ? "current-password" : "new-password"}" required></label>
        ${mode === "signup" ? `<label class="field"><span>Je naam</span><input class="input" name="name" autocomplete="nickname" required></label>` : ""}
        <p class="error" id="authErr" hidden></p>
        <button class="btn block" type="submit">${mode === "login" ? "Inloggen" : "Account maken"}</button>
        ${mode === "login" ? `<p class="muted small">Wachtwoord vergeten? Vraag de beheerder om een tijdelijk wachtwoord.</p>` : ""}
      </form>
    </div>`;
  view().querySelectorAll("[data-mode]").forEach(b => b.onclick = () => renderAuth(b.dataset.mode));
  $("#authForm").onsubmit = async e => {
    e.preventDefault();
    const f = new FormData(e.target);
    const btn = e.target.querySelector("button[type=submit]");
    const errEl = $("#authErr");
    errEl.hidden = true; btn.disabled = true;
    const email = String(f.get("email")).trim().toLowerCase();
    const password = String(f.get("password"));
    try {
      if (mode === "login") {
        const { error } = await sb.auth.signInWithPassword({ email, password });
        if (error) throw error;
      } else {
        if (password.length < 8) throw new Error("password");
        const { data, error } = await sb.auth.signUp({ email, password, options: { emailRedirectTo: SITE_URL } });
        if (error) throw error;
        if (data.user && data.session) {
          await sb.from("profiles").update({ display_name: String(f.get("name")).trim() || email.split("@")[0] }).eq("id", data.user.id);
          await loadMe();
          route();
        } else {
          errEl.textContent = "Bijna klaar: bevestig je account via de link in je mail.";
          errEl.hidden = false;
        }
      }
    } catch (err) {
      errEl.textContent = friendlyAuthError(err);
      errEl.hidden = false;
    } finally {
      btn.disabled = false;
    }
  };
}

async function loadMe() {
  const { data } = await sb.from("profiles").select("*").eq("id", state.user.id).maybeSingle();
  state.me = data;
}

// ---------------------------------------------------------------------
// Collectie (eigen lijst, lijst van een vriend of openbare lijst)
// ---------------------------------------------------------------------
async function fetchCheckins(userId) {
  const { data, error } = await sb
    .from("checkins")
    .select("*, beer:beers(*)")
    .eq("user_id", userId)
    .order("drunk_at", { ascending: false });
  if (error) throw error;
  return data;
}

function renderCollection(groups, { title, intro, own, profile }) {
  const sorted = [...groups].sort((a, b) => beerColor(a.beer.style).rank - beerColor(b.beer.style).rank);
  const total = groups.reduce((n, g) => n + g.checkins.length, 0);
  const rated = groups.filter(g => g.avg != null);
  const avg = rated.length ? rated.reduce((s, g) => s + g.avg, 0) / rated.length : null;
  const styles = [...new Set(groups.map(g => g.beer.style).filter(Boolean))].sort((a, b) => a.localeCompare(b, "nl"));

  view().innerHTML = `
    <div class="stack">
      <div class="collection-head">
        <div>
          <h1>${esc(title)}</h1>
          ${intro ? `<p class="muted">${intro}</p>` : ""}
        </div>
        ${own && groups.length ? `<a class="btn" href="#inchecken">Bier inchecken</a>` : ""}
      </div>
      ${groups.length ? `
        <div>
          <div class="spectrum" role="img" aria-label="Kleuren van ${groups.length} bieren, van licht naar donker">
            ${sorted.map(g => `<span style="background:${beerColor(g.beer.style).hex}" title="${esc(g.beer.name)}"></span>`).join("")}
          </div>
          <div class="spectrum-legend"><span>Licht</span><span>Donker</span></div>
        </div>
        <div class="stats">
          <div><b>${groups.length}</b><span>unieke bieren</span></div>
          <div><b>${total}</b><span>keer ingecheckt</span></div>
          <div><b>${avg != null ? nf(avg, 2) : "–"}</b><span>gemiddelde score</span></div>
          <div><b>${styles.length}</b><span>bierstijlen</span></div>
        </div>
        <div class="filters">
          <input class="input search" type="search" id="fSearch" placeholder="Zoek op bier of brouwerij" aria-label="Zoeken">
          <select class="input" id="fStyle" aria-label="Stijl">
            <option value="">Alle stijlen</option>
            ${styles.map(s => `<option>${esc(s)}</option>`).join("")}
          </select>
          <select class="input" id="fSort" aria-label="Sorteren">
            <option value="recent">Laatst gedronken</option>
            <option value="score">Hoogste score</option>
            <option value="name">Naam</option>
            <option value="abv">Sterkste eerst</option>
            <option value="color">Licht naar donker</option>
          </select>
        </div>
        <div class="beers" id="beerList"></div>
      ` : `
        <div class="panel empty">
          ${glassSvg("var(--line)")}
          <h2>${own ? "Nog geen bieren" : "Nog niets ingecheckt"}</h2>
          <p class="muted">${own ? "Check je eerste bier in door de barcode te scannen of de naam op te zoeken." : "Zodra er bieren zijn ingecheckt, zie je ze hier."}</p>
          ${own ? `<p style="margin-top:16px"><a class="btn" href="#inchecken">Eerste bier inchecken</a></p>` : ""}
        </div>`}
    </div>`;

  if (!groups.length) return;

  const draw = () => {
    const q = $("#fSearch").value.trim().toLowerCase();
    const st = $("#fStyle").value;
    const sort = $("#fSort").value;
    let list = groups.filter(g =>
      (!q || `${g.beer.name} ${g.beer.brewery || ""}`.toLowerCase().includes(q)) &&
      (!st || g.beer.style === st));
    const by = {
      recent: (a, b) => b.last.localeCompare(a.last),
      score: (a, b) => (b.avg ?? -1) - (a.avg ?? -1),
      name: (a, b) => a.beer.name.localeCompare(b.beer.name, "nl"),
      abv: (a, b) => (b.beer.abv ?? -1) - (a.beer.abv ?? -1),
      color: (a, b) => beerColor(a.beer.style).rank - beerColor(b.beer.style).rank,
    };
    list.sort(by[sort]);
    $("#beerList").innerHTML = list.length ? list.map(g => `
      <button class="beer" data-beer="${g.beer.id}">
        ${photoBlock(g.photo, g.beer.style)}
        <div class="beer-body">
          <h3>${esc(g.beer.name)}</h3>
          <div class="beer-meta">
            ${g.beer.brewery ? `<span>${esc(g.beer.brewery)}</span>` : ""}
            ${g.beer.style ? `<span>${esc(g.beer.style)}</span>` : ""}
            ${g.beer.abv != null ? `<span>${nf(g.beer.abv)}%</span>` : ""}
          </div>
          <div class="beer-foot">
            ${stars(g.avg)}
            <span class="count">${g.checkins.length > 1 ? `${g.checkins.length} keer` : fmtDate(g.last)}</span>
          </div>
        </div>
      </button>`).join("") : `<p class="muted">Geen bieren gevonden met deze filters.</p>`;
  };
  ["fSearch", "fStyle", "fSort"].forEach(id => $("#" + id).addEventListener("input", draw));
  draw();

  $("#beerList").addEventListener("click", e => {
    const b = e.target.closest("[data-beer]");
    if (!b) return;
    const g = groups.find(x => x.beer.id === b.dataset.beer);
    showBeer(g, { own, profile });
  });
}

async function renderMine() {
  setTab("lijst");
  view().innerHTML = `<div class="loading">Je bieren ophalen…</div>`;
  try {
    const groups = groupBeers(await fetchCheckins(state.user.id));
    renderCollection(groups, { title: "Mijn bieren", own: true, profile: state.me });
  } catch (err) {
    view().innerHTML = `<p class="error">Je bieren konden niet worden geladen: ${esc(err.message)}</p>`;
  }
}

async function renderUser(userId) {
  setTab("vrienden");
  view().innerHTML = `<div class="loading">Bieren ophalen…</div>`;
  const { data: profile } = await sb.from("profiles").select("*").eq("id", userId).maybeSingle();
  if (!profile) { view().innerHTML = `<p class="error">Dit profiel bestaat niet.</p>`; return; }
  const groups = groupBeers(await fetchCheckins(userId));
  renderCollection(groups, {
    title: `Bieren van ${profile.display_name || "een vriend"}`,
    intro: profile.bio ? esc(profile.bio) : "",
    own: userId === state.user.id,
    profile,
  });
}

async function renderPublic(username) {
  $("#tabs").hidden = !state.user;
  if (!state.user) {
    $("#topRight").innerHTML = `<a class="btn ghost small" href="${esc(SITE_URL)}">Inloggen</a>`;
  }
  view().innerHTML = `<div class="loading">Bieren ophalen…</div>`;
  const { data: profile } = await sb.from("profiles").select("*").eq("username", username).maybeSingle();
  if (!profile) {
    view().innerHTML = `<div class="panel empty"><h2>Deze lijst is niet openbaar</h2><p class="muted">De eigenaar heeft deze bierlijst niet gedeeld, of de link klopt niet.</p></div>`;
    return;
  }
  const groups = groupBeers(await fetchCheckins(profile.id));
  renderCollection(groups, {
    title: `Bieren van ${profile.display_name || profile.username}`,
    intro: profile.bio ? esc(profile.bio) : "",
    own: false,
    profile,
  });
}

// Bierdetails
// ---------------------------------------------------------------------
async function showBeer(g, { own }) {
  const b = g.beer;
  const canEdit = state.user && b.created_by === state.user.id;
  const fact = (label, v) => v != null && v !== "" ? `<div><dt>${label}</dt><dd>${esc(v)}</dd></div>` : "";

  const checkinHtml = (c, name) => `
    <div class="checkin-item">
      <div>
        ${name ? `<p class="who">${esc(name)}</p>` : ""}
        <p>${stars(c.rating)} ${c.rating != null ? `<b>${nf(c.rating, 2)}</b>` : ""}</p>
        <p class="muted small">${fmtDate(c.drunk_at)}${c.serving ? `, ${esc(c.serving)}` : ""}${c.location_name ? `, ${esc(c.location_name)}` : ""}</p>
        ${c.notes ? `<p style="margin-top:6px">${esc(c.notes)}</p>` : ""}
        ${state.user && c.user_id === state.user.id ? `<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px"><button class="btn ghost small" data-edit="${c.id}">Wijzigen</button><button class="btn danger small" data-del="${c.id}">Verwijderen</button></div>` : ""}
      </div>
      ${c.photo_path ? `<a href="${esc(photoUrl(c.photo_path))}" target="_blank" rel="noopener"><img src="${esc(photoUrl(c.photo_path))}" alt="Foto bij check-in" loading="lazy"></a>` : ""}
    </div>`;

  openDialog(`
    <div class="stack">
      ${photoBlock(g.photo, b.style, "hero-photo")}
      <div>
        <h2>${esc(b.name)}</h2>
        ${b.brewery ? `<p class="muted">${esc(b.brewery)}</p>` : ""}
      </div>
      <dl class="facts">
        ${fact("Stijl", b.style)}
        ${fact("Alcohol", b.abv != null ? nf(b.abv) + "%" : null)}
        ${fact("Bitterheid", b.ibu != null ? b.ibu + " IBU" : null)}
        ${fact("Land", b.country)}
        ${fact("Barcode", b.barcode)}
      </dl>
      ${b.description ? `<p>${esc(b.description)}</p>` : ""}
      <div style="display:flex;gap:10px;flex-wrap:wrap">
        ${state.user ? `<button class="btn" id="againBtn">Opnieuw inchecken</button>` : ""}
        ${canEdit ? `<button class="btn ghost" id="editBtn">Biergegevens wijzigen</button>` : ""}
      </div>
      <div>
        <h3>${own ? "Jouw check-ins" : "Check-ins"}</h3>
        ${g.checkins.map(c => checkinHtml(c)).join("")}
      </div>
      <div id="othersBox"></div>
    </div>`);

  const again = $("#againBtn");
  if (again) again.onclick = () => { state.draft = { beer: b }; closeDialog(); location.hash = "inchecken"; if (location.hash === "#inchecken") route(); };
  const edit = $("#editBtn");
  if (edit) edit.onclick = () => editBeer(b);

  $("#dlgBody").onclick = async e => {
    const ed = e.target.closest("[data-edit]");
    if (ed) return editCheckin(g.checkins.find(c => c.id === ed.dataset.edit), b);
    const del = e.target.closest("[data-del]");
    if (!del) return;
    if (!confirm("Deze check-in verwijderen?")) return;
    const { error } = await sb.from("checkins").delete().eq("id", del.dataset.del);
    if (error) return toast("Verwijderen lukte niet: " + error.message);
    closeDialog(); toast("Check-in verwijderd"); route();
  };

  // Wie heeft dit bier nog meer gedronken?
  if (state.user) {
    const ownerId = g.checkins[0]?.user_id;
    const { data } = await sb
      .from("checkins")
      .select("*, profile:profiles(id, display_name)")
      .eq("beer_id", b.id)
      .neq("user_id", ownerId)
      .order("drunk_at", { ascending: false })
      .limit(20);
    if (data && data.length && $("#othersBox")) {
      $("#othersBox").innerHTML = `<h3>Ook gedronken door</h3>${data.map(c => checkinHtml(c, c.profile?.display_name)).join("")}`;
    }
  }
}


function servingOptions(selected) {
  return ["tap", "fles", "blik", "anders"].map(s => `<label><input type="radio" name="serving" value="${s}" ${selected === s ? "checked" : ""}><span>${s[0].toUpperCase() + s.slice(1)}</span></label>`).join("");
}
function toLocalInput(iso) {
  const d = new Date(iso);
  return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 16);
}

function editCheckin(c, beer) {
  if (!c) return;
  const r0 = c.rating != null ? Number(c.rating) : 3.5;
  openDialog(`
    <form class="stack" id="editCheckinForm">
      <h2>Check-in wijzigen</h2>
      <p class="muted">${esc(beer.name)}</p>
      <div>
        <label class="field" for="eRating"><span>Score</span></label>
        <div class="rating-row">
          <input type="range" id="eRating" name="rating" min="0" max="5" step="0.25" value="${r0}">
          <output id="eRatingOut">${nf(r0, 1)}</output>
        </div>
        <div id="eRatingStars">${stars(r0)}</div>
      </div>
      <div>
        <span style="display:block;font-weight:600;font-size:.92rem;margin-bottom:6px">Hoe gedronken</span>
        <div class="segmented">${servingOptions(c.serving)}</div>
      </div>
      <label class="field"><span>Locatie</span><input class="input" name="location_name" value="${esc(c.location_name)}"></label>
      <label class="field"><span>Wanneer</span><input class="input" type="datetime-local" name="drunk_at" value="${toLocalInput(c.drunk_at)}"></label>
      <label class="field"><span>Notities</span><textarea class="input" name="notes">${esc(c.notes)}</textarea></label>
      <div>
        <span style="display:block;font-weight:600;font-size:.92rem;margin-bottom:6px">Foto</span>
        <div class="photo-pick">
          <img id="ePhotoPreview" alt="" ${c.photo_path ? `src="${esc(photoUrl(c.photo_path))}"` : "hidden"}>
          <label class="btn soft small" style="cursor:pointer">
            <input type="file" accept="image/*" id="ePhotoInput" hidden>
            ${c.photo_path ? "Andere foto kiezen" : "Foto toevoegen"}
          </label>
        </div>
      </div>
      <button class="btn block" type="submit" id="eSave">Wijzigingen opslaan</button>
    </form>`);

  const r = $("#eRating");
  r.oninput = () => { $("#eRatingOut").textContent = nf(r.value, 1); $("#eRatingStars").innerHTML = stars(r.value); };
  let photoFile = null;
  $("#ePhotoInput").onchange = e => {
    photoFile = e.target.files[0] || null;
    if (photoFile) { const img = $("#ePhotoPreview"); img.src = URL.createObjectURL(photoFile); img.hidden = false; }
  };
  $("#editCheckinForm").onsubmit = async e => {
    e.preventDefault();
    const f = new FormData(e.target);
    const btn = $("#eSave");
    btn.disabled = true; btn.textContent = "Opslaan…";
    try {
      const update = {
        rating: Number(f.get("rating")),
        serving: f.get("serving") || null,
        location_name: String(f.get("location_name") || "").trim() || null,
        drunk_at: f.get("drunk_at") ? new Date(f.get("drunk_at")).toISOString() : c.drunk_at,
        notes: String(f.get("notes") || "").trim() || null,
      };
      if (photoFile) {
        btn.textContent = "Foto uploaden…";
        update.photo_path = await uploadPhoto(photoFile);
        if (!beer.image_path && beer.created_by === state.user.id) {
          await sb.from("beers").update({ image_path: update.photo_path }).eq("id", beer.id);
        }
      }
      const { error } = await sb.from("checkins").update(update).eq("id", c.id);
      if (error) throw error;
      if (photoFile && c.photo_path && !/^https?:/.test(c.photo_path) && c.photo_path !== beer.image_path) {
        await sb.storage.from("photos").remove([c.photo_path]);
      }
      closeDialog(); toast("Check-in bijgewerkt"); route();
    } catch (ex) {
      toast("Opslaan lukte niet: " + (ex.message || ex));
      btn.disabled = false; btn.textContent = "Wijzigingen opslaan";
    }
  };
}

function beerFields(b = {}) {
  return `
    <label class="field"><span>Naam van het bier</span><input class="input" name="name" required value="${esc(b.name)}"></label>
    <div class="grid2">
      <label class="field"><span>Brouwerij</span><input class="input" name="brewery" value="${esc(b.brewery)}"></label>
      <label class="field"><span>Stijl</span><input class="input" name="style" list="styleList" value="${esc(b.style)}" placeholder="Bijv. Tripel"></label>
    </div>
    <div class="grid3">
      <label class="field"><span>Alcohol %</span><input class="input" name="abv" type="number" step="0.1" min="0" max="70" inputmode="decimal" value="${esc(b.abv)}"></label>
      <label class="field"><span>IBU</span><input class="input" name="ibu" type="number" step="1" min="0" max="300" inputmode="numeric" value="${esc(b.ibu)}"></label>
      <label class="field"><span>Land</span><input class="input" name="country" value="${esc(b.country)}"></label>
    </div>
    <label class="field"><span>Omschrijving</span><textarea class="input" name="description">${esc(b.description)}</textarea></label>
    <datalist id="styleList">
      ${["Pils", "Lager", "Blond", "Witbier", "Weizen", "Tripel", "Dubbel", "Quadrupel", "IPA", "Double IPA", "NEIPA", "Pale Ale", "Saison", "Amber", "Bock", "Stout", "Imperial Stout", "Porter", "Kriek", "Geuze", "Sour", "Alcoholvrij"].map(s => `<option value="${s}">`).join("")}
    </datalist>`;
}
function readBeerFields(f) {
  const num = v => (v === "" || v == null ? null : Number(String(v).replace(",", ".")));
  return {
    name: String(f.get("name") || "").trim(),
    brewery: String(f.get("brewery") || "").trim() || null,
    style: String(f.get("style") || "").trim() || null,
    abv: num(f.get("abv")),
    ibu: num(f.get("ibu")),
    country: String(f.get("country") || "").trim() || null,
    description: String(f.get("description") || "").trim() || null,
  };
}

function editBeer(b) {
  openDialog(`
    <form class="stack" id="editForm">
      <h2>Biergegevens wijzigen</h2>
      ${beerFields(b)}
      <button class="btn block" type="submit">Wijzigingen opslaan</button>
    </form>`);
  $("#editForm").onsubmit = async e => {
    e.preventDefault();
    const data = readBeerFields(new FormData(e.target));
    if (!data.name) return toast("Vul de naam van het bier in.");
    const { error } = await sb.from("beers").update(data).eq("id", b.id);
    if (error) return toast("Opslaan lukte niet: " + error.message);
    closeDialog(); toast("Wijzigingen opgeslagen"); route();
  };
}

async function lookupBarcode(code) {
  const { data } = await sb.from("beers").select("*").eq("barcode", code).maybeSingle();
  if (data) return { beer: data };
  try {
    const r = await fetch(`https://world.openfoodfacts.org/api/v2/product/${encodeURIComponent(code)}.json?fields=product_name,brands,nutriments,countries,image_front_url`);
    const j = await r.json();
    if (j.status === 1 && j.product) {
      const p = j.product;
      const abv = p.nutriments?.alcohol ?? p.nutriments?.alcohol_100g ?? p.nutriments?.alcohol_value;
      return {
        prefill: {
          barcode: code,
          name: p.product_name || "",
          brewery: (p.brands || "").split(",")[0].trim(),
          abv: abv != null && abv !== "" ? Number(abv) : null,
          country: (p.countries || "").split(",")[0].replace(/^en:/, "").trim(),
          image_path: p.image_front_url || null,
          source: "openfoodfacts",
        },
      };
    }
  } catch { /* geen verbinding met Open Food Facts: gewoon handmatig invullen */ }
  return { prefill: { barcode: code } };
}

async function stopScanner() {
  if (state.scanner) {
    try { await state.scanner.stop(); } catch {}
    try { state.scanner.clear(); } catch {}
    state.scanner = null;
  }
}

function renderCheckin() {
  setTab("inchecken");
  const d = state.draft;
  const now = new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 16);

  const chooseHtml = `
    <div class="panel stack" id="chooseBox">
      <h2>Welk bier drink je?</h2>

      </button>

      <div class="panel stack">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:10px">
          <h2>Nieuw bier</h2>
          <button class="btn ghost small" id="changeBtn" type="button">Annuleren</button>

        ${beerFields(d.prefill || {})}
      </div>`) : "";

  view().innerHTML = `
    <form class="stack" id="checkinForm" novalidate>
      <h1>Inchecken</h1>
      ${d ? chosenHtml : chooseHtml}
      ${d ? `
      <div class="panel stack">
        <div>
          <label class="field" for="rating"><span>Score</span></label>
          <div class="rating-row">
            <input type="range" id="rating" name="rating" min="0" max="5" step="0.25" value="3.5">
            <output id="ratingOut">3,5</output>
          </div>
          <div id="ratingStars">${stars(3.5)}</div>
        </div>
        <div>
          <span class="field" style="display:block;font-weight:600;font-size:.92rem;margin-bottom:6px">Hoe gedronken</span>
          <div class="segmented">
            ${servingOptions(null)}
          </div>
        </div>
        <div>
          <label class="field"><span>Locatie</span><input class="input" name="location_name" id="locName" placeholder="Bijv. café of stad"></label>
          <button class="btn soft small" type="button" id="geoBtn" style="margin-top:8px">Huidige locatie gebruiken</button>
          <input type="hidden" name="latitude" id="lat"><input type="hidden" name="longitude" id="lon">
        </div>
        <label class="field"><span>Wanneer</span><input class="input" type="datetime-local" name="drunk_at" value="${now}"></label>
        <label class="field"><span>Notities</span><textarea class="input" name="notes" placeholder="Smaak, geur, met wie…"></textarea></label>
        <div>
          <span style="display:block;font-weight:600;font-size:.92rem;margin-bottom:6px">Foto</span>
          <div class="photo-pick">
            <img id="photoPreview" alt="" hidden>
            <label class="btn soft small" style="cursor:pointer">
              <input type="file" accept="image/*" id="photoInput" hidden>
              Foto maken of kiezen
            </label>
          </div>
        </div>
        <p class="error" id="checkinErr" hidden></p>
        <button class="btn block" type="submit" id="saveBtn">Check-in opslaan</button>
      </div>` : ""}
    </form>`;

  if (!d) {
    $("#scanBtn").onclick = startScan;
    $("#newBtn").onclick = () => { stopScanner(); state.draft = { prefill: { name: $("#beerSearch").value.trim() } }; renderCheckin(); };
    let timer;
    $("#beerSearch").oninput = e => {
      clearTimeout(timer);
      const q = e.target.value.trim().replace(/[,()%*\\]/g, " ");
      if (q.length < 2) { $("#results").innerHTML = ""; return; }
      timer = setTimeout(async () => {
        const { data } = await sb.from("beers").select("*").or(`name.ilike.%${q}%,brewery.ilike.%${q}%`).order("name").limit(8);
        $("#results").innerHTML = (data || []).map(b => `
          <button type="button" class="result" data-id="${b.id}">
            <span><b>${esc(b.name)}</b><br><span class="muted small">${esc([b.brewery, b.style].filter(Boolean).join(", "))}</span></span>
            <span class="muted small">Kies</span>
          </button>`).join("") || `<p class="muted small">Niet gevonden. Voeg het toe als nieuw bier.</p>`;
        $("#results").onclick = ev => {
          const r = ev.target.closest("[data-id]");
          if (!r) return;
          state.draft = { beer: data.find(x => x.id === r.dataset.id) };
          renderCheckin();
        };
      }, 250);
    };
    return;
  }

  $("#changeBtn").onclick = () => { state.draft = null; renderCheckin(); };

  const r = $("#rating");
  r.oninput = () => { $("#ratingOut").textContent = nf(r.value, 1); $("#ratingStars").innerHTML = stars(r.value); };

  $("#geoBtn").onclick = () => {
    if (!navigator.geolocation) return toast("Je browser kan je locatie niet bepalen.");
    $("#geoBtn").disabled = true;
    navigator.geolocation.getCurrentPosition(async pos => {
      const { latitude, longitude } = pos.coords;
      $("#lat").value = latitude; $("#lon").value = longitude;
      try {
        const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=18&accept-language=nl&lat=${latitude}&lon=${longitude}`);
        const j = await res.json();
        const a = j.address || {};
        const place = j.name || a.amenity || a.pub || a.bar || a.restaurant || a.road;
        const city = a.city || a.town || a.village;
        if (!$("#locName").value) $("#locName").value = [place, city].filter(Boolean).join(", ");
      } catch {}
      $("#geoBtn").disabled = false;
      $("#geoBtn").textContent = "Locatie toegevoegd";
    }, () => { $("#geoBtn").disabled = false; toast("Locatie niet beschikbaar. Geef de browser toestemming."); }, { enableHighAccuracy: true, timeout: 10000 });
  };

  let photoFile = null;
  $("#photoInput").onchange = e => {
    photoFile = e.target.files[0] || null;
    const img = $("#photoPreview");
    if (photoFile) { img.src = URL.createObjectURL(photoFile); img.hidden = false; }
  };

  $("#checkinForm").onsubmit = async e => {
    e.preventDefault();
    const f = new FormData(e.target);
    const err = $("#checkinErr");
    const btn = $("#saveBtn");
    err.hidden = true; btn.disabled = true; btn.textContent = "Opslaan…";
    try {
      let beer = d.beer;
      if (!beer) {
        const fields = readBeerFields(f);
        if (!fields.name) throw new Error("Vul de naam van het bier in.");
        const insert = { ...fields, barcode: d.prefill?.barcode || null, source: d.prefill?.source || "manual", image_path: d.prefill?.image_path || null };
        const { data, error } = await sb.from("beers").insert(insert).select().single();
        if (error && error.code === "23505" && insert.barcode) {
          const { data: existing } = await sb.from("beers").select("*").eq("barcode", insert.barcode).single();
          beer = existing;
        } else if (error) throw error;
        else beer = data;
      }

      let photo_path = null;
      if (photoFile) {
        btn.textContent = "Foto uploaden…";
        photo_path = await uploadPhoto(photoFile);
        if (!beer.image_path && beer.created_by === state.user.id) {
          await sb.from("beers").update({ image_path: photo_path }).eq("id", beer.id);
        }
      }

      const lat = f.get("latitude"), lon = f.get("longitude");
      const { error } = await sb.from("checkins").insert({
        beer_id: beer.id,
        rating: Number(f.get("rating")),
        serving: f.get("serving") || null,
        location_name: String(f.get("location_name") || "").trim() || null,
        latitude: lat ? Number(lat) : null,
        longitude: lon ? Number(lon) : null,
        drunk_at: f.get("drunk_at") ? new Date(f.get("drunk_at")).toISOString() : new Date().toISOString(),
        notes: String(f.get("notes") || "").trim() || null,
        photo_path,
      });
      if (error) throw error;
      state.draft = null;
      toast(`${beer.name} ingecheckt. Proost!`);
      location.hash = "lijst";
    } catch (ex) {
      err.textContent = ex.message || "Opslaan lukte niet.";
      err.hidden = false;
      btn.disabled = false; btn.textContent = "Check-in opslaan";
    }
  };
}

async function startScan() {
  const reader = $("#reader"), msg = $("#scanMsg"), btn = $("#scanBtn");
  if (state.scanner) { await stopScanner(); reader.hidden = true; btn.lastChild.textContent = " Barcode scannen"; return; }
  reader.hidden = false; msg.hidden = false;
  msg.textContent = "Richt de camera op de barcode van het flesje of blikje.";
  btn.lastChild.textContent = " Stoppen met scannen";
  const F = Html5QrcodeSupportedFormats;
  state.scanner = new Html5Qrcode("reader", {
    formatsToSupport: [F.EAN_13, F.EAN_8, F.UPC_A, F.UPC_E],
    experimentalFeatures: { useBarCodeDetectorIfSupported: true },
    verbose: false,
  });
  try {
    await state.scanner.start(
      { facingMode: "environment" },
      { fps: 10, qrbox: (w, h) => ({ width: Math.min(300, w * 0.85), height: Math.min(140, h * 0.5) }) },
      async code => {
        await stopScanner();
        if (navigator.vibrate) navigator.vibrate(60);
        msg.textContent = `Barcode ${code} gevonden. Gegevens opzoeken…`;
        const found = await lookupBarcode(code);
        state.draft = found.beer ? { beer: found.beer } : { prefill: found.prefill };
        renderCheckin();
      }
    );
  } catch (ex) {
    await stopScanner();
    reader.hidden = true;
    btn.lastChild.textContent = " Barcode scannen";
    msg.textContent = "De camera kon niet worden gestart. Geef de browser toestemming voor de camera, of zoek het bier op naam.";
  }
}

function tempPassword() {
  const chars = "abcdefghjkmnpqrstuvwxyzABCDEFGHJKMNPQRSTUVWXYZ23456789";
  const arr = crypto.getRandomValues(new Uint32Array(10));
  return [...arr].map(n => chars[n % chars.length]).join("");
}

    const { error } = await sb.from("invites").insert({ email });
    if (error && error.code !== "23505") return toast("Uitnodigen lukte niet: " + error.message);
    const name = state.me?.display_name || "Ik";

      toast("Uitnodiging ingetrokken"); return renderAdmin();

    const rs = e.target.closest("[data-reset]");
    if (rs) {
      const pw = tempPassword();

        $("#doReset").textContent = "Ingesteld";
        toast("Tijdelijk wachtwoord ingesteld");
      };
    }
  };
}

function passwordForm(forced) {
  return `
    <form class="panel stack" id="pwForm">
      <h2>${forced ? "Kies een nieuw wachtwoord" : "Wachtwoord wijzigen"}</h2>
      ${forced ? `<p class="muted">Je bent ingelogd met een tijdelijk wachtwoord. Kies een eigen wachtwoord om verder te gaan.</p>` : ""}
      ${forced ? "" : `<label class="field"><span>Huidig wachtwoord</span><input class="input" type="password" name="current" autocomplete="current-password" required></label>`}
      <label class="field"><span>Nieuw wachtwoord</span><input class="input" type="password" name="pw1" minlength="8" autocomplete="new-password" required></label>
      <label class="field"><span>Nieuw wachtwoord herhalen</span><input class="input" type="password" name="pw2" minlength="8" autocomplete="new-password" required></label>
      <p class="error" id="pwErr" hidden></p>
      <button class="btn" type="submit">Wachtwoord opslaan</button>
    </form>`;
}
function bindPasswordForm(forced) {
  $("#pwForm").onsubmit = async e => {
    e.preventDefault();
    const f = new FormData(e.target);
    const err = $("#pwErr");
    const btn = e.target.querySelector("button[type=submit]");
    const fail = m => { err.textContent = m; err.hidden = false; btn.disabled = false; };
    err.hidden = true; btn.disabled = true;
    const pw1 = String(f.get("pw1")), pw2 = String(f.get("pw2"));
    if (pw1.length < 8) return fail("Het nieuwe wachtwoord moet minstens 8 tekens hebben.");
    if (pw1 !== pw2) return fail("De twee nieuwe wachtwoorden zijn niet gelijk.");
    if (!forced) {
      const { error } = await sb.auth.signInWithPassword({ email: state.user.email, password: String(f.get("current")) });
      if (error) return fail("Je huidige wachtwoord klopt niet.");
    }
    const { error } = await sb.auth.updateUser({ password: pw1 });
    if (error) return fail(/different|same/i.test(error.message) ? "Kies een ander wachtwoord dan je huidige." : "Opslaan lukte niet: " + error.message);
    await sb.from("profiles").update({ must_change_password: false }).eq("id", state.user.id);
    if (state.me) state.me.must_change_password = false;
    toast("Wachtwoord gewijzigd");
    if (forced) { location.hash = "lijst"; route(); } else e.target.reset(), (btn.disabled = false);
  };
}
function renderForcedPassword() {
  setTab(null);
  $("#tabs").hidden = true;
  view().innerHTML = `<div class="auth stack">${passwordForm(true)}<button class="btn ghost" id="logoutBtn2" type="button">Uitloggen</button></div>`;
  bindPasswordForm(true);
  $("#logoutBtn2").onclick = () => sb.auth.signOut();
}

        <label class="field"><span>Gebruikersnaam</span><input class="input" name="username" value="${esc(p.username)}" placeholder="bijv. mike_bier" pattern="[a-z0-9_]{3,30}" autocapitalize="off"></label>
        <p class="muted small">Kleine letters, cijfers en _, 3 tot 30 tekens. Nodig voor je openbare link.</p>
        <label class="field"><span>Over jou</span><textarea class="input" name="bio" maxlength="500" placeholder="Favoriete stijl, vaste kroeg…">${esc(p.bio)}</textarea></label>
        <label class="switch">
          <span><b>Openbare lijst</b><br><span class="muted small">Iedereen met de link kan je bieren zien, ook zonder account.</span></span>
          <input type="checkbox" name="is_public" ${p.is_public ? "checked" : ""}>
        </label>
        <button class="btn" type="submit">Profiel opslaan</button>
      </form>

      ${p.is_public && publicLink ? `
        <div class="panel stack">
          <h2>Je openbare link</h2>
          <input class="input" readonly value="${esc(publicLink)}" id="pubLink">
          <div style="display:flex;gap:10px;flex-wrap:wrap">
            <button class="btn" id="copyLink" type="button">Link kopiëren</button>
            <a class="btn ghost" href="${esc(publicLink)}" target="_blank" rel="noopener">Bekijken</a>
          </div>
        </div>` : p.is_public ? `<p class="muted">Kies een gebruikersnaam om je openbare link te krijgen.</p>` : ""}

      ${passwordForm(false)}

      ${p.is_admin ? `
        <div class="panel stack">
          <h2>Beheer</h2>
          <p class="muted small">Mensen uitnodigen en wachtwoorden resetten.</p>
          <a class="btn soft" href="#beheer">Naar beheer</a>
        </div>` : ""}

      <div class="panel stack">
        <h2>Exporteren</h2>
        <p class="muted small">Download al je check-ins met de biergegevens. CSV opent direct in Excel.</p>
        <div style="display:flex;gap:10px;flex-wrap:wrap">
          <button class="btn soft" id="csvBtn" type="button">Download CSV</button>
          <button class="btn soft" id="jsonBtn" type="button">Download JSON</button>
        </div>
      </div>

      <button class="btn ghost" id="logoutBtn" type="button">Uitloggen</button>
    </div>`;

  $("#profileForm").onsubmit = async e => {
    e.preventDefault();
    const f = new FormData(e.target);
    const username = String(f.get("username") || "").trim().toLowerCase() || null;
    if (username && !/^[a-z0-9_]{3,30}$/.test(username)) return toast("Gebruikersnaam: alleen kleine letters, cijfers en _, 3 tot 30 tekens.");
    const update = {
      display_name: String(f.get("display_name")).trim(),
      username,
      bio: String(f.get("bio") || "").trim() || null,
      is_public: f.get("is_public") === "on",
    };
    const { data, error } = await sb.from("profiles").update(update).eq("id", state.user.id).select().single();
    if (error) return toast(error.code === "23505" ? "Deze gebruikersnaam is al bezet." : "Opslaan lukte niet: " + error.message);
    state.me = data; toast("Profiel opgeslagen"); renderProfile();
  };
  const copy = $("#copyLink");
  if (copy) copy.onclick = async () => {
    try { await navigator.clipboard.writeText($("#pubLink").value); toast("Link gekopieerd"); }
    catch { $("#pubLink").select(); toast("Selecteer en kopieer de link"); }
  };
  bindPasswordForm(false);
  $("#csvBtn").onclick = () => exportData("csv");
  $("#jsonBtn").onclick = () => exportData("json");
  $("#logoutBtn").onclick = async () => { await sb.auth.signOut(); };
}

async function exportData(kind) {
  const rows = await fetchCheckins(state.user.id);
  const flat = rows.map(c => ({
    datum: c.drunk_at,
    bier: c.beer?.name,
    brouwerij: c.beer?.brewery,
    stijl: c.beer?.style,
    alcohol: c.beer?.abv,
    ibu: c.beer?.ibu,
    land: c.beer?.country,
    barcode: c.beer?.barcode,
    score: c.rating,
    gedronken_uit: c.serving,
    locatie: c.location_name,
    breedtegraad: c.latitude,
    lengtegraad: c.longitude,
    notities: c.notes,
    foto: photoUrl(c.photo_path),
  }));
  let blob, name;
  const stamp = new Date().toISOString().slice(0, 10);
  if (kind === "json") {
    blob = new Blob([JSON.stringify(flat, null, 2)], { type: "application/json" });
    name = `bierlijst-${stamp}.json`;
  } else {
    const cols = Object.keys(flat[0] || { datum: "" });
    const cell = v => {
      if (v == null) return "";
      const s = typeof v === "number" ? String(v).replace(".", ",") : String(v);
      return /[;"\n\r]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
    };
    const csv = [cols.join(";"), ...flat.map(r => cols.map(c => cell(r[c])).join(";"))].join("\r\n");
    blob = new Blob(["\ufeff" + csv], { type: "text/csv;charset=utf-8" });
    name = `bierlijst-${stamp}.csv`;
  }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

// ---------------------------------------------------------------------
// Navigatie
// ---------------------------------------------------------------------
const params = new URLSearchParams(location.search);
const publicUser = params.get("u");

async function route() {
  view().onclick = null;
  view().onchange = null;
  if (location.hash !== "#inchecken") stopScanner();
  if (publicUser && (!location.hash || location.hash === "#")) return renderPublic(publicUser);
  if (!state.user) return renderAuth();
  if (state.me?.must_change_password) return renderForcedPassword();
  $("#tabs").hidden = false;
  $("#topRight").innerHTML = "";
  const h = location.hash.slice(1) || "lijst";
  if (h === "inchecken") return renderCheckin();
  if (h === "vrienden") return renderFriends();
  if (h === "profiel") return renderProfile();
  if (h === "beheer") return renderAdmin();
  if (h.startsWith("u/")) return renderUser(h.slice(2));
  return renderMine();
}
window.addEventListener("hashchange", route);

(async function init() {
  const { data } = await sb.auth.getSession();
  state.user = data.session?.user || null;
  if (state.user) await loadMe();
  route();
  sb.auth.onAuthStateChange(async (event, session) => {
    const before = state.user?.id;
    state.user = session?.user || null;
    if (state.user && state.user.id !== before) { await loadMe(); route(); }
    if (!state.user && before) { state.me = null; location.hash = ""; route(); }
  });
})();
</script>

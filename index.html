async function getJson(url) {
  let r;
  try { r = await fetch(url); }
  catch { throw new Error(`de F1-gegevensbron is niet bereikbaar (${url})`); }
  if (!r.ok) throw new Error(`de F1-gegevensbron gaf foutcode ${r.status} (${url})`);
  return r.json();
}
const NL_COUNTRY = {
  Australia: "Australië", China: "China", Japan: "Japan", Bahrain: "Bahrein", "Saudi Arabia": "Saoedi-Arabië",
  USA: "Verenigde Staten", "United States": "Verenigde Staten", Canada: "Canada", Monaco: "Monaco", Spain: "Spanje",
  Austria: "Oostenrijk", UK: "Groot-Brittannië", "United Kingdom": "Groot-Brittannië", Belgium: "België",
  Hungary: "Hongarije", Netherlands: "Nederland", Italy: "Italië", Azerbaijan: "Azerbeidzjan", Singapore: "Singapore",
  Mexico: "Mexico", Brazil: "Brazilië", Qatar: "Qatar", UAE: "Abu Dhabi", "United Arab Emirates": "Abu Dhabi",
};
function dutchLabel(r) {
  const loc = r.Circuit?.Location || {};
  if (loc.locality === "Miami") return "Miami";
  if (loc.locality === "Las Vegas") return "Las Vegas";
  if (r.Circuit?.circuitId === "catalunya") return "Spanje (Catalunya)";
  if (r.Circuit?.circuitId === "imola") return "Emilia-Romagna";
  return NL_COUNTRY[loc.country] || loc.country || r.raceName;
}
const isoOf = (date, time) => date ? new Date(`${date}T${time || "12:00:00Z"}`).toISOString() : null;

async function importSeason(year) {
  const base = F1_API + year;
  const [rj, dj, cj] = await Promise.all([
    getJson(base + ".json?limit=100"),
    getJson(base + "/drivers.json?limit=100"),
    getJson(base + "/constructors.json?limit=100"),
  ]);
  const races = rj.MRData?.RaceTable?.Races || [];
  const drivers = dj.MRData?.DriverTable?.Drivers || [];
  const cons = cj.MRData?.ConstructorTable?.Constructors || [];
  let lastRes = [];
  try {
    const lj = await getJson(base + "/last/results.json");
    lastRes = lj.MRData?.RaceTable?.Races?.[0]?.Results || [];
  } catch { /* nog geen uitslagen */ }
  if (!races.length && !drivers.length) return `Voor ${year} zijn nog geen gegevens beschikbaar.`;

  let step = "";
  const must = r => { if (r.error) throw new Error(`${step}: ${r.error.message}`); return r; };

  // Teams
  step = "teams opslaan";
  for (const c of cons) {
    const ex = state.teams.find(t => t.ext_id === c.constructorId) || state.teams.find(t => t.name.toLowerCase() === c.name.toLowerCase());
    if (ex) { if (ex.ext_id !== c.constructorId) must(await sb.from("teams").update({ ext_id: c.constructorId }).eq("id", ex.id)); }
    else must(await sb.from("teams").insert({ name: c.name, ext_id: c.constructorId, color: TEAM_COLORS[c.constructorId] || null }));
  }
  // Coureurs
  step = "coureurs opslaan";
  for (const d of drivers) {
    const ex = state.drivers.find(x => x.ext_id === d.driverId) ||
      state.drivers.find(x => `${x.first_name} ${x.last_name}`.toLowerCase() === `${d.givenName} ${d.familyName}`.toLowerCase());
    if (ex) { if (ex.ext_id !== d.driverId) must(await sb.from("drivers").update({ ext_id: d.driverId }).eq("id", ex.id)); }
    else must(await sb.from("drivers").insert({ first_name: d.givenName, last_name: d.familyName, code: d.code || null, ext_id: d.driverId }));
  }
  await loadBase();

  // Wie rijdt voor welk team (uit de laatste uitslag, als die er is)
  const lineup = lastRes.map(r => ({
    season: year,
    driver_id: state.drivers.find(d => d.ext_id === r.Driver?.driverId)?.id,
    team_id: state.teams.find(t => t.ext_id === r.Constructor?.constructorId)?.id,
    number: r.number ? Number(r.number) : null,
  })).filter(r => r.driver_id && r.team_id);
  step = "coureurs aan teams koppelen";
  if (lineup.length) must(await sb.from("season_drivers").upsert(lineup, { onConflict: "season,driver_id" }));

  // Races
  step = "races opslaan";
  const { data: existing } = await sb.from("grand_prix").select("*").eq("season", year);
  let added = 0, updated = 0;
  for (const r of races) {
    const row = {
      season: year,
      round: Number(r.round),
      name: "GP " + dutchLabel(r),
      country: dutchLabel(r),
      circuit: r.Circuit?.circuitName || null,
      ext_circuit: r.Circuit?.circuitId || null,
      quali_start: r.Qualifying ? isoOf(r.Qualifying.date, r.Qualifying.time) : null,
      race_start: isoOf(r.date, r.time),
      first_session: r.FirstPractice ? isoOf(r.FirstPractice.date, r.FirstPractice.time) : null,
    };
    const ex = (existing || []).find(g => g.ext_circuit && g.ext_circuit === row.ext_circuit);
    if (ex) {
      const upd = { round: row.round, quali_start: row.quali_start, race_start: row.race_start, first_session: row.first_session };
      const moved = ex.race_start && row.race_start && new Date(ex.race_start).getTime() !== new Date(row.race_start).getTime();
      if (moved && ex.status === "gepland") upd.status = "verplaatst";
      must(await sb.from("grand_prix").update(upd).eq("id", ex.id));
      updated++;
    } else {
      must(await sb.from("grand_prix").insert(row));
      added++;
    }
  }
  const s = state.seasons.find(x => x.year === year);
  const { data: first } = await sb.from("grand_prix").select("closes_at").eq("season", year)
    .not("closes_at", "is", null).order("closes_at").limit(1);
  const firstQ = first?.[0]?.closes_at;
  if (s && !s.deadline && firstQ) must(await sb.from("seasons").update({ deadline: firstQ }).eq("year", year));
  await loadBase();
  return `Klaar: ${added} races toegevoegd, ${updated} bijgewerkt, ${drivers.length} coureurs en ${cons.length} teams.`;
}

// Vragen: per onderdeel een regel met vraag, soort antwoord en punten
const TYPE_LABELS = [["coureur", "Coureur"], ["team", "Team"], ["positie", "Vrije invoer (getal)"]];
const typeSelect = (cur, attrs) => `<select ${attrs}>${TYPE_LABELS.map(([v, l]) =>
  `<option value="${v}" ${v === cur ? "selected" : ""}>${l}</option>`).join("")}</select>`;

async function admQuestions(box) {
  const { data } = await sb.from("questions").select("*").eq("active", true).order("sort_order");
  const qs = data || [];
  const maxOrder = Math.max(0, ...qs.map(q => q.sort_order));
  const groups = [["seizoen", "Seizoensvragen"], ["kwalificatie", "Kwalificatie"], ["race", "Race"]];
  box.innerHTML = `<form id="qList" class="stack">
    ${groups.map(([cat, label]) => `<fieldset class="panel">
      <legend>${label}</legend>
      <div class="qhdr"><span>Vraag</span><span>Antwoord</span><span>Punten</span><span></span></div>
      ${qs.filter(q => q.category === cat).map(q => `<div class="qline">
        <input name="t${q.id}" value="${esc(q.text)}" required aria-label="Vraag">
        ${typeSelect(q.answer_type, `name="a${q.id}" aria-label="Soort antwoord"`)}
        <input name="p${q.id}" type="number" min="0" max="100" value="${q.points}" required aria-label="Punten">
        <button type="button" class="icon" data-remove-q="${q.id}" aria-label="Vraag verwijderen">×</button>
      </div>`).join("")}
      <div class="qline add">
        <input placeholder="Nieuwe vraag" data-new-text="${cat}" aria-label="Nieuwe vraag">
        ${typeSelect("coureur", `data-new-type="${cat}" aria-label="Soort antwoord"`)}
        <input type="number" min="0" max="100" value="1" data-new-pts="${cat}" aria-label="Punten">
        <button type="button" class="btn ghost small" data-add-q="${cat}">Toevoegen</button>
      </div>
    </fieldset>`).join("")}
    <div class="row wrap" style="justify-content:space-between">
      <p class="muted small">Wijzigingen gelden voor races die je hierna openzet. Races die al open staan, houden hun vragen en punten.</p>
      <button class="btn">Wijzigingen opslaan</button>
    </div>
  </form>`;

  const form = $("#qList");
  const saveChanges = async () => {
    const changed = qs.map(q => ({
      q,
      text: form.elements["t" + q.id].value.trim(),
      answer_type: form.elements["a" + q.id].value,
      points: Number(form.elements["p" + q.id].value),
    })).filter(x => x.text && (x.text !== x.q.text || x.points !== x.q.points || x.answer_type !== x.q.answer_type));
    for (const x of changed) {
      const { error } = await sb.from("questions")
        .update({ text: x.text, points: x.points, answer_type: x.answer_type }).eq("id", x.q.id);
      if (error) { toast("Opslaan lukte niet: " + error.message); return false; }
    }
    return changed.length;
  };

  form.onsubmit = async e => {
    e.preventDefault();
    const n = await saveChanges();
    if (n === false) return;
    toast(n ? "Wijzigingen opgeslagen" : "Er was niets gewijzigd");
    admQuestions(box);
  };
  form.onclick = async e => {
    const rm = e.target.closest("[data-remove-q]");
    const add = e.target.closest("[data-add-q]");
    if (rm) {
      const q = qs.find(x => x.id === Number(rm.dataset.removeQ));
      if (!confirm(`"${q.text}" verwijderen? Races die al open staan, houden deze vraag.`)) return;
      if (await saveChanges() === false) return;
      const { error } = await sb.from("questions").update({ active: false }).eq("id", q.id);
      if (error) return toast("Verwijderen lukte niet: " + error.message);
      toast("Vraag verwijderd");
      admQuestions(box);
    } else if (add) {
      const cat = add.dataset.addQ;
      const text = form.querySelector(`[data-new-text="${cat}"]`).value.trim();
      if (!text) return toast("Typ eerst de nieuwe vraag.");
      if (await saveChanges() === false) return;
      const { error } = await sb.from("questions").insert({
        text, category: cat, scope: cat === "seizoen" ? "seizoen" : "gp",
        answer_type: form.querySelector(`[data-new-type="${cat}"]`).value,
        points: Number(form.querySelector(`[data-new-pts="${cat}"]`).value) || 0,
        sort_order: maxOrder + 10, active: true,
      });
      if (error) return toast("Toevoegen lukte niet: " + error.message);
      toast("Vraag toegevoegd");
      admQuestions(box);
    }
  };
}

        <span class="row">
          <select data-lineup="${d.id}" aria-label="Team van ${esc(d.last_name)}" ${year ? "" : "disabled"}>
            <option value="">Geen team</option>
            ${state.teams.map(t => `<option value="${t.id}" ${lineupOf(d.id)?.team_id === t.id ? "selected" : ""}>${esc(t.name)}</option>`).join("")}
          </select>
          <button type="button" class="btn ghost small" data-toggle-driver="${d.id}">${d.active ? "Niet actief" : "Actief"}</button>
          <button type="button" class="icon" data-del-driver="${d.id}" aria-label="${esc(d.last_name)} verwijderen">×</button>
        </span></li>`).join("")}</ul>
      <form id="newDriver" class="row wrap">
        <input name="first" placeholder="Voornaam" required>
        <input name="last" placeholder="Achternaam" required>
        <button class="btn ghost">Coureur toevoegen</button>
      </form>
    </div>
    <div class="panel stack">
      <h3>Teams</h3>
      <ul class="list">${state.teams.map(t => `<li class="drow">
        <span><i class="sw" style="background:${validColor(t.color)}"></i>${esc(t.name)}${t.active ? "" : ` <span class="muted small">(niet actief)</span>`}</span>
        <span class="row">
          <input type="color" value="${validColor(t.color)}" data-team-color="${t.id}" aria-label="Kleur van ${esc(t.name)}">
          <button type="button" class="btn ghost small" data-toggle-team="${t.id}">${t.active ? "Niet actief" : "Actief"}</button>
          <button type="button" class="icon" data-del-team="${t.id}" aria-label="${esc(t.name)} verwijderen">×</button>
        </span></li>`).join("")}</ul>
      <form id="newTeam" class="row">
        <input name="name" placeholder="Teamnaam" required>
        <button class="btn ghost">Team toevoegen</button>
      </form>
    </div>`;

  const refresh = async msg => { await loadBase(); toast(msg); admDrivers(box); };
  box.onchange = async e => {
    const sel = e.target.closest("[data-lineup]");
    const col = e.target.closest("[data-team-color]");
    if (sel) {
      const driver_id = Number(sel.dataset.lineup);
      const { error } = sel.value
        ? await sb.from("season_drivers").upsert({ season: year, driver_id, team_id: Number(sel.value) }, { onConflict: "season,driver_id" })
        : await sb.from("season_drivers").delete().eq("season", year).eq("driver_id", driver_id);
      if (error) return toast("Opslaan lukte niet: " + error.message);
      await loadLineup();
      toast("Team opgeslagen");
    } else if (col) {
      const { error } = await sb.from("teams").update({ color: col.value }).eq("id", Number(col.dataset.teamColor));
      if (error) return toast("Opslaan lukte niet: " + error.message);
      refresh("Kleur opgeslagen");
    }
  };
  box.onclick = async e => {
    const d = e.target.closest("[data-toggle-driver]");
    const t = e.target.closest("[data-toggle-team]");
    const dd = e.target.closest("[data-del-driver]");
    const dt = e.target.closest("[data-del-team]");
    if (dd || dt) {
      const isDriver = !!dd;
      const x = isDriver ? driverById(Number(dd.dataset.delDriver)) : teamById(Number(dt.dataset.delTeam));
      const label = isDriver ? `${x.first_name} ${x.last_name}` : x.name;
      if (!confirm(`${label} verwijderen? ${isDriver ? "Ook de koppeling aan een team verdwijnt." : "Coureurs die aan dit team gekoppeld zijn, verliezen hun team."}`)) return;
      const { error } = await sb.from(isDriver ? "drivers" : "teams").delete().eq("id", x.id);
      if (error) return toast(error.code === "23503"
        ? `${label} wordt al gebruikt in een voorspelling, uitslag of vraag en kan niet weg. Zet ${isDriver ? "hem" : "het"} op niet actief, dan verdwijnt ${isDriver ? "hij" : "het"} uit de keuzelijsten.`
        : "Verwijderen lukte niet: " + error.message);
      return refresh(`${label} verwijderd`);
    }
    if (d) {
      const x = driverById(Number(d.dataset.toggleDriver));
      const { error } = await sb.from("drivers").update({ active: !x.active }).eq("id", x.id);
      if (error) return toast("Opslaan lukte niet: " + error.message);
      refresh(x.active ? "Coureur op niet actief gezet" : "Coureur weer actief");
    } else if (t) {
      const x = teamById(Number(t.dataset.toggleTeam));
      const { error } = await sb.from("teams").update({ active: !x.active }).eq("id", x.id);
      if (error) return toast("Opslaan lukte niet: " + error.message);
      refresh(x.active ? "Team op niet actief gezet" : "Team weer actief");
    }
  };
  $("#newDriver").onsubmit = async e => {
    e.preventDefault();
    const f = new FormData(e.target);
    const { error } = await sb.from("drivers").insert({ first_name: String(f.get("first")).trim(), last_name: String(f.get("last")).trim() });
    if (error) return toast("Toevoegen lukte niet: " + error.message);
    refresh("Coureur toegevoegd");
  };
  $("#newTeam").onsubmit = async e => {
    e.preventDefault();
    const name = String(new FormData(e.target).get("name")).trim();
    const { error } = await sb.from("teams").insert({ name });
    if (error) return toast(error.code === "23505" ? "Dit team bestaat al." : "Toevoegen lukte niet: " + error.message);
    refresh("Team toegevoegd");
  };
}

if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
init();
</script>
</body>
</html>

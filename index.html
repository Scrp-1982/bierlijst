async function analyzeUntappd(file) {
  const box = $("#utResult");
  box.innerHTML = `<div class="panel"><p class="muted">Bestand lezen en vergelijken met de database…</p></div>`;
  try {
    if (typeof Papa === "undefined") throw new Error("De CSV-lezer kon niet worden geladen. Ververs de pagina.");
    const { rows, headers } = await readCsvFile(file);
    if (!headers.includes("beer_name") || !headers.includes("checkin_id")) throw new Error("Dit lijkt geen Untappd-export te zijn: de kolommen beer_name en checkin_id ontbreken.");

    // Wat staat er al?
    const done = new Set();
    for (let from = 0; ; from += 1000) {
      const { data, error } = await sb.from("checkins").select("untappd_checkin_id").eq("user_id", state.user.id).not("untappd_checkin_id", "is", null).range(from, from + 999);
      if (error) throw new Error(error.message.includes("untappd_checkin_id") ? "Draai eerst update 09_untappd.sql in Supabase." : error.message);
      data.forEach(r => done.add(String(r.untappd_checkin_id)));
      if (data.length < 1000) break;
    }
    const beers = await fetchAllBeers();
    const byUntappd = new Map(beers.filter(b => b.untappd_id).map(b => [String(b.untappd_id), b]));
    const dbT = beers.map(b => ({ b, bt: utToks(b.brewery || ""), nt: utToks(b.name) }));

    const todo = rows.filter(r => r.checkin_id && !done.has(String(r.checkin_id)));
    const haveLookup = await loadTzLookup();
    assignUntappdTimezones(todo, haveLookup);
    const tzCount = {};
    for (const r of todo) tzCount[r._tz] = (tzCount[r._tz] || 0) + 1;
    const groups = new Map();
    for (const r of todo) {
      if (!groups.has(r.bid)) groups.set(r.bid, { bid: r.bid, name: r.beer_name, brewery: r.brewery_name, type: r.beer_type, abv: r.beer_abv, country: r.brewery_country, rows: [] });
      groups.get(r.bid).rows.push(r);
    }
    const plan = { known: [], sure: [], maybe: [], fresh: [] };
    for (const g of groups.values()) {
      const hit = byUntappd.get(String(g.bid));
      if (hit) { plan.known.push({ g, beer: hit }); continue; }
      const u = { bt: utToks(g.brewery || ""), nts: utNameVariants(g.name).map(utToks) };
      let best = null, score = 0;
      for (const d of dbT) { const s = untappdScore(u, d); if (s > score) { score = s; best = d.b; if (s >= 1) break; } }
      if (score >= 1) plan.sure.push({ g, beer: best });
      else if (score >= 0.5) plan.maybe.push({ g, beer: best });
      else plan.fresh.push({ g });
    }
    const photos = todo.filter(r => /^https:\/\//.test(r.photo_url || "")).length;
    const editor = !!(state.me?.is_admin || state.me?.is_db_editor);
    const pairRow = (p, i, list, checked) => `
      <div class="pair ${checked ? "on" : ""}">
        <label class="pair-main">
          <input type="checkbox" data-list="${list}" data-i="${i}" ${checked ? "checked" : ""}>
          <span><b>${esc(p.g.name)}</b> <span class="muted small">${esc(p.g.brewery)}</span><br>
          <span class="small">is in de database: <b>${esc(p.beer.name)}</b> <span class="muted">${esc(p.beer.brewery || "")}</span></span></span>
        </label>
        ${editor ? `<label class="pair-over small" ${checked ? "" : "hidden"}>
          <input type="checkbox" data-over="${list}" data-i="${i}">
          <span>Gegevens van Untappd overnemen: wordt <b>${esc(cleanUntappdName(p.g.name))}</b>, ${esc(p.g.brewery)}, ${esc(mapUntappdStyle(p.g.type) || "")}, ${esc(p.g.abv)}%</span>
        </label>` : ""}
      </div>`;

    box.innerHTML = `
      <div class="stack">
        <div class="panel">
          <ul class="import-sum">
            <li><b>${todo.length}</b> check-ins om te importeren${rows.length - todo.length ? ` (${rows.length - todo.length} stonden er al in)` : ""}</li>
            <li><b>${groups.size}</b> verschillende bieren, waarvan:</li>
            <li style="list-style:none;margin-left:12px">${plan.known.length + plan.sure.length} herkend in de database, ${plan.maybe.length} twijfelgevallen, ${plan.fresh.length} nieuw</li>
            <li>Tijden zoals ze daar waren, in ${Object.keys(tzCount).length === 1 ? "één tijdzone" : Object.keys(tzCount).length + " tijdzones"}: ${Object.entries(tzCount).sort((a, b) => b[1] - a[1]).map(([z, n]) => `${esc(z.split("/").pop().replace(/_/g, " "))} (${n})`).join(", ")}</li>
          </ul>
          ${haveLookup ? "" : `<p class="small error" style="margin-top:8px">De tijdzones konden niet worden bepaald; alle tijden worden als Nederlandse tijd opgeslagen.</p>`}
          ${editor ? `<p class="muted small" style="margin-top:8px">Bij herkende bieren worden lege velden (stijl, alcohol, land) automatisch aangevuld met de gegevens van Untappd. Bestaande gegevens blijven staan, tenzij je bij een bier “Gegevens van Untappd overnemen” aanvinkt.</p>` : ""}
        </div>
        ${plan.maybe.length ? `
          <div class="panel stack">
            <h2>Twijfelgevallen (${plan.maybe.length})</h2>
            <p class="muted small">Deze lijken op een bier in de database, maar het is niet zeker. Vink aan wat écht hetzelfde bier is. Niet aangevinkt wordt een nieuw bier.</p>
            <div class="pairs">${plan.maybe.map((p, i) => pairRow(p, i, "maybe", false)).join("")}</div>
          </div>` : ""}
        ${plan.sure.length ? `
          <details class="panel">
            <summary><b>Automatisch herkend (${plan.sure.length})</b></summary>
            <p class="muted small" style="margin-top:8px">Naam en brouwerij komen overeen. Haal een vinkje weg als het toch een ander bier is.</p>
            <div class="pairs">${plan.sure.map((p, i) => pairRow(p, i, "sure", true)).join("")}</div>
          </details>` : ""}
        ${plan.fresh.length ? `
          <details class="panel">
            <summary><b>Nieuw voor de database (${plan.fresh.length})</b></summary>
            <div class="table-scroll" style="margin-top:8px"><table class="preview">
              <thead><tr><th>Naam</th><th>Brouwerij</th><th>Stijl</th><th>Alc.</th><th>Land</th></tr></thead>
              <tbody>${plan.fresh.map(p => `<tr><td>${esc(p.g.name)}</td><td>${esc(p.g.brewery)}</td><td>${esc(mapUntappdStyle(p.g.type))}</td><td>${esc(p.g.abv)}%</td><td>${esc(normCountry(p.g.country)?.name || "")}</td></tr>`).join("")}</tbody>
            </table></div>
          </details>` : ""}
        ${photos ? `<label class="switch panel"><span><b>Foto’s overnemen (${photos})</b><br><span class="muted small">De app probeert je Untappd-foto’s te kopiëren en te verkleinen. Lukt dat niet, dan wordt naar de foto bij Untappd gelinkt.</span></span><input type="checkbox" id="utPhotos" checked></label>` : ""}
        ${todo.length ? `<button class="btn block" type="button" id="utGo">Importeren</button>` : `<p class="muted">Er is niets nieuws om te importeren.</p>`}
        <div id="utProgress" class="panel stack" hidden><span class="bar"><span style="width:0%"></span></span><p class="muted small"></p></div>
      </div>`;

    box.onchange = e => {
      const cb = e.target.closest("[data-list]");
      if (!cb) return;
      const pair = cb.closest(".pair");
      pair.classList.toggle("on", cb.checked);
      const over = pair.querySelector(".pair-over");
      if (over) { over.hidden = !cb.checked; if (!cb.checked) over.querySelector("input").checked = false; }
    };
    const go = $("#utGo");
    if (go) go.onclick = () => {
      const isOn = (attr, list, i) => !!document.querySelector(`[${attr}="${list}"][data-i="${i}"]`)?.checked;
      const pick = list => plan[list].map((p, i) => ({ ...p, over: isOn("data-over", list, i) })).filter((p, i) => isOn("data-list", list, i));
      const unpick = list => plan[list].filter((p, i) => !isOn("data-list", list, i));
      const matched = [...plan.known, ...pick("sure"), ...pick("maybe")];
      const fresh = [...plan.fresh, ...unpick("sure").map(p => ({ g: p.g })), ...unpick("maybe").map(p => ({ g: p.g }))];
      runUntappdImport(matched, fresh, todo, $("#utPhotos") ? $("#utPhotos").checked : false);
    };
  } catch (err) {
    box.innerHTML = `<div class="panel"><p class="error">${esc(err.message || err)}</p></div>`;
  }
}

async function runUntappdImport(matched, fresh, todo, withPhotos) {
  $("#utGo").disabled = true;
  document.querySelectorAll("#utResult input").forEach(i => i.disabled = true);
  const prog = $("#utProgress"); prog.hidden = false;
  const bar = prog.querySelector(".bar > span"), txt = prog.querySelector("p");
  const step = (label, done, total) => { bar.style.width = `${Math.round(done / Math.max(1, total) * 100)}%`; txt.textContent = `${label}: ${done} van ${total}`; };
  const result = { photosCopied: 0, photosLinked: 0, beersNew: 0, beersLinked: 0, checkins: 0, failed: 0 };

  try {
    // 1. Foto's: kopiëren en verkleinen, en anders linken
    const photoOf = new Map();
    if (withPhotos) {
      const list = todo.filter(r => /^https:\/\//.test(r.photo_url || ""));
      let canCopy = true, n = 0;
      for (const r of list) {
        let path = r.photo_url;
        if (canCopy) {
          try {
            const res = await fetch(r.photo_url, { mode: "cors" });
            if (!res.ok) throw new Error(String(res.status));
            path = await uploadPhoto(await res.blob());
            result.photosCopied++;
          } catch (ex) {
            if (ex instanceof TypeError) canCopy = false;   // geblokkeerd door de browser: voortaan linken
            result.photosLinked++;
          }
        } else result.photosLinked++;
        photoOf.set(String(r.checkin_id), path);
        step("Foto’s verwerken", ++n, list.length);
      }
    }

    // 2. Nieuwe bieren toevoegen
    const beerOfBid = new Map(matched.map(p => [String(p.g.bid), p.beer.id]));
    for (let i = 0; i < fresh.length; i += 100) {
      const chunk = fresh.slice(i, i + 100).map(({ g }) => {
        const firstPhoto = g.rows.map(r => photoOf.get(String(r.checkin_id))).find(Boolean) || null;
        const abv = parseFloat(g.abv);
        return {
          name: cleanUntappdName(g.name), brewery: g.brewery || null, style: mapUntappdStyle(g.type),
          abv: isFinite(abv) ? abv : null, country: normCountry(g.country)?.name || null,
          untappd_id: Number(g.bid) || null, image_path: firstPhoto, source: "untappd",
        };
      });
      const { data, error } = await sb.from("beers").insert(chunk).select("id, untappd_id");
      if (error) throw new Error("Bieren toevoegen lukte niet: " + error.message);
      data.forEach(b => beerOfBid.set(String(b.untappd_id), b.id));
      result.beersNew += data.length;
      step("Nieuwe bieren toevoegen", Math.min(i + 100, fresh.length), fresh.length);
    }

    // 3. Herkende bieren: Untappd-nummer vastleggen, lege velden aanvullen
    //    en, als dat is aangevinkt, de gegevens van Untappd overnemen
    const editor = !!(state.me?.is_admin || state.me?.is_db_editor);
    const patches = matched.map(p => {
      const abv = parseFloat(p.g.abv);
      const ut = {
        name: cleanUntappdName(p.g.name), brewery: p.g.brewery || null, style: mapUntappdStyle(p.g.type),
        abv: isFinite(abv) ? abv : null, country: normCountry(p.g.country)?.name || null,
      };
      const patch = {};
      if (!p.beer.untappd_id) patch.untappd_id = Number(p.g.bid);
      if (editor) {
        if (p.over) {
          for (const k of ["name", "brewery", "style", "abv", "country"]) if (ut[k] != null && ut[k] !== "" && String(ut[k]) !== String(p.beer[k] ?? "")) patch[k] = ut[k];
        } else {
          for (const k of ["style", "abv", "country"]) if ((p.beer[k] == null || p.beer[k] === "") && ut[k] != null && ut[k] !== "") patch[k] = ut[k];
        }
      }
      return { p, patch };
    }).filter(x => Object.keys(x.patch).length);
    for (let i = 0; i < patches.length; i += 5) {
      await Promise.all(patches.slice(i, i + 5).map(async ({ p, patch }) => {
        let { error } = await sb.from("beers").update(patch).eq("id", p.beer.id);
        // Lukt het bijwerken niet (bijvoorbeeld door rechten), dan in elk geval het Untappd-nummer
        if (error && patch.untappd_id) ({ error } = await sb.from("beers").update({ untappd_id: patch.untappd_id }).eq("id", p.beer.id));
        if (!error) {
          if (patch.untappd_id) result.beersLinked++;
          if (p.over && Object.keys(patch).some(k => k !== "untappd_id")) result.beersOverwritten = (result.beersOverwritten || 0) + 1;
          else if (Object.keys(patch).some(k => k !== "untappd_id")) result.beersFilled = (result.beersFilled || 0) + 1;
        }
      }));
      step("Bieren koppelen en aanvullen", Math.min(i + 5, patches.length), patches.length);
    }

    // 4. Check-ins aanmaken
    const all = todo.filter(r => beerOfBid.has(String(r.bid))).map(r => {
      const loc = untappdLocation(r);
      const rating = parseFloat(r.rating_score);
      return {
        beer_id: beerOfBid.get(String(r.bid)),
        rating: isFinite(rating) && rating > 0 ? rating : null,
        serving: untappdServing(r.serving_type),
        location_name: loc.name, latitude: loc.lat, longitude: loc.lon,
        drunk_at: r._iso,
        tz: r._tz,
        notes: r.comment ? clampChars(r.comment.trim(), 300) : null,
        photo_path: photoOf.get(String(r.checkin_id)) || null,
        untappd_checkin_id: Number(r.checkin_id),
      };
    });
    for (let i = 0; i < all.length; i += 100) {
      const { data, error } = await sb.from("checkins").upsert(all.slice(i, i + 100), { onConflict: "untappd_checkin_id", ignoreDuplicates: true }).select("id");
      if (error) throw new Error("Check-ins opslaan lukte niet: " + error.message);
      result.checkins += data.length;
      step("Check-ins opslaan", Math.min(i + 100, all.length), all.length);
    }
    result.failed = todo.length - all.length;

    prog.innerHTML = `
      <h2>Klaar. Proost!</h2>
      <ul class="import-sum">
        <li><b>${result.checkins}</b> check-ins geïmporteerd</li>
        <li><b>${result.beersNew}</b> nieuwe bieren toegevoegd, <b>${result.beersLinked}</b> bestaande bieren gekoppeld aan Untappd</li>
        ${result.beersFilled ? `<li><b>${result.beersFilled}</b> ${result.beersFilled === 1 ? "bestaand bier" : "bestaande bieren"} aangevuld met gegevens van Untappd</li>` : ""}
        ${result.beersOverwritten ? `<li><b>${result.beersOverwritten}</b> ${result.beersOverwritten === 1 ? "bestaand bier" : "bestaande bieren"} bijgewerkt met de gegevens van Untappd</li>` : ""}
        ${withPhotos ? `<li><b>${result.photosCopied}</b> foto’s gekopieerd${result.photosLinked ? `, <b>${result.photosLinked}</b> gelinkt naar Untappd` : ""}</li>` : ""}
        ${result.failed ? `<li class="error">${result.failed} check-ins konden niet worden verwerkt</li>` : ""}
      </ul>
      <div style="display:flex;gap:10px;flex-wrap:wrap">
        <a class="btn" href="#lijst">Naar mijn bieren</a>
        <a class="btn soft" href="#badges">Bekijk je badges</a>
      </div>`;
  } catch (err) {
    txt.innerHTML = `<span class="error">${esc(err.message || err)}</span> Wat al is opgeslagen, blijft staan; opnieuw importeren gaat verder waar het bleef.`;
  }
}

const FEED_PAGE = 20;
const feedState = { items: [], done: false, ids: [], scope: (() => { try { return localStorage.getItem("feedScope") || "all"; } catch { return "all"; } })() };

function relTime(iso) {
  const rtf = new Intl.RelativeTimeFormat("nl", { numeric: "auto" });
  const sec = (new Date(iso) - Date.now()) / 1000;
  const units = [["year", 31536000], ["month", 2592000], ["week", 604800], ["day", 86400], ["hour", 3600], ["minute", 60]];
  for (const [u, n] of units) if (Math.abs(sec) >= n) return rtf.format(Math.round(sec / n), u);
  return "zojuist";
}

async function fetchFeed(from) {
  let q = sb
    .from("checkins")
    .select("*, beer:beers(*), profile:profiles!checkins_user_id_fkey(id, display_name, avatar_path), comments(id, body, created_at, user_id, profile:profiles!comments_user_id_fkey(id, display_name, avatar_path)), cheers(user_id, profile:profiles!cheers_user_id_fkey(id, display_name))");
  if (feedState.scope === "friends") q = q.in("user_id", feedState.ids);
  const { data, error } = await q
    .order("drunk_at", { ascending: false })
    .order("id", { ascending: false })
    .order("created_at", { referencedTable: "comments", ascending: true })
    .range(from, from + FEED_PAGE - 1);
  if (error) throw error;
  return data;
}

  return `
    <article class="post" data-post="${c.id}">
      <div class="post-head">
        ${avatarHtml(c.profile, 44)}
        <div>
          <p class="post-title"><b>${esc(c.profile?.display_name || "Iemand")}</b> dronk <a href="#" class="beername" data-open="${c.id}">${esc(b.name || "een bier")}</a></p>
          <p class="post-meta">${esc([b.brewery, b.style].filter(Boolean).join(", "))}</p>
          <p class="post-meta">${relTime(c.drunk_at)}${c.location_name ? `, ${esc(c.location_name)}` : ""}${c.serving ? `, ${esc(c.serving)}` : ""}</p>
        </div>
      </div>
      ${c.rating != null ? `<div class="post-rating">${stars(c.rating)}<b>${nf(c.rating, 2)}</b></div>` : ""}
      ${c.notes ? `<p class="post-notes">${esc(c.notes)}</p>` : ""}
      ${c.photo_path ? `<button type="button" class="post-photo zoomable" data-zoom="${esc(photoUrl(c.photo_path))}" aria-label="Foto groot bekijken"><img src="${esc(photoUrl(c.photo_path))}" alt="Foto van ${esc(b.name || "het bier")}" loading="lazy"></button>` : ""}
      ${cheerHtml(c, mine)}
      <div class="comments">
        ${(c.comments || []).map(cm => `
          <div class="comment">
            ${avatarHtml(cm.profile)}
            <div class="comment-body">
              <b>${esc(cm.profile?.display_name || "Iemand")}</b> <span class="post-meta">${relTime(cm.created_at)}</span>
              <p>${esc(cm.body)}</p>
            </div>
            ${canDel(cm) ? `<button class="comment-del" type="button" data-delcomment="${cm.id}" aria-label="Reactie verwijderen">Verwijderen</button>` : ""}
          </div>`).join("")}
        <form class="comment-form" data-commentform="${c.id}">
          <textarea class="input" name="body" data-limit="50" placeholder="Reageer…" aria-label="Reactie" rows="1"></textarea>
          <button class="btn small" type="submit">Plaatsen</button>
          <span class="char-count">0 / 50</span>
          <div class="emoji-row">${["🍺", "🍻", "👍", "😋", "🔥", "😍", "👌", "🤢"].map(em => `<button type="button" data-emoji="${em}" aria-label="${em} invoegen">${em}</button>`).join("")}</div>
        </form>
      </div>
    </article>`;
}

function cheerHtml(c, mine) {
  const list = c.cheers || [];
  const iCheered = list.some(x => x.user_id === state.user.id);
  const names = list
    .sort((a, b) => (b.user_id === state.user.id) - (a.user_id === state.user.id))
    .map(x => x.user_id === state.user.id ? "Jij" : (x.profile?.display_name || "Iemand"));
  let who = "";
  if (names.length === 1) who = names[0] === "Jij" ? "Jij proost mee" : `${names[0]} proost mee`;
  else if (names.length === 2) who = `${names[0]} en ${names[1]} proosten mee`;
  else if (names.length > 2) who = `${names[0]}, ${names[1]} en ${names.length - 2} ${names.length - 2 === 1 ? "ander" : "anderen"} proosten mee`;
  if (mine && names.length) who = names.length === 1 ? `${names[0]} proost mee` : who;
  const n = list.length;
  return `
    <div class="post-actions">
      ${mine
        ? `<span class="cheer-btn own" title="${n ? `${n} ${n === 1 ? "proost" : "proosts"} ontvangen` : "Nog geen proosts"}" aria-label="${n} proosts ontvangen"><span class="cheer-icon" aria-hidden="true">🍻</span>${n ? `<b>${n}</b>` : ""}</span>`
        : `<button type="button" class="cheer-btn ${iCheered ? "on" : ""}" data-cheer="${c.id}" aria-pressed="${iCheered}" aria-label="${iCheered ? "Proost intrekken" : "Proost"}" title="${iCheered ? "Proost intrekken" : "Proost!"}"><span class="cheer-icon" aria-hidden="true">🍻</span>${n ? `<b>${n}</b>` : ""}</button>`}
      ${who ? `<span class="post-meta">${esc(who)}</span>` : ""}
    </div>`;
}

function rerenderPost(id) {
  const c = feedState.items.find(x => x.id === id);
  const el = document.querySelector(`[data-post="${id}"]`);
  if (c && el) el.outerHTML = postHtml(c);
}

async function renderFeed() {
  setTab("activiteit");
  view().innerHTML = `<div class="loading">Activiteit ophalen…</div>`;
  try {
    feedState.ids = [state.user.id, ...(await friendIds())];
    feedState.items = await fetchFeed(0);
    feedState.done = feedState.items.length < FEED_PAGE;
  } catch (err) {
    view().innerHTML = `<p class="error">Activiteit kon niet worden geladen: ${esc(err.message)}</p>`;
    return;
  }
  view().innerHTML = `
    <div class="stack">
      <h1>Activiteit</h1>
      <div class="auth-tabs" role="tablist" style="max-width:320px">
        <button role="tab" type="button" data-scope="all" aria-selected="${feedState.scope === "all"}">Iedereen</button>
        <button role="tab" type="button" data-scope="friends" aria-selected="${feedState.scope === "friends"}">Vrienden</button>
      </div>
      <p class="muted">${feedState.scope === "all" ? "Alle check-ins van iedereen, de nieuwste bovenaan." : `Jij en ${feedState.ids.length - 1} ${feedState.ids.length - 1 === 1 ? "vriend" : "vrienden"}`}</p>
      ${feedState.items.length ? `<div class="feed" id="feed">${feedState.items.map(postHtml).join("")}</div>
        <button class="btn ghost block" id="moreBtn" type="button" ${feedState.done ? "hidden" : ""}>Meer laden</button>`
      : `<div class="panel empty">${glassSvg("var(--line)")}<h2>Nog geen activiteit</h2><p class="muted">${feedState.scope === "all" ? "Nog niemand heeft iets ingecheckt." : "Hier zie je je eigen check-ins en die van je vrienden."}</p><p style="margin-top:16px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap"><a class="btn" href="#inchecken">Bier inchecken</a><a class="btn ghost" href="#vrienden">Vrienden zoeken</a></p></div>`}
    </div>`;

  view().querySelectorAll("[data-scope]").forEach(b => b.onclick = () => {
    feedState.scope = b.dataset.scope;
    try { localStorage.setItem("feedScope", feedState.scope); } catch {}
    renderFeed();
  });
  const more = $("#moreBtn");
  if (more) more.onclick = async () => {
    more.disabled = true;
    try {
      const next = await fetchFeed(feedState.items.length);
      feedState.items.push(...next);
      feedState.done = next.length < FEED_PAGE;
      $("#feed").insertAdjacentHTML("beforeend", next.map(postHtml).join(""));
    } catch (err) { toast("Laden lukte niet: " + err.message); }
    more.disabled = false;
    more.hidden = feedState.done;
  };

  // Emoji-knop: textarea houdt de focus, emoji komt op de cursorpositie
  view().onpointerdown = e => { if (e.target.closest("[data-emoji]")) e.preventDefault(); };

  view().onsubmit = async e => {
    const form = e.target.closest("[data-commentform]");
    if (!form) return;
    e.preventDefault();
    const body = clampChars(form.body.value.trim(), 50);
    if (!body) return;
    const btn = form.querySelector("button");
    btn.disabled = true;
    const { data, error } = await sb
      .from("comments")
      .insert({ checkin_id: form.dataset.commentform, body })
      .select("id, body, created_at, user_id, profile:profiles!comments_user_id_fkey(id, display_name, avatar_path)")
      .single();
    if (error) { btn.disabled = false; return toast("Plaatsen lukte niet: " + error.message); }
    const c = feedState.items.find(x => x.id === form.dataset.commentform);
    (c.comments ||= []).push(data);
    rerenderPost(c.id);
  };

  view().onclick = async e => {
    const em = e.target.closest("[data-emoji]");
    if (em) {
      const ta = em.closest("form").body;
      const start = ta.selectionStart ?? ta.value.length, end = ta.selectionEnd ?? ta.value.length;
      const next = ta.value.slice(0, start) + em.dataset.emoji + ta.value.slice(end);
      if (charCount(next) > 50) return toast("Maximaal 50 tekens.");
      ta.value = next;
      const pos = start + em.dataset.emoji.length;
      ta.focus(); ta.setSelectionRange(pos, pos);
      ta.dispatchEvent(new Event("input", { bubbles: true }));
      return;
    }
    const ch = e.target.closest("[data-cheer]");
    if (ch) {
      const c = feedState.items.find(x => x.id === ch.dataset.cheer);
      const on = (c.cheers || []).some(x => x.user_id === state.user.id);
      ch.disabled = true;
      const { error } = on
        ? await sb.from("cheers").delete().eq("checkin_id", c.id).eq("user_id", state.user.id)
        : await sb.from("cheers").insert({ checkin_id: c.id });
      if (error) { ch.disabled = false; return toast("Proosten lukte niet: " + error.message); }
      c.cheers = on
        ? c.cheers.filter(x => x.user_id !== state.user.id)
        : [...(c.cheers || []), { user_id: state.user.id, profile: { display_name: state.me?.display_name } }];
      rerenderPost(c.id);
      if (!on) document.querySelector(`[data-cheer="${c.id}"]`)?.classList.add("pop");
      return;
    }
    const open = e.target.closest("[data-open]");
    if (open) {
      e.preventDefault();
      const c = feedState.items.find(x => x.id === open.dataset.open);
      if (c?.beer) showBeer({ beer: c.beer, checkins: [c], avg: c.rating, photo: c.photo_path || c.beer.image_path }, { own: c.user_id === state.user.id });
      return;
    }
    const del = e.target.closest("[data-delcomment]");
    if (del) {
      if (!confirm("Deze reactie verwijderen?")) return;
      const { error } = await sb.from("comments").delete().eq("id", del.dataset.delcomment);
      if (error) return toast("Verwijderen lukte niet: " + error.message);
      const post = feedState.items.find(x => (x.comments || []).some(cm => cm.id === del.dataset.delcomment));
      post.comments = post.comments.filter(cm => cm.id !== del.dataset.delcomment);
      rerenderPost(post.id);
    }
  };
}

const initial = n => esc((n || "?").trim()[0]?.toUpperCase() || "?");

async function fetchFriendships() {
  const { data, error } = await sb
    .from("friendships")
    .select("*, req:profiles!friendships_requester_fkey(id, display_name, avatar_path), adr:profiles!friendships_addressee_fkey(id, display_name, avatar_path)");
  if (error) throw error;
  return data || [];
}
async function friendIds() {
  try {
    const rows = await fetchFriendships();
    return rows.filter(r => r.status === "accepted").map(r => r.requester === state.user.id ? r.addressee : r.requester);
  } catch { return []; }
}

async function renderFriends() {
  setTab("vrienden");
  view().innerHTML = `<div class="loading">Vrienden ophalen…</div>`;
  let rows, people, counts;
  try {
    const [fr, { data: ppl }, { data: cks }] = await Promise.all([
      fetchFriendships(),
      sb.from("profiles").select("id, display_name, avatar_path").neq("id", state.user.id).order("display_name"),
      sb.from("checkins").select("user_id, beer_id"),
    ]);
    rows = fr; people = ppl || [];
    counts = {};
    for (const r of cks || []) (counts[r.user_id] ||= new Set()).add(r.beer_id);
  } catch (err) {
    view().innerHTML = `<p class="error">Vrienden konden niet worden geladen: ${esc(err.message)}</p>`;
    return;
  }
  const me = state.user.id;
  const relation = {};
  for (const r of rows) {
    const other = r.requester === me ? r.addressee : r.requester;
    relation[other] = r.status === "accepted" ? "friend" : (r.requester === me ? "sent" : "received");
  }
  const byRel = rel => people.filter(p => relation[p.id] === rel);
  const friends = byRel("friend"), received = byRel("received"), sent = byRel("sent");
  const others = people.filter(p => !relation[p.id]);
  const uniq = id => `${counts[id]?.size || 0} unieke bieren`;

  const row = (p, actions, link) => `
    <div class="person">
      ${link ? `<a href="#u/${p.id}" class="person-link">` : `<span class="person-link">`}
        ${avatarHtml(p)}
        <span class="grow"><b>${esc(p.display_name || "Naamloos")}</b><br><span class="muted small">${uniq(p.id)}</span></span>
      ${link ? `</a>` : `</span>`}
      <span class="person-actions">${actions}</span>
    </div>`;

  view().innerHTML = `
    <div class="stack">
      <h1>Vrienden</h1>

      ${received.length ? `
        <section class="stack">
          <h2>Vriendschapsverzoeken</h2>
          <div class="people">${received.map(p => row(p, `
            <button class="btn small" data-accept="${p.id}">Accepteren</button>
            <button class="btn ghost small" data-remove="${p.id}" data-confirm="Verzoek van ${esc(p.display_name)} afwijzen?">Afwijzen</button>`)).join("")}</div>
        </section>` : ""}

      <section class="stack">
        <h2>Je vrienden</h2>
        ${friends.length
          ? `<div class="people">${friends.map(p => row(p, `<button class="btn ghost small" data-remove="${p.id}" data-confirm="${esc(p.display_name)} verwijderen als vriend?">Verwijderen</button>`, true)).join("")}</div>`
          : `<p class="muted">Je hebt nog geen vrienden. Stuur hieronder een verzoek aan een ander lid. In Activiteit zie je alleen je eigen check-ins en die van je vrienden.</p>`}
      </section>

      ${sent.length ? `
        <section class="stack">
          <h2>Verstuurde verzoeken</h2>
          <div class="people">${sent.map(p => row(p, `<button class="btn ghost small" data-remove="${p.id}">Intrekken</button>`)).join("")}</div>
        </section>` : ""}

      <section class="stack">
        <h2>Andere leden</h2>
        ${others.length ? `
          <input class="input" type="search" id="memberFilter" placeholder="Zoek een lid op naam" aria-label="Lid zoeken">
          <div class="people" id="memberList">${others.map(p => `<div data-name="${esc((p.display_name || "").toLowerCase())}">${row(p, `<button class="btn soft small" data-request="${p.id}">Vriend toevoegen</button>`)}</div>`).join("")}</div>`
        : `<p class="muted">Er zijn geen andere leden die je nog kunt toevoegen.</p>`}
      </section>
    </div>`;

  const filter = $("#memberFilter");
  if (filter) filter.oninput = () => {
    const q = filter.value.trim().toLowerCase();
    document.querySelectorAll("#memberList > [data-name]").forEach(el => el.hidden = q && !el.dataset.name.includes(q));
  };

  view().onclick = async e => {
    const btn = e.target.closest("[data-request], [data-accept], [data-remove]");
    if (!btn) return;
    if (btn.dataset.confirm && !confirm(btn.dataset.confirm)) return;
    btn.disabled = true;
    let error;
    if (btn.dataset.request) {
      ({ error } = await sb.from("friendships").insert({ addressee: btn.dataset.request }));
      if (error?.code === "23505") error = { message: "Er loopt al een verzoek tussen jullie. Ververs de pagina." };
      if (!error) toast("Vriendschapsverzoek verstuurd");
    } else if (btn.dataset.accept) {
      ({ error } = await sb.from("friendships").update({ status: "accepted", accepted_at: new Date().toISOString() })
        .eq("requester", btn.dataset.accept).eq("addressee", me));
      if (!error) toast("Jullie zijn nu vrienden. Proost!");
    } else {
      const other = btn.dataset.remove;
      ({ error } = await sb.from("friendships").delete()
        .or(`and(requester.eq.${me},addressee.eq.${other}),and(requester.eq.${other},addressee.eq.${me})`));
      if (!error) toast("Bijgewerkt");
    }
    if (error) { btn.disabled = false; return toast("Dat lukte niet: " + error.message); }
    renderFriends();
  };
}

function tempPassword() {
  const chars = "abcdefghjkmnpqrstuvwxyzABCDEFGHJKMNPQRSTUVWXYZ23456789";
  const arr = crypto.getRandomValues(new Uint32Array(10));
  return [...arr].map(n => chars[n % chars.length]).join("");
}

async function renderAdmin() {
  setTab("beheer");
  if (!state.me?.is_admin) { view().innerHTML = `<p class="error">Deze pagina is alleen voor beheerders.</p>`; return; }
  view().innerHTML = `<div class="loading">Gebruikers ophalen…</div>`;
  const [{ data: users, error: uErr }, { data: invites }, { data: profs }] = await Promise.all([
    sb.rpc("admin_list_users"),
    sb.from("invites").select("*").order("created_at", { ascending: false }),
    sb.from("profiles").select("id, display_name, avatar_path"),
  ]);
  const profById = Object.fromEntries((profs || []).map(p => [p.id, p]));
  const open = (invites || []).filter(i => !i.accepted_at);

  view().innerHTML = `
    <div class="stack">
      <h1>Beheer</h1>

      <form class="panel stack" id="inviteForm">
        <h2>Iemand uitnodigen</h2>
        <p class="muted small">Na het uitnodigen opent je mailprogramma met een kant-en-klaar bericht. De persoon maakt daarna een account met precies dit e-mailadres.</p>
        <label class="field"><span>E-mailadres</span><input class="input" type="email" name="email" required autocomplete="off"></label>
        <button class="btn" type="submit">Uitnodigen</button>
      </form>

      ${open.length ? `
        <div class="panel">
          <h2>Openstaande uitnodigingen</h2>
          ${open.map(i => `
            <div class="checkin-item">
              <div><b>${esc(i.email)}</b><br><span class="muted small">Uitgenodigd op ${fmtDate(i.created_at)}</span></div>
              <button class="btn ghost small" data-revoke="${esc(i.email)}">Intrekken</button>
            </div>`).join("")}
        </div>` : ""}

      <div class="panel">
        <h2>Gebruikers</h2>
        ${uErr ? `<p class="error">Gebruikers konden niet worden geladen: ${esc(uErr.message)}</p>` : (users || []).map(u => {
          const me = u.id === state.user.id;
          const name = esc(u.display_name || u.email);
          return `
          <div class="user-row">
            <div class="user-info">
              ${avatarHtml(profById[u.id] || u)}
              <div>
                <b>${esc(u.display_name || "Naamloos")}</b>${me ? ` <span class="muted small">(jij)</span>` : ""}<br>
                <span class="muted small">${esc(u.email)}</span><br>
                <span class="small ${u.is_blocked ? "error" : "muted"}">${u.is_blocked ? "Geblokkeerd" : u.last_sign_in_at ? "Laatst ingelogd " + fmtDate(u.last_sign_in_at) : "Nog niet ingelogd"}</span>
              </div>
            </div>
            <div class="role-switches">
              <label class="switch admin-switch">
                <span>Beheerder</span>
                <input type="checkbox" data-admin="${u.id}" ${u.is_admin ? "checked" : ""} ${u.is_blocked ? "disabled" : ""}>
              </label>
              <label class="switch admin-switch" title="Mag alle gegevens in de bierdatabase wijzigen">
                <span>Database</span>
                <input type="checkbox" data-dbeditor="${u.id}" ${u.is_db_editor || u.is_admin ? "checked" : ""} ${u.is_admin || u.is_blocked ? "disabled" : ""}>
              </label>
            </div>
            ${me ? "" : `
            <div class="user-actions">

  view().onclick = async e => {
    const bl = e.target.closest("[data-block]");
    if (bl) {
      const block = bl.dataset.blocked !== "true";
      if (block && !confirm(`${bl.dataset.name} blokkeren? Deze persoon kan dan niet meer inloggen. Gegevens blijven bewaard.`)) return;
      bl.disabled = true;
      const { error } = await sb.rpc("admin_set_blocked", { target: bl.dataset.block, blocked: block });
      if (error) { bl.disabled = false; return toast(error.message); }
      toast(block ? "Gebruiker geblokkeerd" : "Gebruiker gedeblokkeerd");
      return renderAdmin();
    }
    const rm = e.target.closest("[data-remove]");
    if (rm) {
      if (!confirm(`${rm.dataset.name} definitief verwijderen? Alle check-ins en foto's van deze persoon worden gewist. Dit kan niet ongedaan worden gemaakt.`)) return;
      rm.disabled = true;
      try {
        const id = rm.dataset.remove;
        const { data: files } = await sb.storage.from("photos").list(id, { limit: 1000 });
        if (files && files.length) await sb.storage.from("photos").remove(files.map(f => `${id}/${f.name}`));
      } catch { /* foto's opruimen is een bonus; verwijderen gaat door */ }
      const { error } = await sb.rpc("admin_delete_user", { target: rm.dataset.remove });
      if (error) { rm.disabled = false; return toast(error.message); }
      toast("Gebruiker verwijderd");
      return renderAdmin();
    }
    const rv = e.target.closest("[data-revoke]");
    if (rv) {
      const { error } = await sb.from("invites").delete().eq("email", rv.dataset.revoke);
      if (error) return toast("Intrekken lukte niet: " + error.message);
      toast("Uitnodiging ingetrokken"); return renderAdmin();
    }
    const rs = e.target.closest("[data-reset]");
    if (rs) {
      const pw = tempPassword();
      openDialog(`
        <div class="stack">
          <h2>Wachtwoord resetten</h2>
          <p>Nieuw tijdelijk wachtwoord voor <b>${esc(rs.dataset.name)}</b>:</p>
          <input class="input" id="tmpPw" value="${pw}" readonly style="font-size:1.3rem;font-weight:700;letter-spacing:.05em">
          <p class="muted small">Geef dit wachtwoord door. Bij de volgende keer inloggen moet een nieuw wachtwoord worden gekozen.</p>
          <div style="display:flex;gap:10px;flex-wrap:wrap">
            <button class="btn" id="doReset" type="button">Wachtwoord instellen</button>
            <button class="btn ghost" id="copyPw" type="button">Kopiëren</button>
          </div>
        </div>`);
      $("#copyPw").onclick = async () => { try { await navigator.clipboard.writeText(pw); toast("Gekopieerd"); } catch { $("#tmpPw").select(); } };
      $("#doReset").onclick = async () => {
        $("#doReset").disabled = true;
        const { error } = await sb.rpc("admin_set_password", { target: rs.dataset.reset, new_password: pw });
        if (error) { $("#doReset").disabled = false; return toast("Resetten lukte niet: " + error.message); }
        $("#doReset").textContent = "Ingesteld";
        toast("Tijdelijk wachtwoord ingesteld");
      };
    }
  };
}

// ---------------------------------------------------------------------
// Wachtwoord wijzigen
// ---------------------------------------------------------------------
function passwordForm(forced, inFold = false) {
  return `
    <form class="${inFold ? "" : "panel "}stack" id="pwForm">
      ${inFold ? "" : `<h2>${forced ? "Kies een nieuw wachtwoord" : "Wachtwoord wijzigen"}</h2>`}
      ${forced ? `<p class="muted">Je bent ingelogd met een tijdelijk wachtwoord. Kies een eigen wachtwoord om verder te gaan.</p>` : ""}
      ${forced ? "" : `<label class="field"><span>Huidig wachtwoord</span><input class="input" type="password" name="current" autocomplete="current-password" required></label>`}
      <label class="field"><span>Nieuw wachtwoord</span><input class="input" type="password" name="pw1" minlength="8" autocomplete="new-password" required></label>
      <label class="field"><span>Nieuw wachtwoord herhalen</span><input class="input" type="password" name="pw2" minlength="8" autocomplete="new-password" required></label>
      <p class="error" id="pwErr" hidden></p>
      <button class="btn" type="submit">Wachtwoord opslaan</button>
    </form>`;
}
function bindPasswordForm(forced) {
  $("#pwForm").onsubmit = async e => {
    e.preventDefault();
    const f = new FormData(e.target);
    const err = $("#pwErr");
    const btn = e.target.querySelector("button[type=submit]");
    const fail = m => { err.textContent = m; err.hidden = false; btn.disabled = false; };
    err.hidden = true; btn.disabled = true;
    const pw1 = String(f.get("pw1")), pw2 = String(f.get("pw2"));
    if (pw1.length < 8) return fail("Het nieuwe wachtwoord moet minstens 8 tekens hebben.");
    if (pw1 !== pw2) return fail("De twee nieuwe wachtwoorden zijn niet gelijk.");
    if (!forced) {
      const { error } = await sb.auth.signInWithPassword({ email: state.user.email, password: String(f.get("current")) });
      if (error) return fail("Je huidige wachtwoord klopt niet.");
    }
    const { error } = await sb.auth.updateUser({ password: pw1 });
    if (error) return fail(/different|same/i.test(error.message) ? "Kies een ander wachtwoord dan je huidige." : "Opslaan lukte niet: " + error.message);
    await sb.from("profiles").update({ must_change_password: false }).eq("id", state.user.id);
    if (state.me) state.me.must_change_password = false;
    toast("Wachtwoord gewijzigd");
    if (forced) { location.hash = "lijst"; route(); } else e.target.reset(), (btn.disabled = false);
  };
}
function renderForcedPassword() {
  setTab(null);
  setNav(false);
  view().innerHTML = `<div class="auth stack">${passwordForm(true)}<button class="btn ghost" id="logoutBtn2" type="button">Uitloggen</button></div>`;
  bindPasswordForm(true);
  $("#logoutBtn2").onclick = () => sb.auth.signOut();
}

// ---------------------------------------------------------------------
// Profiel en export
// ---------------------------------------------------------------------
// Welke onderdelen van het profiel open staan (blijft zo na opslaan)
const profileOpen = new Set();

function renderProfile() {
  setTab("profiel");
  const p = state.me || {};
  const publicLink = p.username ? `${SITE_URL}?u=${encodeURIComponent(p.username)}` : "";
  const fold = (key, title, hint, body) => `
      <details class="panel fold" data-fold="${key}" ${profileOpen.has(key) ? "open" : ""}>
        <summary>
          <span><b class="fold-title">${title}</b>${hint ? `<br><span class="muted small">${hint}</span>` : ""}</span>
          <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
        </summary>
        <div class="fold-body stack">${body}</div>
      </details>`;
  view().innerHTML = `
    <div class="stack">
      <h1>Profiel</h1>
      <div class="panel avatar-edit">
        ${avatarHtml(p, 72)}
        <div class="stack" style="--gap:8px">
          <div><b style="font-size:1.15rem">${esc(p.display_name || "")}</b><br><span class="muted small">${esc(state.user?.email || "")}</span></div>
          <div style="display:flex;gap:8px;flex-wrap:wrap">
            <label class="btn soft small" style="cursor:pointer">
              <input type="file" accept="image/*" id="avatarInput" hidden>
              ${p.avatar_path ? "Andere foto" : "Profielfoto kiezen"}
            </label>
            ${p.avatar_path ? `<button class="btn ghost small" id="avatarRemove" type="button">Foto verwijderen</button>` : ""}
          </div>
        </div>
      </div>

      ${fold("gegevens", "Profielgegevens", "Naam, gebruikersnaam, over jou en je openbare lijst", `
        <form class="stack" id="profileForm">
          <label class="field"><span>Naam</span><input class="input" name="display_name" value="${esc(p.display_name)}" required></label>
          <label class="field"><span>Gebruikersnaam</span><input class="input" name="username" value="${esc(p.username)}" placeholder="bijv. mike_bier" pattern="[a-z0-9_]{3,30}" autocapitalize="off"></label>
          <p class="muted small">Kleine letters, cijfers en _, 3 tot 30 tekens. Nodig voor je openbare link.</p>
          <label class="field"><span>Over jou</span><textarea class="input" name="bio" maxlength="500" placeholder="Favoriete stijl, vaste kroeg…">${esc(p.bio)}</textarea></label>
          <label class="switch">
            <span><b>Openbare lijst</b><br><span class="muted small">Iedereen met de link kan je bieren zien, ook zonder account.</span></span>
            <input type="checkbox" name="is_public" ${p.is_public ? "checked" : ""}>
          </label>
          <button class="btn" type="submit">Profiel opslaan</button>
        </form>
        ${p.is_public && publicLink ? `
          <div class="stack" style="border-top:1px solid var(--line);padding-top:14px">
            <b>Je openbare link</b>
            <input class="input" readonly value="${esc(publicLink)}" id="pubLink">
            <div style="display:flex;gap:10px;flex-wrap:wrap">
              <button class="btn" id="copyLink" type="button">Link kopiëren</button>
              <a class="btn ghost" href="${esc(publicLink)}" target="_blank" rel="noopener">Bekijken</a>
            </div>
          </div>` : p.is_public ? `<p class="muted">Kies een gebruikersnaam om je openbare link te krijgen.</p>` : ""}`)}

      ${fold("wachtwoord", "Wachtwoord wijzigen", "", passwordForm(false, true))}

      ${p.is_admin ? fold("beheer", "Beheer", "Gebruikers, uitnodigingen en rechten", `
        <a class="btn soft" href="#beheer">Naar beheer</a>
        <a class="btn soft" href="#controleren">Wijzigingen controleren</a>`) : ""}

      ${fold("untappd", "Untappd importeren", "Je check-ins uit een Untappd-export overzetten", `
        <a class="btn soft" href="#untappd">Untappd-export importeren</a>`)}

      ${fold("export", "Exporteren", "Je check-ins downloaden als CSV of JSON", `
        <p class="muted small">Download al je check-ins met de biergegevens. CSV opent direct in Excel.</p>
        <div style="display:flex;gap:10px;flex-wrap:wrap">
          <button class="btn soft" id="csvBtn" type="button">Download CSV</button>
          <button class="btn soft" id="jsonBtn" type="button">Download JSON</button>
        </div>`)}

      <button class="btn ghost" id="logoutBtn" type="button">Uitloggen</button>
      <p class="muted small" style="text-align:center">Versie ${APP_VERSION}</p>
    </div>`;
  view().querySelectorAll("details.fold").forEach(d => d.addEventListener("toggle", () => {
    if (d.open) profileOpen.add(d.dataset.fold); else profileOpen.delete(d.dataset.fold);
  }));

  $("#profileForm").onsubmit = async e => {
    e.preventDefault();
    const f = new FormData(e.target);
    const username = String(f.get("username") || "").trim().toLowerCase() || null;
    if (username && !/^[a-z0-9_]{3,30}$/.test(username)) return toast("Gebruikersnaam: alleen kleine letters, cijfers en _, 3 tot 30 tekens.");
    const update = {
      display_name: String(f.get("display_name")).trim(),
      username,
      bio: String(f.get("bio") || "").trim() || null,
      is_public: f.get("is_public") === "on",
    };
    const { data, error } = await sb.from("profiles").update(update).eq("id", state.user.id).select().single();
    if (error) return toast(error.code === "23505" ? "Deze gebruikersnaam is al bezet." : "Opslaan lukte niet: " + error.message);
    state.me = data; toast("Profiel opgeslagen"); renderProfile();
  };
  const copy = $("#copyLink");
  if (copy) copy.onclick = async () => {
    try { await navigator.clipboard.writeText($("#pubLink").value); toast("Link gekopieerd"); }
    catch { $("#pubLink").select(); toast("Selecteer en kopieer de link"); }
  };
  bindPasswordForm(false);

  const oldAvatar = p.avatar_path;
  const removeOld = async () => {
    if (oldAvatar && oldAvatar.startsWith(state.user.id + "/")) await sb.storage.from("photos").remove([oldAvatar]);
  };
  $("#avatarInput").onchange = async e => {
    const file = e.target.files[0];
    if (!file) return;
    toast("Foto uploaden…");
    try {
      const blob = await compressAvatar(file);
      const path = `${state.user.id}/avatar-${crypto.randomUUID()}.jpg`;
      const { error: upErr } = await sb.storage.from("photos").upload(path, blob, { contentType: "image/jpeg" });
      if (upErr) throw upErr;
      const { data, error } = await sb.from("profiles").update({ avatar_path: path }).eq("id", state.user.id).select().single();
      if (error) throw error;
      await removeOld();
      state.me = data; toast("Profielfoto opgeslagen"); renderProfile();
    } catch (ex) { toast("Uploaden lukte niet: " + (ex.message || ex)); }
  };
  const rmBtn = $("#avatarRemove");
  if (rmBtn) rmBtn.onclick = async () => {
    const { data, error } = await sb.from("profiles").update({ avatar_path: null }).eq("id", state.user.id).select().single();
    if (error) return toast("Verwijderen lukte niet: " + error.message);
    await removeOld();
    state.me = data; toast("Profielfoto verwijderd"); renderProfile();
  };

  $("#csvBtn").onclick = () => exportData("csv");
  $("#jsonBtn").onclick = () => exportData("json");
  $("#logoutBtn").onclick = async () => { await sb.auth.signOut(); };
}

async function exportData(kind) {
  const rows = await fetchCheckins(state.user.id);
  const flat = rows.map(c => ({
    datum: toLocalInput(c.drunk_at, c.tz).replace("T", " "),
    tijdzone: c.tz || DEVICE_TZ,
    bier: c.beer?.name,
    brouwerij: c.beer?.brewery,
    stijl: c.beer?.style,
    alcohol: c.beer?.abv,
    land: c.beer?.country,
    barcode: c.beer?.barcode,
    score: c.rating,
    gedronken_uit: c.serving,
    locatie: c.location_name,
    breedtegraad: c.latitude,
    lengtegraad: c.longitude,
    notities: c.notes,
    foto: photoUrl(c.photo_path),
  }));
  let blob, name;
  const stamp = new Date().toISOString().slice(0, 10);
  if (kind === "json") {
    blob = new Blob([JSON.stringify(flat, null, 2)], { type: "application/json" });
    name = `bierlijst-${stamp}.json`;
  } else {
    const cols = Object.keys(flat[0] || { datum: "" });
    const cell = v => {
      if (v == null) return "";
      const s = typeof v === "number" ? String(v).replace(".", ",") : String(v);
      return /[;"\n\r]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
    };
    const csv = [cols.join(";"), ...flat.map(r => cols.map(c => cell(r[c])).join(";"))].join("\r\n");
    blob = new Blob(["\ufeff" + csv], { type: "text/csv;charset=utf-8" });
    name = `bierlijst-${stamp}.csv`;
  }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

// ---------------------------------------------------------------------
// Navigatie
// ---------------------------------------------------------------------
const params = new URLSearchParams(location.search);
const publicUser = params.get("u");

async function route() {
  closeLightbox();
  if ($("#dlg").open) closeDialog();
  view().onclick = null;
  view().onchange = null;
  view().onsubmit = null;
  view().onpointerdown = null;
  if (location.hash !== "#inchecken") stopScanner();
  if (publicUser && (!location.hash || location.hash === "#")) return renderPublic(publicUser);
  if (!state.user) return renderAuth();
  if (state.me?.must_change_password) return renderForcedPassword();
  setNav(true);
  const h = location.hash.slice(1) || "lijst";
  if (h === "inchecken") return renderCheckin();
  if (h === "vrienden") return renderFriends();
  if (h === "activiteit") return renderFeed();
  if (h === "badges") return renderBadges();
  if (h === "database") return renderDatabase();
  if (h === "untappd") return renderUntappdImport();
  if (h === "controleren") return renderReview();
  if (h === "barcodes") return renderBarcodes();
  if (h === "database/nieuw") return renderBeerForm(null);
  if (h.startsWith("database/bewerk/")) return renderBeerForm(h.slice(16));
  if (h.startsWith("badges/")) return renderBadges(h.slice(7));
  if (h === "profiel") return renderProfile();
  if (h === "beheer") return renderAdmin();
  if (h.startsWith("u/")) return renderUser(h.slice(2));
  return renderMine();
}
window.addEventListener("hashchange", route);

(async function init() {
  const { data } = await sb.auth.getSession();
  state.user = data.session?.user || null;
  if (state.user) await loadMe();
  route();
  sb.auth.onAuthStateChange(async (event, session) => {
    const before = state.user?.id;
    state.user = session?.user || null;
    if (state.user && state.user.id !== before) { await loadMe(); route(); }
    if (!state.user && before) { state.me = null; location.hash = ""; route(); }
  });
})();
</script>
